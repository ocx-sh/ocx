# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  BIN_DIR: "{{.ROOT_DIR}}/test/bin"
  OCX_BINARY: "{{.BIN_DIR}}/ocx{{exeExt}}"
  # The Windows native launcher shim. test_windows_shim.py is skipif
  # non-Windows, so on Linux/macOS legs this is a harmless check-only
  # compile (the ELF is never exercised; _find_shim_binary keeps skipping
  # because no `ocx-shim.exe` exists). On windows-latest it is the binary
  # the suite drives via OCX_SHIM_BINARY — the live shim gate.
  OCX_SHIM_BINARY: "{{.BIN_DIR}}/ocx-shim{{exeExt}}"
  SKIP_BUILD: '{{.SKIP_BUILD | default .CI | default "false"}}'
  # Host port the `registry` service in docker-compose.yml binds to. Same knob
  # compose and test/conftest.py read, so exporting it once moves all three off
  # a port another project already holds. Default 5000 keeps CI unchanged.
  REGISTRY_PORT:
    sh: printf '%s' "${OCX_TEST_REGISTRY_PORT:-5000}"
  # Where pytest puts its per-test arenas. Every installing test materializes a
  # full three-tier CAS (blobs + layers + packages) under `tmp_path`, and the
  # default TMPDIR is /tmp, a tmpfs whose declared size (64G) is larger than
  # RAM+swap — so filling it is an out-of-memory, not a disk limit, and it takes
  # every other process on the box down with it. Disk-backed instead, outside
  # any git tree (a tree-local dir leaks into tooling inputs) and outside /tmp
  # (the reaper deletes a live basetemp mid-run). Override with TEST_TMPDIR=…
  # for a run that needs to land elsewhere.
  TEST_TMPDIR:
    sh: mkdir -p "${TEST_TMPDIR:-$HOME/.cache/ocx-test-tmp}" && printf '%s' "${TEST_TMPDIR:-$HOME/.cache/ocx-test-tmp}"
  # Where pytest puts `tmp_path` itself, decided by this file rather than by an
  # environment variable.
  #
  # The `TMPDIR` block below is not enough, and the reason is the one
  # `taskfiles/rust.taskfile.yml` records for `RUSTFLAGS`: **go-task's `env:`
  # loses to an inherited OS variable.** Measured here — `TMPDIR=/tmp task test`
  # reaches pytest with `TMPDIR=/tmp`, not with the value below — so any caller,
  # CI leg or wrapper that exports `TMPDIR` puts every `tmp_path` back on /tmp,
  # which on this class of host is a tmpfs declared larger than RAM+swap: filling
  # it is an out-of-memory that takes the whole box down and reads back as dozens
  # of unrelated test failures with nothing naming the cause. `--basetemp` is an
  # argument, so nothing in the environment can shadow it (verified: with
  # `TMPDIR=/tmp` inherited, `tmp_path` still landed under this var).
  #
  # `TMPDIR` stays: it moves everything pytest does NOT own, and it must keep
  # pointing off /tmp for the same reason. What it may not be is the only guard.
  #
  # It must be a DEDICATED directory: pytest deletes the basetemp's contents at
  # startup (verified — a canary file placed there is gone after one run), so
  # pointing this at a directory that holds anything else deletes it. The
  # `mkdir -p` is not decoration either: under `pytest-xdist -n auto` each
  # worker creates `<basetemp>/popen-gwN` with a NON-recursive mkdir, which
  # raises `FileNotFoundError` (an xdist INTERNALERROR, verified) when the
  # basetemp's own parent chain is missing.
  #
  # The leaf is the **checkout's own directory name**, not a fixed one, and that
  # is the same "it wipes" property read the other way: this repository's
  # workflow keeps four fixed worktrees plus per-agent ones, and two `task test`
  # runs sharing one basetemp would delete each other's live `tmp_path` trees at
  # startup — phantom failures in whichever run is older, with nothing in either
  # output naming the cause. `TASKFILE_DIR`'s parent is the checkout root, and it
  # resolves identically whether this file is entered directly or through the
  # root taskfile's `test:` include (verified with `--dry` from both).
  # Override with TEST_BASETEMP=… .
  TEST_BASETEMP:
    sh: >-
      dir="${TEST_BASETEMP:-$HOME/.cache/ocx-pytest/$(basename "$(dirname "{{.TASKFILE_DIR}}")")}";
      mkdir -p "$dir"; printf '%s' "$dir"
  # Where `default` tees the run's terminal output so `.suite-ceilings` can
  # read the summary line afterwards. A sibling of the basetemp, never inside
  # it: pytest deletes the basetemp's contents at startup, and `tee` writing
  # into an unlinked file leaves nothing to parse. Per checkout for the same
  # reason the basetemp is.
  TEST_RUN_LOG: '{{.TEST_BASETEMP}}.log'
  # Where the pytest legs write their JUnit report, on every run rather than
  # only when a caller passes the flag. Two consumers: CI uploads it and
  # publishes the check, and `task telemetry:push` turns it into per-test
  # timings on otel.ocx.sh — and a report that exists only under a
  # CI-supplied argument is one no local run ever produces, so the local half
  # of that dashboard would be empty. Absolute, because these tasks run from
  # the `test:` include's directory and the telemetry task from the root.
  # `results/` is gitignored; pytest creates the directory itself.
  JUNIT_XML: '{{.TASKFILE_DIR}}/results/junit.xml'
  SMOKE_JUNIT_XML: '{{.TASKFILE_DIR}}/results/junit-smoke.xml'
  # The smoke tier's wall-clock budget (C-012 / S-004). The local target is
  # 60 s; 90 s is the ceiling at which a slow test that was marked `smoke`
  # reds the tier instead of quietly stretching it. A literal, deliberately:
  # a budget read from the environment could be raised by the run it gates.
  SMOKE_BUDGET_SECONDS: 90

# Applies to every task in this file, so no pytest leg can miss it.
env:
  TMPDIR: "{{.TEST_TMPDIR}}"

tasks:
  # Silent unless a previous run is still alive in this checkout. Called by
  # the two entry points that start pytest, so an interrupted run never makes
  # the next one red for reasons outside the tree.
  .evict-stale-run:
    internal: true
    cmd: python3 {{.TASKFILE_DIR}}/scripts/evict_stale_run.py {{.OCX_BINARY}}

  build:
    internal: true
    # The JSON schemas are generated and gitignored, and several modules read
    # them straight off disk (test_schema.py, test_project_init.py, the taplo
    # and preservation ones). Without this they pass only on a machine where
    # someone ran the website task by hand, and red as invalid JSON on a fresh
    # checkout -- which is not a statement about the tree.
    #
    # This is a `deps:` and not a `cmds:` entry because the `status:` guard
    # below covers only a task's commands: on CI `SKIP_BUILD` defaults to true
    # (the binary arrives as an artifact) and the schemas must still be
    # generated for the readers named above. That asymmetry is also why the
    # binaries live in their own task — a caller that wants only a binary has
    # to be able to ask for only a binary, or it drags a `cargo run -p
    # ocx_schema` along with it and needs a workspace that can build.
    deps:
      - task: :website:schema:default
    cmds:
      - task: .build-binaries
        vars:
          SKIP_BUILD: "{{.SKIP_BUILD}}"

  # The binaries alone, with no schema generation. `shells` and `shell-latency`
  # mount one binary and three Python modules into a container and read no
  # schema at all, and their CI job checks out WITHOUT submodules on purpose —
  # so going through `build` there runs `cargo run -p ocx_schema` against
  # absent `external/` patch sources and reds the job on a tree that is fine.
  # Anything that runs pytest against the suite wants `build`, not this.
  .build-binaries:
    internal: true
    cmds:
      # `--features ocx/__testing` enables internal-only test seams in
      # the tier crates (currently the `__OCX_SELF_IMAGE` override in
      # `ocx_oci::identifier::ocx_cli_identifier` that lets
      # `test_self_update.py::test_self_update_installs_newer_version`
      # redirect the canonical `ocx.sh/ocx/cli` to localhost:5000). The
      # seams are loopback-only-asserted at runtime and compile-gated;
      # release builds never include them. See `crates/ocx_cli/Cargo.toml`
      # for the contract.
      - cargo build --release -p ocx -p ocx_shim --features ocx/__testing --locked
      - mkdir -p {{.BIN_DIR}}
      # Copy beside, then rename: `cp` straight onto a binary another run is
      # executing fails ETXTBSY, while a rename replaces the directory entry
      # and leaves that run on the inode it started with.
      - cp {{.ROOT_DIR}}/target/release/ocx{{exeExt}} {{.OCX_BINARY}}.new && mv {{.OCX_BINARY}}.new {{.OCX_BINARY}}
      - cp {{.ROOT_DIR}}/target/release/ocx-shim{{exeExt}} {{.OCX_SHIM_BINARY}}.new && mv {{.OCX_SHIM_BINARY}}.new {{.OCX_SHIM_BINARY}}
    status:
      - '{{eq .SKIP_BUILD "true"}}'

  default:
    desc: Run acceptance tests (builds binary + starts registry automatically)
    cmds:
      - task: .evict-stale-run
      - task: build
        vars:
          SKIP_BUILD: "{{.SKIP_BUILD}}"
      - task: .suite-floor
      # Before the suite, not after: the ceilings below are read from a parser
      # whose own red state is a fixture case, and a gate proves its tooling
      # in the run that depends on it.
      - task: ceilings:self-test
      # `set -o pipefail` so pytest's own exit status survives the `tee`; the
      # tee is what lets `.suite-ceilings` read the summary line of the run
      # that just happened rather than of some earlier one.
      - >-
        set -o pipefail;
        uv run pytest --basetemp={{.TEST_BASETEMP}} --junit-xml={{.JUNIT_XML}}
        {{.CLI_ARGS | default "-v"}}
        2>&1 | tee {{.TEST_RUN_LOG}}
      - task: .suite-ceilings
      # Per-test timings to otel.ocx.sh; a silent no-op unless this machine is
      # configured for it (taskfiles/telemetry.taskfile.yml). Reached only by a
      # green run — a red one stops at the pytest step above, and in CI the
      # push is the `test-telemetry` action's, which runs on a failed suite too.
      - task: :telemetry:push
        vars:
          JUNIT: '{{.JUNIT_XML}}'
          SUITE: acceptance
    # The environment every host-side pytest leg runs under. `smoke` takes it
    # by alias (`*pytest-env`), so a leg cannot drift from the other by
    # forgetting one variable. (An anchor on a top-level `x-shared:` mapping
    # is decoded by go-task as a variable and refused; on the task it is
    # plain YAML.)
    env: &pytest-env
      OCX_COMMAND: "{{.OCX_BINARY}}"
      # _find_shim_binary() honours OCX_SHIM_BINARY first; pointing it at the
      # copied test/bin/ocx-shim{exe} makes test_windows_shim.py a live gate
      # on windows-latest and a no-op skip elsewhere (module is skipif Win32).
      OCX_SHIM_BINARY: "{{.OCX_SHIM_BINARY}}"
      # Mirror tests that call subprocess.run with {**os.environ, ...} need
      # OCX_INSECURE_REGISTRIES to reach the plain-HTTP test registry.
      # MirrorRunner sets it per-process; this env propagates it to tests that
      # use subprocess directly (test_mirror_os_features.py). The port follows
      # OCX_TEST_REGISTRY_PORT so it cannot drift from what compose bound; CI
      # inherits the REGISTRY env var if set.
      OCX_INSECURE_REGISTRIES: "localhost:{{.REGISTRY_PORT}}"

  # The acceptance suite never shrinks or goes quiet (C-069). Both checks are
  # `cmds:` entries, never `preconditions:` — `task --force` skips
  # preconditions (verified on go-task 3.52), and a guard against a silent
  # degrade must not itself be silently skippable.
  .suite-floor:
    internal: true
    desc: >-
      Fail when the whole suite collects fewer tests than test/SUITE_FLOOR.
      The floor only ever rises, in the commit that adds the tests.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      # Collection only, never a run, and over the whole suite regardless of
      # the subset a caller passed as CLI_ARGS: the floor is a property of
      # the tree, not of one invocation. The registry never starts for it.
      # `--color=no`: with FORCE_COLOR exported the summary arrives wrapped in
      # escape codes and the count below reads as absent, red on a healthy
      # tree — nobody reads this collection's output, so it never colours.
      - >-
        floor=$(cat SUITE_FLOOR);
        summary=$(uv run pytest --collect-only -q --color=no 2>&1 | tail -n 1);
        case "$summary" in *error*)
          echo "suite floor: collection failed: $summary" >&2; exit 1;;
        esac;
        count=$(printf '%s' "$summary" | sed -nE 's/^([0-9]+) tests? collected.*/\1/p');
        [ -n "$count" ] || { echo "suite floor: no collected count in: $summary" >&2; exit 1; };
        [ "$count" -ge "$floor" ] || {
          echo "suite floor: $count tests collected, floor is $floor (test/SUITE_FLOOR) — the suite shrank" >&2; exit 1; };
        echo "suite floor: $count tests collected (floor $floor)"
    env:
      # Collection alone: no fixture runs, so the registry never starts.
      # `tests/fixtures/cosign.py` resolves the binary at import to
      # `test/bin/ocx` when OCX_COMMAND is unset — the same file `build`
      # copies there — so the pytest env block is not needed here.
      OCX_TESTS_NO_REGISTRY: "1"

  # Not `internal:`, unlike `.suite-floor`: `ceilings:self-test` below drives
  # this task from the CLI with TEST_RUN_LOG pointed at a fixture log, which
  # is the only way both polarities of the parser below get re-proved.
  .suite-ceilings:
    desc: >-
      Fail when the run's summary line reports more `skipped` than
      test/SKIP_CEILING or more `xfailed` than test/XFAIL_CEILING — a skip
      added to dodge a red is caught here, not by the collected count.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      # The log is what the terminal saw, escape codes included when a caller
      # exported FORCE_COLOR, so they are stripped before the summary is
      # looked for; and the `=` bars are absent under `-q`, so the line is
      # recognised by its counts alone — the last such line is the summary.
      # `printf '\033'` rather than `\x1b` in the pattern: BSD sed has no
      # hex escapes, GNU and BSD both take the literal byte. The count may
      # open the line (`256 skipped in 1.00s`, the `-q` shape when every test
      # skipped), so the non-digit before it is `(^|…)`, never required.
      - >-
        esc=$(printf '\033');
        summary=$(sed -E "s/$esc\[[0-9;]*m//g" {{.TEST_RUN_LOG}}
        | grep -E '(passed|failed|skipped|xfailed|error).* in [0-9.]+s' | tail -n 1);
        [ -n "$summary" ] || { echo "suite ceilings: no pytest summary line in {{.TEST_RUN_LOG}}" >&2; exit 1; };
        skipped=$(printf '%s' "$summary" | sed -nE 's/(^|.*[^0-9])([0-9]+) skipped.*/\2/p');
        xfailed=$(printf '%s' "$summary" | sed -nE 's/(^|.*[^0-9])([0-9]+) xfailed.*/\2/p');
        skip_ceiling=$(cat SKIP_CEILING); xfail_ceiling=$(cat XFAIL_CEILING);
        [ "${skipped:-0}" -le "$skip_ceiling" ] || {
          echo "suite ceilings: $skipped skipped exceeds test/SKIP_CEILING ($skip_ceiling): $summary" >&2; exit 1; };
        [ "${xfailed:-0}" -le "$xfail_ceiling" ] || {
          echo "suite ceilings: $xfailed xfailed exceeds test/XFAIL_CEILING ($xfail_ceiling): $summary" >&2; exit 1; };
        echo "suite ceilings: ${skipped:-0} skipped (ceiling $skip_ceiling), ${xfailed:-0} xfailed (ceiling $xfail_ceiling)"

  ceilings:self-test:
    desc: Show the suite-ceilings parser red on an over-ceiling pytest summary and green on a clean one
    summary: |
      `.suite-ceilings` above is a shell parser, and its red state lived in a
      commit message — nothing in the tree re-proved it. These two fixture
      lines are that proof, run by `default` before the suite it gates.

      The red one carries a skipped count no ceiling will ever permit, so the
      case cannot go vacuous when test/SKIP_CEILING moves. The green one
      carries `1 skipped, 1 xfailed`, never zeroes, and the case asserts the
      parser SAYS both counts: `${skipped:-0}` means a sed that stopped
      matching reports zero, so a zero-count fixture is green whether or not
      the extraction still works.

      The red half reads the message, not the exit status. `if <task>; then
      fail` is satisfied by a renamed task, an unreadable log or an argument
      typo exactly as well as by the ceiling gating, so a parser that never
      reaches the comparison is green — the assertion below names the
      comparison's own wording, and says so when the run failed for some
      other reason.

      The nested call names this taskfile explicitly: entered through the root
      `test:` include the task is `test:.suite-ceilings`, entered directly it
      is `.suite-ceilings`, and `-t` is what makes the case indifferent.
    dir: '{{.TASKFILE_DIR}}'
    vars:
      RED_SKIPPED: '999999'
      RED_SUMMARY: '1 passed, {{.RED_SKIPPED}} skipped in 1.00s'
      GREEN_SUMMARY: '10 passed, 1 skipped, 1 xfailed in 1.00s'
      # `-s`: without it go-task echoes the task body to STDERR, and the body
      # contains the very phrase the red half looks for — the assertion would
      # then match the script quoting itself and pass for any failure at all.
      CEILINGS: task -s -t {{.TASKFILE_DIR}}/taskfile.yml .suite-ceilings
      # Carries the runtime count for the same reason: `$skipped skipped
      # exceeds …` is in the body, `999999 skipped exceeds …` can only be output.
      RED_REASON: '{{.RED_SKIPPED}} skipped exceeds test/SKIP_CEILING'
    cmds:
      - >-
        log=$(mktemp); trap 'rm -f "$log"' EXIT;
        printf '%s\n' '{{.RED_SUMMARY}}' > "$log";
        status=0;
        red=$({{.CEILINGS}} TEST_RUN_LOG="$log" 2>&1 >/dev/null) || status=$?;
        [ "$status" -ne 0 ] || {
          echo "ceilings self-test: the parser accepted 999999 skipped — it is not gating" >&2; exit 1; };
        case "$red" in *'{{.RED_REASON}}'*) ;; *)
          echo "ceilings self-test: the red run exited $status without reaching the ceiling — it failed for another reason: $red" >&2; exit 1;;
        esac;
        printf '%s\n' '{{.GREEN_SUMMARY}}' > "$log";
        green=$({{.CEILINGS}} TEST_RUN_LOG="$log" 2>/dev/null | tail -n 1);
        case "$green" in *'suite ceilings: 1 skipped'*'1 xfailed'*) ;; *)
          echo "ceilings self-test: the parser read no counts from a 1-skipped 1-xfailed summary: $green" >&2; exit 1;;
        esac;
        echo "ceilings self-test: parser red on 999999 skipped, green reading 1 skipped and 1 xfailed"

  smoke:
    desc: >-
      The smoke tier: one marked happy path per visible top-level verb
      (`-m smoke`, 22 verbs), parallel, registry only — the Sigstore stack never
      starts. Budgeted at 90 s wall clock; the local target is 60 s.
    cmds:
      - task: .evict-stale-run
      - task: build
        vars:
          SKIP_BUILD: "{{.SKIP_BUILD}}"
      # The tier's own coverage contract (every visible verb has a marked
      # test, none touches the signing surface) is not `smoke`-marked, so the
      # `-m smoke` selection below never collects it: it runs on its own,
      # outside the clock and without a registry — it reads source only.
      - OCX_TESTS_NO_REGISTRY=1 uv run pytest --basetemp={{.TEST_BASETEMP}} tests/test_smoke_coverage.py
      # `--dist loadgroup` for the same reason `parallel` passes it: a marked
      # test that carries an `xdist_group` keeps its group. The clock wraps
      # the pytest invocation only — the build above is not the tier's cost.
      - >-
        start=$(date +%s);
        uv run pytest --basetemp={{.TEST_BASETEMP}} --junit-xml={{.SMOKE_JUNIT_XML}}
        -m smoke -n auto --dist loadgroup
        {{.CLI_ARGS | default "-v"}};
        elapsed=$(( $(date +%s) - start ));
        [ "$elapsed" -le {{.SMOKE_BUDGET_SECONDS}} ] || {
          echo "smoke tier: ${elapsed}s wall clock exceeds the {{.SMOKE_BUDGET_SECONDS}} s budget" >&2; exit 1; };
        echo "smoke tier: ${elapsed}s wall clock (budget {{.SMOKE_BUDGET_SECONDS}} s)"
      # Outside the timed block above on purpose: the budget measures the
      # tier, not what this repository does with its report.
      - task: :telemetry:push
        vars:
          JUNIT: '{{.SMOKE_JUNIT_XML}}'
          SUITE: smoke
    env: *pytest-env

  quick:
    desc: Run acceptance tests in parallel without rebuilding the binary
    cmds:
      - task: default
        vars:
          SKIP_BUILD: "true"
          # `--dist loadgroup` honours `@pytest.mark.xdist_group` so resource-
          # contended modules (test_patches.py shares the registry-wide global
          # patch descriptor slot) run serially on one worker while the rest
          # parallelize.
          CLI_ARGS: '-n auto --dist loadgroup {{.CLI_ARGS | default "-v"}}'

  parallel:
    desc: Run acceptance tests in parallel
    cmds:
      - task: default
        vars:
          # `--dist loadgroup` honours `@pytest.mark.xdist_group` so resource-
          # contended modules (test_patches.py shares the registry-wide global
          # patch descriptor slot) run serially on one worker while the rest
          # parallelize.
          CLI_ARGS: '-n auto --dist loadgroup {{.CLI_ARGS | default "-v"}}'

  scoped:
    desc: >-
      Run the acceptance subset the named crates own (`task test:scoped --
      ocx_config ocx_shell`). Every glob of a selected row must collect at
      least one test; a crate without a row, an `escalate` row, or an empty
      selection fails.
    vars:
      # crate → command → test-glob table (plan_crate_split_workspace.md
      # C-022). Hand-maintained from the ADR crate map's command ownership;
      # one row per crate, globs relative to test/. A row that reads
      # `escalate` has the whole suite as its subset — `task verify` — and
      # scripts/scoped_gate.py TABLE_ESCALATES mirrors those rows so the gate
      # escalates before spending the per-crate steps (its --self-test keeps
      # the two in step).
      SCOPED_ROWS:
        map:
          # exit codes / error categories
          ocx_exit: tests/test_exit_codes.py
          # fs, archive extraction, TLS roots
          ocx_util: tests/test_archive_containment.py tests/test_extra_ca_certs.py tests/test_package_create_extract.py
          # rendering, progress, colour, completion output
          ocx_console: tests/test_color.py tests/test_progress_channel.py tests/test_pull_progress.py tests/test_completion_ascii.py
          # registry transport, references, layers, referrers, auth (`login`, `push`, `tag`)
          ocx_oci: tests/test_layer_layout.py tests/test_multi_layer.py tests/test_push*.py tests/test_referrers_*.py tests/test_proxy_registry.py tests/test_oci_registry_mirror.py tests/test_login.py tests/test_tag_*.py tests/test_registry_startup_retry.py tests/test_resolution_chain_refs.py tests/test_logging.py
          # signer-identity policy (`trust`)
          ocx_trust: tests/test_trust_*.py tests/test_logging.py
          # `sign`, `attest`, `verify`, cosign interop, SBOM referrers
          ocx_sign: tests/test_sign*.py tests/test_attest.py tests/test_verify.py tests/test_auto_verify.py tests/test_offline_verify.py tests/test_cosign_*.py tests/test_sbom.py
          # `config`, managed tier, `--frozen`
          ocx_config: tests/test_config*.py tests/test_managed_config.py tests/test_frozen.py
          # CAS + symlink namespace (`install`, `uninstall`, `purge`, `clean`, `which`), shim blob
          ocx_store: tests/test_install.py tests/test_uninstall.py tests/test_purge.py tests/test_clean*.py tests/test_assembly.py tests/test_cross_platform_materialize.py tests/test_cross_repo_dedup.py tests/test_path_idempotency.py tests/test_which.py tests/test_windows_shim.py
          # `index`, catalog, warm resolve
          ocx_index: tests/test_index*.py tests/test_catalog_readme.py tests/test_warm_resolve_no_network.py
          # `package create|push|pull|inspect|copy|cascade|description`, metadata, variants
          ocx_package: tests/test_package_create_*.py tests/test_package_push*.py tests/test_package_pull.py tests/test_package_info.py tests/test_package_inspect*.py tests/test_package_lifecycle.py tests/test_package_copy.py tests/test_package_cascade.py tests/test_package_receipt.py tests/test_cascade.py tests/test_describe.py tests/test_metadata_forward_compat.py tests/test_variants.py tests/test_platform_pairs.py
          # `shell`, `ci export`, `direnv`, activation output
          ocx_shell: tests/test_shell_*.py tests/test_ci_export.py tests/test_direnv.py tests/test_lazy_direnv.py tests/test_toolchain_activate.py tests/test_toolchain_render.py tests/test_completion_ascii.py
          # `project *`, `lock`, lazy loading, project toolchain, trampoline
          ocx_project: tests/test_project_*.py tests/test_lazy_loading.py tests/test_lock.py tests/test_toolchain_cli.py tests/test_toolchain_offline_after_pull.py tests/test_global_toolchain.py tests/test_doc_project_toolchain.py tests/test_taplo_project_toolchain.py tests/test_trampoline_exec.py
          # `env`, `exec`, `run`, `update`, `select`, `status`, `inspect`, `offline`, patches, records, entrypoints
          ocx_package_manager: tests/test_env*.py tests/test_exec*.py tests/test_patch*.py tests/test_dependencies.py tests/test_deps_interpolation.py tests/test_entrypoints*.py tests/test_launcher_exec.py tests/test_run_global_isolation.py tests/test_update.py tests/test_select.py tests/test_offline*.py tests/test_pinned_offline.py tests/test_install_libc.py tests/test_status.py tests/test_inspect*.py tests/test_toolchain_env.py tests/test_plugin_dispatch.py
          # `package announce`, `package claim`, forge drivers, git transport
          ocx_announce: tests/test_announce*.py tests/test_package_claim.py tests/test_transport_git.py tests/test_fake_forge_mergeability.py tests/test_git_http_fixture.py
          # `package test --script`
          ocx_script: tests/test_package_test*.py
          # `self setup|update|activate`, session PATH, update-check throttle
          ocx_setup: tests/test_self_*.py tests/test_session_path.py tests/test_update_check_throttle.py
          # dev-dependency-only fixtures: no acceptance subset of its own
          ocx_test_support: escalate
          # phase 1: the monolith owns every verb
          # phase 1: the binary still holds every command file (crates/ocx_cli/src/command/*),
          # so a change there can touch any verb. Reverts to its own subset — exit codes,
          # deprecated spellings, command reference, plugin dispatch, smoke coverage —
          # when the verbs move out.
          ocx: escalate
          ocx_schema: tests/test_schema*.py
          ocx_shim: tests/test_windows_shim.py
      # Every selected row's globs, space-joined, for the union run below.
      SELECTED: '{{range splitList " " .CLI_ARGS}}{{index $.SCOPED_ROWS .}} {{end}}'
    cmds:
      - '[ -n "{{.CLI_ARGS}}" ] || { echo "test:scoped: no crate named — usage: task test:scoped -- <crate>..." >&2; exit 1; }'
      # Per crate, per glob: the glob must exist in the table, must not be an
      # `escalate` row, and must collect at least one test — a stale glob
      # beside a live one is a failure, never a silent coverage loss.
      # `--color=no` for the same reason as `.suite-floor`: under FORCE_COLOR
      # the count arrives wrapped in escape codes and reads as absent.
      - for: { var: CLI_ARGS }
        cmd: >-
          row='{{index .SCOPED_ROWS .ITEM}}';
          [ -n "$row" ] || { echo "test:scoped: no row for crate '{{.ITEM}}' — add one to SCOPED_ROWS in test/taskfile.yml" >&2; exit 1; };
          [ "$row" != escalate ] || { echo "test:scoped: {{.ITEM}} row reads escalate — its subset is the whole suite; run 'task verify'" >&2; exit 1; };
          for glob in $row; do
            summary=$(uv run pytest --collect-only -q --color=no $glob 2>&1 | tail -n 1);
            count=$(printf '%s' "$summary" | sed -nE 's/^([0-9]+) tests? collected.*/\1/p');
            [ -n "$count" ] && [ "$count" -ge 1 ] || { echo "test:scoped: {{.ITEM}} glob '$glob' collects no test: $summary" >&2; exit 1; };
            echo "test:scoped: {{.ITEM}} $glob -> $count tests";
          done
      # The union run goes through `default`, so the binary, the suite floor,
      # the ceilings and the pytest env are the ones every other leg uses.
      - task: default
        vars:
          SKIP_BUILD: "{{.SKIP_BUILD}}"
          CLI_ARGS: '-n auto --dist loadgroup -v {{.SELECTED}}'
    env:
      # Collection only for the per-glob check; the registry never starts
      # (the same reason `.suite-floor` sets it).
      OCX_TESTS_NO_REGISTRY: "1"

  lint:
    desc: Lint the acceptance suite with ruff (rule set + Python floor in pyproject.toml)
    # No `sources:`/`generates:`, deliberately, and for the same reason
    # `ci:actionlint` has none: a lint that is fingerprint-cached reports the
    # verdict of the last run it actually did. A cached green is
    # indistinguishable from a lint that never ran, which is the whole failure
    # mode this task exists to close. It is fast enough that caching buys
    # nothing worth that.
    #
    # `uv run` (not `ocx exec`, not a bare `ruff`) because ruff is a member of
    # this directory's own [dependency-groups] dev, exactly like pytest and
    # every other Python tool here -- so the version is pinned by uv.lock and
    # the rule set cannot drift under the gate.
    cmd: uv run ruff check .

  shells:
    desc: >-
      Build the shell-zoo Docker image and run the all-shell activation matrix
      (test_shell_activation.py) in-container — proves `ocx self setup` activation
      survives an unset OCX_HOME in every shell. Requires Docker. Defaults to the
      Debian/glibc image + the local glibc binary; CI overrides the vars for the
      Alpine/musl leg.
    vars:
      SHELLS_IMAGE: '{{.SHELLS_IMAGE | default "ocx-shells-debian"}}'
      SHELLS_DOCKERFILE: '{{.SHELLS_DOCKERFILE | default "docker/shells.Dockerfile"}}'
      SHELLS_OCX_BINARY: '{{.SHELLS_OCX_BINARY | default .OCX_BINARY}}'
      # Which interpreters an absent installation is FATAL for, derived from the
      # image rather than restated per CI leg. The Debian zoo installs pwsh,
      # nushell and elvish from pinned upstream tarballs; the Alpine one
      # deliberately ships none of the three, so its list stays the apk set.
      # nushell answers to both spellings (`missing_arm_is_fatal` matches the arm
      # name or its binary), and both are listed so the Rust seam of the same
      # name — which only ever sees `nu` — agrees with the Python one.
      SHELLS_REQUIRE_LIVE: >-
        {{if hasSuffix "shells.alpine.Dockerfile" .SHELLS_DOCKERFILE}}sh,dash,ash,bash,zsh,fish{{else}}sh,dash,ash,bash,zsh,fish,pwsh,nushell,nu,elvish{{end}}
    cmds:
      # `docker run -v` on a missing source path silently creates a DIRECTORY at
      # the destination, which pytest collects as an empty package: a moved or
      # renamed module makes this leg run three modules' worth of mounts but two
      # modules' worth of tests, and still exit 0 — nothing in the job output
      # tells the two states apart. Refuse instead. This is a `cmds:` entry and
      # not a `preconditions:` one on purpose: `task --force` skips preconditions
      # (verified on go-task 3.52), and a guard against a silent degrade must not
      # itself be silently skippable.
      - >-
        missing='';
        for f in tests/test_shell_activation.py tests/test_shell_reconcile.py
        tests/test_shell_reconcile_edge_cases.py src/shell_matrix.py; do
        [ -f "{{.TASKFILE_DIR}}/$f" ] || missing="$missing $f";
        done;
        [ -z "$missing" ] || { echo "missing shell-zoo mount source(s):$missing" >&2; exit 1; }
      - task: .build-binaries
        vars:
          SKIP_BUILD: "{{.SKIP_BUILD}}"
      - docker build -f {{.TASKFILE_DIR}}/{{.SHELLS_DOCKERFILE}} -t {{.SHELLS_IMAGE}} {{.TASKFILE_DIR}}/docker
      # `__OCX_TESTING_REQUIRE_LIVE_SHELLS` turns "interpreter absent → skip"
      # into a failure, because a skip and a pass carry the same evidence. It is
      # set once for the whole run and honoured by all three modules — the two
      # reconciler ones through `shell_matrix.missing_arm_is_fatal`, and
      # `test_shell_activation.py` through its own `_require`, which routes
      # every interpreter and tool lookup in that module through the same seam.
      # The list is per image (SHELLS_REQUIRE_LIVE above), not the intersection
      # of the two: pwsh, nushell and elvish exist on the Debian leg, so a skip
      # there is a defect rather than an environment fact.
      #
      # No `--basetemp` here, deliberately, unlike every host-side pytest leg
      # above: the container writes to its own ephemeral upper layer, not to
      # this host's /tmp tmpfs, so the failure `--basetemp` exists to prevent is
      # not reachable in here — and a host path passed into the container names
      # a directory that does not exist there.
      - >-
        docker run --rm
        -v "{{.SHELLS_OCX_BINARY}}:/work/ocx:ro"
        -v "{{.TASKFILE_DIR}}/tests/test_shell_activation.py:/work/test_shell_activation.py:ro"
        -v "{{.TASKFILE_DIR}}/tests/test_shell_reconcile.py:/work/test_shell_reconcile.py:ro"
        -v "{{.TASKFILE_DIR}}/tests/test_shell_reconcile_edge_cases.py:/work/test_shell_reconcile_edge_cases.py:ro"
        -v "{{.TASKFILE_DIR}}/src/shell_matrix.py:/work/shell_matrix.py:ro"
        -e OCX_ACTIVATION_BINARY=/work/ocx
        -e __OCX_TESTING_REQUIRE_LIVE_SHELLS={{.SHELLS_REQUIRE_LIVE}}
        {{.SHELLS_IMAGE}}
        python3 -m pytest -v -p no:cacheprovider
        /work/test_shell_activation.py /work/test_shell_reconcile.py
        /work/test_shell_reconcile_edge_cases.py

  shell-latency:
    desc: >-
      NFR latency gate for the per-prompt reconciler (C-044): zero execs on the
      no-op prompt path, shell startup within exec_floor + 2 ms and the
      per-prompt reconcile - in `env` mode AND in `bin` mode (D-V5) - within
      exec_floor + 10 ms, with the floor measured in the same run. It also
      measures validation item 37, the trampoline re-entry overhead, asserted
      against the owner's 10 ms composed-env-cache trigger ABOVE the same
      bare-exec floor - the raw figure carries one whole ocx spawn, which a
      macOS runner charges 11.2 ms for, and is reported beside it. Both
      measured commands are DERIVED at run time - startup from the shipped
      env.sh sourced by a real interactive bash, reconcile from the hook body
      the binary just emitted - so the gate drives the production interactivity
      decision (rung 5) rather than a --hook override no shell passes. The two
      wall-clock asserts have a third outcome, INCONCLUSIVE, when the bare-exec
      floor itself scattered wider than the 2 ms under test; the deterministic
      gates decide on every runner regardless. Writes
      bench/results/shell-latency.json. The fault-injected red state runs in the
      SAME invocation, so a green here cannot be produced by the gate not
      running.
    dir: '{{.TASKFILE_DIR}}'
    vars:
      LATENCY_OCX_BINARY: '{{.LATENCY_OCX_BINARY | default .OCX_BINARY}}'
      LATENCY_RESULTS_DIR: '{{.LATENCY_RESULTS_DIR | default "bench/results"}}'
    cmds:
      - task: .build-binaries
        vars:
          SKIP_BUILD: "{{.SKIP_BUILD}}"
      # 1. The pure functions, on inputs nobody has to schedule - the evaluator's
      #    gates and the `--expect-fail-gate` matcher, each in both colours.
      #    Cheap, deterministic, and it fails before a single process is spawned
      #    if the arithmetic or a gate name drifts. It prints its own tally; this
      #    comment deliberately does not restate the counts, because the last one
      #    written here went stale the moment cases were added.
      - uv run --no-project python bench/shell_latency.py --self-check
      # 2. The live gate. Exit 1 on any failed assert - no tolerated range.
      - >-
        OCX_COMMAND={{.LATENCY_OCX_BINARY}}
        uv run --no-project python bench/shell_latency.py
        --out {{.LATENCY_RESULTS_DIR}}/shell-latency.json
      # 3. Fault injection (plan section 7.6), 11 ms against a 2 ms startup budget
      #    and a 10 ms reconcile budget - an EDGE test, not a sledgehammer.
      #
      #    It is sized by two rules, and both hold for both legs again. Rule one:
      #    the injection must exceed the budget ON ITS OWN, so the red does not
      #    depend on the baseline - a machine where the measured work were free
      #    still reds. 11 > 10 and 11 > 2. It was 3 ms until 2026-08-26 and briefly
      #    failed this rule for the reconcile when that budget moved 2 -> 3 ms:
      #    the leg still went red, but only because ~2 ms of real reconcile sat
      #    underneath, which is a detection one faster machine away from silently
      #    passing. `bench/shell_latency.py` now REFUSES an --expect-fail-gate run
      #    whose injection does not clear every budget it is pointed at, checked
      #    against the live value and this run`s own gates, so the collision
      #    cannot come back unnoticed the next time a budget moves.
      #
      #    Rule two: it must not overshoot, or the step certifies only that an
      #    assert exists. The delay lands on top of the real work, so at 7 ms the
      #    observed deltas were ~7.5 (startup) and ~11.8 (reconcile) - 1.9x the
      #    then-6.1 ms reconcile budget. At 11 ms it was measured twice on a quiet
      #    dev box - 11.544 / 11.712 (startup), 16.050 / 16.106 (reconcile) - and
      #    once on the GitHub runner this step actually runs on, which is the
      #    slower of the two and therefore the one the rule is read against:
      #    11.972 and 17.340. So the same run would NOT red a 12 / 18 ms pair - it
      #    is testing the numbers, not their presence, and at 1.7x the reconcile
      #    budget it is tighter than the 1.9x it replaces. Quote the runner's pair
      #    and not the dev box's: a sizing rule derived from the quieter machine
      #    is the same laundering `shell_latency.py`'s budget notes spend three
      #    paragraphs refusing. The previous 8 ms / 100 ms pair was 4x its budget
      #    on both legs and would have passed a budget nearly twice as loose.
      #
      #    It went 4 -> 7 ms when the reconcile budget went 3 -> 6.1, and 7 -> 11
      #    when it went 6.1 -> 10, which is rule one doing its job:
      #    `shell_latency.py` refuses the run outright when the injection stops
      #    clearing a budget it is pointed at (`inject <= gate.budget`), so this
      #    value cannot be left behind by a budget move.
      #
      #    The delay lands INSIDE the measured processes (`shell::hook::registration`
      #    for startup, `shell::hook::checkpoint` for the reconcile, both gated on
      #    the `__testing` feature), never around them, so a gate pointed at a
      #    command that emits neither records no delay and this step fails - which
      #    is the whole point of running it. One run covers both seams because
      #    each measured command is its own process with its own copy of the
      #    variable; the floor never receives it. `--expect-fail` inverts the exit
      #    code, so this step fails if the gate PASSES, and `--expect-fail-gate`
      #    is repeatable with EVERY named gate required to be red - so a red on
      #    one budget cannot stand in for another's, which is what a single
      #    unnamed `--expect-fail` would have allowed. Running this on every
      #    invocation is what makes step 2's green mean something.
      #
      #    THREE needles since D-V5, not two: the `bin`-mode reconcile row is a
      #    third `--reconcile` process, so it pays at the same `hook::checkpoint`
      #    seam and reds under the same 11 ms. Its gate is named `bin-mode prompt
      #    reconcile` and NOT `per-prompt reconcile in bin mode`, because needles
      #    match by substring: under the second spelling either row's red would
      #    satisfy both needles and this step would certify a gate it never
      #    observed. `shell_latency.py`'s self-check asserts that disjointness on
      #    every invocation, before a process is spawned.
      #
      #    The gates the injection CANNOT red are deliberately unnamed: the arena
      #    non-vacuity counts (locked tools, composed keys, trampolines, the bin
      #    PATH entry) and item 37's two instrument controls, which time an
      #    `ocx exec` that emits no hook and therefore receives no delay. Naming
      #    one would demand a red state no run can produce. Their own red states
      #    are demonstrated in the self-check, on inputs nobody has to schedule.
      #
      #    It is also the live control on the contention classifier that gives
      #    those two asserts their INCONCLUSIVE outcome. The injected delay lands
      #    in the measured processes and never in the floor, so on any runner
      #    quiet enough to measure at all the floor stays tight, the classifier
      #    reaches its red branch, and both gates go red - measured here at a
      #    0.503 ms floor scatter against 3.758 / 4.512 ms deltas. A classifier
      #    that started abstaining everywhere would leave this step with no red
      #    to name. On a genuinely contended runner this step abstains too and
      #    exits 0 with a `::warning`, which is the same honest answer step 2
      #    gives: neither an assertion nor its demonstration can be made on a
      #    measurement of the runner. That amnesty is PER NEEDLE since
      #    2026-09-07: the macOS leg failed with two of the three needles
      #    demonstrated and `per-prompt reconcile` abstaining on 23.188 ms of
      #    floor scatter, which the step reported as a failed injection when one
      #    third of it had simply not been measurable. A needle whose gate
      #    abstained is warned about and excused; a needle whose gate
      #    conclusively PASSED under the injection is still an error, because an
      #    assert whose red state is unreachable never abstains - it passes.
      - >-
        OCX_COMMAND={{.LATENCY_OCX_BINARY}}
        __OCX_TESTING_LATENCY_INJECT_MS=11.0
        uv run --no-project python bench/shell_latency.py --expect-fail
        --expect-fail-gate 'shell startup <='
        --expect-fail-gate 'per-prompt reconcile'
        --expect-fail-gate 'bin-mode prompt reconcile'
        --out {{.LATENCY_RESULTS_DIR}}/shell-latency-injected.json

  # ---------------------------------------------------------------------------
  # Benchmark targets (bench: namespace)
  # All bench tasks require `task bench:setup` first (Docker bench profile).
  # `task test` is unaffected — the bench profile is never started by default.
  # ---------------------------------------------------------------------------

  bench:setup:
    desc: >-
      Start the bench Docker-compose profile (toxiproxy + registry). Required
      before running any bench:* target. Fails with a clear message when Docker
      is unavailable.
    dir: '{{.TASKFILE_DIR}}'
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: >-
          Docker is not running or not accessible.
          Start Docker and re-run `task bench:setup`.
    cmds:
      - docker compose -f {{.TASKFILE_DIR}}/docker-compose.yml --profile bench up -d
      # Wait for toxiproxy API to become reachable (up to 15 s).
      - >-
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8474/version > /dev/null 2>&1; then
            echo "toxiproxy API ready."; break;
          fi;
          sleep 0.5;
        done
      # Wait for registry to become reachable (already running from prior `task test`,
      # but in case bench:setup is called standalone).
      - >-
        for i in $(seq 1 30); do
          if curl -sf http://localhost:{{.REGISTRY_PORT}}/v2/ > /dev/null 2>&1; then
            echo "registry ready."; break;
          fi;
          sleep 0.5;
        done

  bench:teardown:
    desc: >-
      Stop the bench-proxy container only — leaves registry + mirror-registry running
      so `task test` is unaffected. Use `docker compose down` manually to stop everything.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - docker compose -f {{.TASKFILE_DIR}}/docker-compose.yml --profile bench stop bench-proxy
      - docker compose -f {{.TASKFILE_DIR}}/docker-compose.yml --profile bench rm -f bench-proxy

  bench:baseline:
    desc: >-
      Run the full benchmark matrix against the CURRENT (pre-optimization) binary
      and save results as test/bench/baseline.json. Run this BEFORE any
      optimization lands. Requires bench:setup and hyperfine.
    dir: '{{.TASKFILE_DIR}}'
    deps: [build, bench:setup, .bench:acquire-hyperfine]
    cmds:
      - uv run python bench/harness.py --save-baseline
    env:
      OCX_COMMAND: "{{.OCX_BINARY}}"
      BENCH_RESULTS_DIR: "{{.TASKFILE_DIR}}/bench/results"

  bench:
    desc: >-
      Run the medium suite (regression gate, <4 min) and compare against baseline.json.
      Exits 1 if any scenario regresses beyond the 0.85x threshold.
      Requires bench:setup and hyperfine.
    dir: '{{.TASKFILE_DIR}}'
    deps: [build, bench:setup, .bench:acquire-hyperfine]
    cmds:
      - uv run python bench/harness.py --suite medium --compare
    env:
      OCX_COMMAND: "{{.OCX_BINARY}}"
      BENCH_RESULTS_DIR: "{{.TASKFILE_DIR}}/bench/results"

  bench:quick:
    desc: >-
      Fast subset benchmark (<1 min): small suite (unthrottled + 100 Mbps + parallel_2_processes).
      Fixture push skipped when registry already has the packages (deterministic repo names).
      Compares against baseline where entries exist. Requires bench:setup and hyperfine.
    dir: '{{.TASKFILE_DIR}}'
    deps: [build, bench:setup, .bench:acquire-hyperfine]
    cmds:
      - uv run python bench/harness.py --suite small --compare
    env:
      OCX_COMMAND: "{{.OCX_BINARY}}"
      BENCH_RESULTS_DIR: "{{.TASKFILE_DIR}}/bench/results"

  bench:large:
    desc: >-
      Extended benchmark run (<10 min): large suite adds higher-runs rows (runs=10)
      and larger payloads (50 MB, 25 MB layer rows) for tighter σ.
      Run before landing optimizations where statistical confidence matters.
      Requires bench:setup and hyperfine.
    dir: '{{.TASKFILE_DIR}}'
    deps: [build, bench:setup, .bench:acquire-hyperfine]
    cmds:
      - uv run python bench/harness.py --suite large --compare
    env:
      OCX_COMMAND: "{{.OCX_BINARY}}"
      BENCH_RESULTS_DIR: "{{.TASKFILE_DIR}}/bench/results"

  bench:scenario:
    desc: >-
      Run one or more named scenarios: task test:bench:scenario -- <name> [<name>...]
      Uses 3 runs, no warmup. Requires bench:setup and hyperfine.
    dir: '{{.TASKFILE_DIR}}'
    deps: [build, bench:setup, .bench:acquire-hyperfine]
    cmds:
      - uv run python bench/harness.py --scenarios {{.CLI_ARGS}} --runs 3 --warmup 0
    env:
      OCX_COMMAND: "{{.OCX_BINARY}}"
      BENCH_RESULTS_DIR: "{{.TASKFILE_DIR}}/bench/results"

  bench:report:
    desc: >-
      Generate the static HTML dashboard from the latest bench results.
      Writes test/bench/results/index.html (self-contained; no Docker required).
      Open the printed path in a browser to view the dashboard.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - uv run python bench/report.py

  .bench:acquire-hyperfine:
    desc: Download hyperfine 1.20.0 into test/bin/ if not already on PATH or in test/bin/.
    internal: true
    dir: '{{.TASKFILE_DIR}}'
    # status: exit 0 = up-to-date; hyperfine already on PATH or already in test/bin/.
    # `which hyperfine` succeeds if on PATH; `test -x` checks test/bin/ fallback.
    status:
      - which hyperfine || test -x {{.TASKFILE_DIR}}/bin/hyperfine
    cmds:
      - mkdir -p {{.TASKFILE_DIR}}/bin
      # Tag is positional, not a flag. Asset name verified against sharkdp/hyperfine
      # v1.20.0 release: hyperfine-v1.20.0-x86_64-unknown-linux-musl.tar.gz
      # The tarball extracts to hyperfine-v1.20.0-x86_64-unknown-linux-musl/hyperfine.
      # TODO: revisit once hyperfine is mirrored on ocx.sh (dogfood opportunity).
      - >-
        gh release download v1.20.0
        -R sharkdp/hyperfine
        -p 'hyperfine-v1.20.0-x86_64-unknown-linux-musl.tar.gz'
        -D /tmp/hyperfine-dl
        --clobber
      - tar -xzf /tmp/hyperfine-dl/hyperfine-v1.20.0-x86_64-unknown-linux-musl.tar.gz -C /tmp/hyperfine-dl
      - install -m755 /tmp/hyperfine-dl/hyperfine-v1.20.0-x86_64-unknown-linux-musl/hyperfine {{.TASKFILE_DIR}}/bin/hyperfine
      - rm -rf /tmp/hyperfine-dl

  doc-scripts:list:
    desc: Print the doc-script discovery export as JSON (PT6 seam for website publish task)
    dir: '{{.TASKFILE_DIR}}'
    cmd: uv run python scripts/doc_scripts_list.py
    env:
      OCX_DOC_SCRIPTS_ROOT: '{{.OCX_DOC_SCRIPTS_ROOT | default ""}}'

  index-conformance-drift:
    desc: >-
      Fail if the vendored ocx-sh/indexbot conformance fixtures
      (crates/ocx_index/tests/fixtures/index_wire/, plus tag_verdicts.json under
      crates/ocx_package/, which is vendored beside its reader) differ from that
      repo's current main. Network-bound and NOT wired into `task verify` — the vendored copy
      exists to keep the test suite offline. Runs on verify-deep.yml's weekly
      schedule, which bounds the drift window to 7 days without adding a network
      dependency to every PR.
    dir: '{{.TASKFILE_DIR}}'
    cmd: ./scripts/sync_index_conformance.sh --check

  doc-scripts:drift:
    desc: >-
      Run the full doc-script drift gate for ALL # doc: scripts (registry-backed
      executor + static binding/parser/publish collections). A convenience
      subset-runner, not a separate CI-only gate: every module it names here is
      already collected unconditionally by `test:parallel` (see that task's
      `sources:` comment above), so this is the same gate scoped down to iterate
      on doc scripts without the rest of the acceptance suite.
    cmds:
      - task: build
        vars:
          SKIP_BUILD: "{{.SKIP_BUILD}}"
      - >-
        uv run pytest -n auto --basetemp={{.TEST_BASETEMP}}
        tests/test_doc_scripts.py
        tests/test_doc_binding.py
        tests/test_doc_scripts_parser.py
        tests/test_doc_scripts_publish.py
        tests/test_doc_scripts_executor.py
        tests/test_doc_scripts_cast.py
        tests/test_doc_scripts_one_tree.py
        {{.CLI_ARGS | default "-q"}}
    env:
      OCX_COMMAND: "{{.OCX_BINARY}}"
