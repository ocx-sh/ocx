[project]
name = "ocx-tests"
version = "0.0.0"
# 3.14 is this suite's own floor, above the project's: the `.tar.zst` rows of
# test_package_create_extract.py need `compression.zstd`, stdlib only from 3.14,
# and no other zstd writer is a test dependency. Declared as the floor rather
# than guarded with `pytest.importorskip`, because uv resolves the interpreter
# itself and no workflow pins a version — a skip there is invisible, and a green
# suite that silently never built a .tar.zst is worse than a refusal to run.
# ruff derives `target-version` from this line too (the earlier 3.10 declaration
# made three f-strings read as syntax errors, and a file ruff cannot parse is a
# file ruff does not lint), so the linter cannot disagree with the interpreter.
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." exposes the `src` package (`from src.helpers import ...`, the suite-wide
# convention); "src" additionally exposes `announce_e2e` as a top-level import
# so the Track D evidence module does not drag `src/__init__.py`'s registry /
# oras imports into a pure-logic unit test. Scripts outside pytest set
# PYTHONPATH=<repo>/test/src for the same reason.
pythonpath = [".", "src"]
# A marker that is misspelled (`@pytest.mark.smok`) is otherwise a silently
# unregistered marker: the test still runs in the full suite and simply never
# joins the `-m smoke` selection, which `test_smoke_coverage.py` would report as
# a verb without coverage rather than as a typo. `--strict-markers` turns the
# typo into a collection error at the line that carries it.
addopts = "--strict-markers"
markers = [
    # The smoke tier (`task test:smoke`): one marked happy path per visible
    # top-level `ocx` verb, run with `-m smoke -n auto --dist loadgroup` inside
    # a 90 s wall-clock budget. Never a signing/attest/verify test and never a
    # test that takes the `sigstore_stack` / `identity_token` fixtures — the
    # tier's whole point is a gate that runs without the seven-container
    # Sigstore stack. `tests/test_smoke_coverage.py` enforces both.
    "smoke: the per-verb smoke tier — cheap, registry-only, no Sigstore stack (see task test:smoke)",
    "requires_tty: test requires a real TTY on stderr; skipped in capture-output environments (is_terminal() returns false in pipes)",
    # The cosign interop matrix (WP6) contains two kinds of passing test, and a
    # green count that cannot tell them apart is quotable as parity for a
    # behaviour that is actually an open finding. A parity cell asserts the two
    # tools agree; a `divergence` cell asserts they DISAGREE, and pins a defect
    # or a security finding OCX has not fixed. Both pass today. The parity
    # recipe is therefore `-m \"not divergence\"`, and anyone citing the matrix
    # as evidence of cosign compatibility must use it.
    "divergence: pins a measured ocx/cosign disagreement or an open finding, not parity; passing means the defect is still present",
]

# Temp-dir retention: pytest keeps the last 3 runs and every test's tmp_path by
# default, so disk use tracks total tests rather than concurrent failures.
# "failed" reclaims a passing test's dir at teardown; count=1 drops the
# cross-run multiplier. Keep a passing dir while debugging with
# `-o tmp_path_retention_policy=all`.
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"

[tool.ruff]
# The rule set is the pinned ruff's own default (`ruff` in [dependency-groups]
# below, exact version in uv.lock) — not an enumerated `select`, which would be a
# second list to keep in step with it. `target-version` is deliberately absent:
# ruff derives it from `project.requires-python` above, so the floor is declared
# once and the linter cannot disagree with the interpreter.
#
# Invoked as `uv run ruff check .` (task test:lint), the same way every other
# Python tool in this directory runs.

[dependency-groups]
# `jsonschema` binds an emitted execution record to the schema `ocx_schema`
# publishes (test_execution_records.py). A hand-rolled subset check would be a
# third description of the format, free to go stale on its own — which is the
# drift the binding exists to close.
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "pexpect>=4.9",
    "oras>=0.2.42",
    "rich>=14.0",
    "cryptography>=42",
    "pyjwt[crypto]>=2.8",
    "ruff>=0.16",
    "jsonschema>=4.23",
    "in-toto-attestation>=0.9.3",
    "packageurl-python>=0.17.6",
    "pyyaml>=6.0.3",
]
