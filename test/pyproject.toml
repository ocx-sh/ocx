[project]
name = "ocx-tests"
version = "0.0.0"
# The project floor is 3.13+ (`.claude/rules/product-tech-strategy.md`). The
# declaration used to say 3.10, which is also what ruff derives `target-version`
# from: three f-strings reusing the outer quote character read as SYNTAX ERRORS
# against that floor, and a file ruff cannot parse is a file ruff does not lint.
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." exposes the `src` package (`from src.helpers import ...`, the suite-wide
# convention); "src" additionally exposes `announce_e2e` as a top-level import
# so the Track D evidence module does not drag `src/__init__.py`'s registry /
# oras imports into a pure-logic unit test. Scripts outside pytest set
# PYTHONPATH=<repo>/test/src for the same reason.
pythonpath = [".", "src"]
markers = [
    "requires_tty: test requires a real TTY on stderr; skipped in capture-output environments (is_terminal() returns false in pipes)",
    # The cosign interop matrix (WP6) contains two kinds of passing test, and a
    # green count that cannot tell them apart is quotable as parity for a
    # behaviour that is actually an open finding. A parity cell asserts the two
    # tools agree; a `divergence` cell asserts they DISAGREE, and pins a defect
    # or a security finding OCX has not fixed. Both pass today. The parity
    # recipe is therefore `-m \"not divergence\"`, and anyone citing the matrix
    # as evidence of cosign compatibility must use it.
    "divergence: pins a measured ocx/cosign disagreement or an open finding, not parity; passing means the defect is still present",
]

# Temp-dir retention: pytest keeps the last 3 runs and every test's tmp_path by
# default, so disk use tracks total tests rather than concurrent failures.
# "failed" reclaims a passing test's dir at teardown; count=1 drops the
# cross-run multiplier. Keep a passing dir while debugging with
# `-o tmp_path_retention_policy=all`.
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"

[tool.ruff]
# The rule set is the pinned ruff's own default (`ruff` in [dependency-groups]
# below, exact version in uv.lock) — not an enumerated `select`, which would be a
# second list to keep in step with it. `target-version` is deliberately absent:
# ruff derives it from `project.requires-python` above, so the floor is declared
# once and the linter cannot disagree with the interpreter.
#
# Invoked as `uv run ruff check .` (task test:lint), the same way every other
# Python tool in this directory runs.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "pexpect>=4.9",
    "oras>=0.2.42",
    "rich>=14.0",
    "cryptography>=42",
    "pyjwt[crypto]>=2.8",
    "ruff>=0.16",
]
