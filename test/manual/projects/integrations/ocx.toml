# Toolchain-tier view of the `integrations` feature.
#
# Binds the two dojo roots that declare integrations plus the patched base
# from the patches rig, so `ocx env` / `ocx inspect` run from this directory
# show the project tier composing exactly what `ocx package env` shows for the
# same packages — plus the companion contribution the patch tier overlays.
#
# `ocx.lock` beside this file is generated by scripts/setup-integrations.sh
# (gitignored) — the pinned digests change on every push.

[tools]
custom-tool = "localhost:5000/dojo/custom-tool:1.0.0"
custom-other = "localhost:5000/dojo/custom-other:1.0.0"
base-tool = "localhost:5000/patches/base-tool:1.0.0"
