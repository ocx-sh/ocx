# ocx-baseline: template-owned file — change ocx-sh/conventions, then run task copier:update
# zizmor policy for this repo (https://docs.zizmor.sh/configuration/).
rules:
  unpinned-uses:
    config:
      policies:
        # Default is ref-pin for actions/* and hash-pin for the rest. Our own actions hash-pin too.
        actions/*: hash-pin
        ocx-sh/*: hash-pin
        '*': hash-pin
    # Workflows generated by another tool (the `zizmor_ignore` answer); hand-written ones are fixed, not listed.
    ignore:
      - release.yml
  # Flags every `uses: ./.github/actions/deploy`; the deploy contract mandates that
  # local path, so the rule has no actionable finding here.
  self-repository:
    disable: true
  adhoc-packages:
    ignore:
      - release.yml
  anonymous-definition:
    ignore:
      - release.yml
  archived-uses:
    ignore:
      - release.yml
  artipacked:
    ignore:
      - release.yml
  bot-conditions:
    ignore:
      - release.yml
  cache-poisoning:
    ignore:
      - release.yml
  concurrency-limits:
    ignore:
      - release.yml
  dangerous-triggers:
    ignore:
      - release.yml
  dependabot-cooldown:
    ignore:
      - release.yml
  dependabot-execution:
    ignore:
      - release.yml
  excessive-permissions:
    ignore:
      - release.yml
  forbidden-uses:
    ignore:
      - release.yml
  github-app:
    ignore:
      - release.yml
  github-env:
    ignore:
      - release.yml
  hardcoded-container-credentials:
    ignore:
      - release.yml
  impostor-commit:
    ignore:
      - release.yml
  insecure-commands:
    ignore:
      - release.yml
  insecure-url-scheme:
    ignore:
      - release.yml
  known-vulnerable-actions:
    ignore:
      - release.yml
  misfeature:
    ignore:
      - release.yml
  obfuscation:
    ignore:
      - release.yml
  overprovisioned-secrets:
    ignore:
      - release.yml
  ref-confusion:
    ignore:
      - release.yml
  ref-version-mismatch:
    ignore:
      - release.yml
  secrets-inherit:
    ignore:
      - release.yml
  secrets-outside-env:
    ignore:
      - release.yml
  self-hosted-runner:
    ignore:
      - release.yml
  stale-action-refs:
    ignore:
      - release.yml
  superfluous-actions:
    ignore:
      - release.yml
  template-injection:
    ignore:
      - release.yml
  typosquat-uses:
    ignore:
      - release.yml
  undocumented-permissions:
    ignore:
      - release.yml
  unpinned-images:
    ignore:
      - release.yml
  unpinned-tools:
    ignore:
      - release.yml
  unredacted-secrets:
    ignore:
