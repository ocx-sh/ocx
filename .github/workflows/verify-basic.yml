name: Basic Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'announce/**']

permissions:
  contents: read
  checks: write
  pull-requests: write

# subsystem-ci.md section 6. This workflow is neither reused via `workflow_call`
# nor composed into `release-readiness.yml`, so the plain convention applies —
# no literal-prefix carve-out is needed here.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  conventional-commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check conventional commits
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: check
          args: "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup OCX
        uses: ./.github/actions/setup-ocx
        with:
          version: '0.5.2'
      - name: Lint workflows
        # `ocx run` composes the project toolchain (actionlint + shellcheck +
        # go-task) from ocx.lock and runs the task hermetically — same gate as
        # local `task ci:actionlint`.
        run: ocx run -- task ci:actionlint

  smoke:
    name: Smoke (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          matcher: true
          # Defer warning-denial to [workspace.lints.rust]. The action's default
          # RUSTFLAGS=-D warnings is global and also denies the path-vendored
          # starlark fork (Cargo auto-caps registry/git deps, not path deps),
          # turning its upstream lints into hard build errors.
          rustflags: ""
      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      - name: Install nextest
        uses: taiki-e/install-action@65851e10cd6c377f11a60e600abc07cb08643468 # v2.79.3
        with:
          tool: cargo-nextest
      - name: Check formatting
        id: fmt
        run: task rust:format:check
        continue-on-error: true
      - name: Clippy
        id: clippy
        run: task rust:clippy:check
        continue-on-error: true
      - name: Build
        run: task rust:build
      # Upload the acceptance binary *before* the Test step. `task rust:build`
      # compiles target/release/ocx with `--features ocx/__testing`, enabling the
      # `__OCX_SELF_IMAGE` seam that the self-setup / self-update acceptance tests
      # rely on to redirect the canonical `ocx.sh/ocx/cli` identifier to the local
      # fixture registry. The Test step below runs `cargo nextest --workspace
      # --release` WITHOUT that feature, which recompiles and overwrites
      # target/release/ocx seam-free — so a download after Test would ship a
      # binary that ignores the redirect and every self-* acceptance test fails.
      - name: Upload Binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocx-binary
          path: target/release/ocx
          compression-level: 0
          retention-days: 1
      # The C-021 parity matrix drives all nine hook shells, but no runner image
      # carries elvish, nushell or fish — and an arm that never runs is a green
      # indistinguishable from an absent test (#349). ocx packages all three, so
      # they come from the same place a user's would, and this is also the only
      # leg where the emitted statements meet those shells' real parsers.
      - name: Setup OCX
        uses: ./.github/actions/setup-ocx
        with:
          version: '0.5.2'
      - name: Put the elvish, nushell and fish parity arms on PATH
        run: |
          set -euo pipefail
          eval "$(ocx --remote package env nushell elvish fish-shell/fish --shell=bash)"
          for interpreter in nu elvish fish; do
            # Assigned first, so `set -e` sees the lookup's exit status: a
            # failed `command -v` inside an argument would otherwise append
            # `dirname ""` = `.` to the PATH and read as success.
            resolved="$(command -v "$interpreter")"
            dirname "$resolved" >> "$GITHUB_PATH"
          done
      - name: Test
        # Names exactly the three interpreters the step above installs: with them
        # on PATH a skip is a defect, so no arm can drop out of the matrix
        # while this leg stays green. The other six skip where absent, which
        # `assert_every_present_interpreter_ran` reports with an observed cause.
        env:
          __OCX_TESTING_REQUIRE_LIVE_SHELLS: nu,elvish,fish
        run: task rust:test:unit -- --profile ci
      - name: Generate Schema
        run: task schema:generate
      - name: Upload Schema
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocx-schema
          path: website/src/public/schemas/metadata/v1.json
          retention-days: 1
      - name: Publish Unit Test Results
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0
        with:
          files: target/nextest/ci/junit.xml
          check_name: "Unit Test Results"
      - name: Check lint results
        if: ${{ !cancelled() }}
        run: |
          if [[ "${{ steps.fmt.outcome }}" == "failure" || "${{ steps.clippy.outcome }}" == "failure" ]]; then
            echo "::error::Lint checks failed (fmt=${{ steps.fmt.outcome }}, clippy=${{ steps.clippy.outcome }})"
            exit 1
          fi

  smoke-windows:
    name: Smoke (Windows)
    # `needs: smoke` is the cost policy from subsystem-ci.md "Cost Factors"
    # ("Linux default; gate macOS/Windows behind Linux passing"), not a data
    # dependency: Windows minutes bill at ~1.7x Linux, so this leg is skipped
    # entirely on a PR whose Linux leg is already red.
    #
    # It costs no wall-clock. Measured on a real run: this leg took 10m14s and
    # `acceptance-tests`, which shares `needs: smoke` and so starts alongside it,
    # took 11m54s -- the gate's critical path is unchanged.
    #
    # A `cargo check --workspace --all-targets` leg would be cheaper, and would
    # have caught the `cfg(windows)` compile break that hid behind these checks
    # -- but only that one. The other 14 failures it was masking are runtime
    # assertion failures, which no `check` can see. Hence a test leg.
    # `--all-targets` would not be optional either way: the break lived in a
    # `#[cfg(test)]` module, which a plain `cargo check` does not compile.
    needs: smoke
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          matcher: true
          # Same reason as the Linux leg: denial lives in [workspace.lints.rust]
          # so the path-vendored forks stay capped.
          rustflags: ""
      - name: Rust Cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install nextest
        uses: taiki-e/install-action@65851e10cd6c377f11a60e600abc07cb08643468 # v2.79.3
        with:
          tool: cargo-nextest
      # No release build, no artifact upload, no schema generation: this leg
      # exists to compile and run the test targets on Windows, which is the one
      # thing the Linux and macOS legs cannot do for it.
      #
      # Raw cargo rather than `task rust:test:unit`, deviating from
      # subsystem-ci.md "Taskfile is the single source of truth" -- deliberately.
      # That task hardcodes `--release`, which the same rule file lists as an
      # anti-pattern for unit tests and which buys nothing on a leg that ships no
      # binary. And this is byte-for-byte the command `verify-deep.yml`'s Windows
      # leg already runs, so the two Windows legs cannot drift into disagreeing
      # about what "the tests pass on Windows" means. Wrap it in a task the day a
      # second caller wants it.
      #
      # `--profile ci` is load-bearing, not decoration: it sets
      # `fail-fast = false`. The first version of this job omitted it and proved
      # why that matters -- it reported 2 of the 14 Windows failures and left
      # 5248 tests unrun, so a contributor would fix two, re-run, and find two
      # more. A gate that hides most of what it catches is the defect this leg
      # exists to remove.
      - name: Test
        run: cargo nextest run --workspace --locked --profile ci

  acceptance-tests:
    name: Acceptance Tests
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - name: Start acceptance registry
        shell: bash
        run: |
          # zot (OCI 1.1 Referrers API) is the primary acceptance registry —
          # distribution's registry:2/registry:3 do NOT serve
          # /v2/<name>/referrers/<digest> (#195). Started from the compose file
          # (single source of truth, no image drift). Both services run so the
          # registry:2 negative fixture (legacy_registry, #106) is CI-provable
          # and the mirror tests run in CI too (deliberate scope expansion).
          docker compose -f test/docker-compose.yml up -d registry mirror-registry
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:5000/v2/ > /dev/null 2>&1; then
              echo "Registry is ready"; exit 0
            fi
            sleep 0.5
          done
          echo "::error::Registry did not become reachable"; exit 1
      - name: Start Sigstore stack
        shell: bash
        run: |
          # The signing acceptance tests run against a real Fulcio + Rekor +
          # TesseraCT + dex stack, not a fake, so the `sigstore` profile is a
          # hard prerequisite: `tests/fixtures/sigstore_stack.py` raises rather
          # than skipping, because a skip here is indistinguishable from a pass
          # and these are the tests carrying the supply-chain contract.
          #
          # Started here rather than left to the session fixture so the image
          # pull is its own step with its own log, and so the elapsed number the
          # ADR asks for is recorded on every run.
          start=$SECONDS
          docker compose -f test/docker-compose.yml --profile sigstore up -d
          # Four of the seven images are distroless, so compose healthchecks
          # cannot run inside them; wait-for-stack.py polls from the host and is
          # the same gate the fixtures use and the self-hosting docs hand out.
          python3 test/sigstore/wait-for-stack.py --timeout 300
          echo "sigstore stack ready in $((SECONDS - start))s"
      # The readiness gate prints which service is down and names the log
      # command, but nobody can run that command on a finished runner — without
      # this step a bring-up failure costs a whole second run to diagnose.
      - name: Sigstore stack logs (on failure)
        if: failure()
        shell: bash
        run: |
          docker compose -f test/docker-compose.yml --profile sigstore ps
          for service in rekor trillian-log-server trillian-log-signer sigstore-mysql fulcio sigstore-ct dex; do
            echo "::group::$service"
            docker compose -f test/docker-compose.yml --profile sigstore logs --tail=80 "$service" || true
            echo "::endgroup::"
          done
      - name: Download Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ocx-binary
          path: test/bin
      - name: Prepare Binaries
        run: chmod +x test/bin/ocx
      - name: Download Schema
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ocx-schema
          path: website/src/public/schemas/metadata
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Setup Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      - name: Run Acceptance Tests
        run: task test:parallel -- --junit-xml=results/junit.xml
      - name: Publish Acceptance Test Results
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0
        with:
          files: test/results/junit.xml
          check_name: "Acceptance Test Results"
