name: Verify Version

# Called by release.yml before anything is planned or built: a release or a candidate names the version
# it ships, and that version must be the one `Cargo.toml` carries, in the shape its mode allows. A dev
# build ships no named version, so it passes. Nothing here reads a tag: the tag is created at the end of
# the run, from this version.

on:
  workflow_call:
    inputs:
      mode:
        description: The release.yml mode (`release`, `candidate` or `dev`).
        required: true
        type: string
      version:
        description: The version the run ships; ignored in dev mode.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the version against Cargo.toml
        env:
          MODE: ${{ inputs.mode }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "dev" ]]; then
            echo "dev build: no version to verify"
            exit 0
          fi
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          case "$MODE" in
            release) shape='^[0-9]+\.[0-9]+\.[0-9]+$' ;;
            candidate) shape='^[0-9]+\.[0-9]+\.[0-9]+-rc[1-9][0-9]*$' ;;
            *) echo "::error::mode '$MODE' is not release, candidate or dev"; exit 1 ;;
          esac
          if ! [[ "$VERSION" =~ $shape ]]; then
            echo "::error::version '$VERSION' does not fit a $MODE (expected $shape)"
            exit 1
          fi
          if [[ "${VERSION%%-*}" != "$cargo_version" ]]; then
            echo "::error::version $VERSION does not match the Cargo.toml version $cargo_version"
            exit 1
          fi
          echo "Version verified: $VERSION ($MODE)"
