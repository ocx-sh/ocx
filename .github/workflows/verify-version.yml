name: Verify Version
# Called by release.yml as a cargo-dist `local-artifacts-jobs` entry (dist-workspace.toml),
# not a plan job: `host` must see this job's failure itself.

on:
  workflow_call:
    inputs:
      plan:
        description: The cargo-dist plan manifest. cargo-dist passes it to every custom job; unused here.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Cargo.toml version matches tag
        if: ${{ github.ref_type == 'tag' }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name=="ocx") | .version')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"
