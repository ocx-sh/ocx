name: Publish ocx-sdkgen

# cargo-dist post-announce job (`dist-workspace.toml` `post-announce-jobs`).
# Packages the `ocx-sdkgen` binary as the OCX package `ocx.sh/ocx/sdkgen`,
# pushes it to its GHCR home beside `ocx/cli`, and signs it keyless under this
# workflow's identity. SDK repositories pin it by digest with the
# `[[trust.policy]]` in `packaging/sdkgen/trust-policy.toml`.
#
# Privilege is split by job: `build` reads only, `publish` may push, and only
# `sign` holds `id-token: write`, so the OIDC token that mints the signing
# certificate is never reachable from the job that compiles code or the one
# that handles the push. `task release:sdkgen:check` asserts that split, and
# `task release:sdkgen:dry-run` builds the package without publishing.
#
# Every job is guarded to `ocx-sh/ocx`: in a `workflow_call` workflow
# `github.repository` is the caller's, and the Fulcio certificate names this
# workflow whoever called it, so a copy called from another repository would
# otherwise sign its own artifacts under the identity the trust policy pins.
# `task release:sdkgen:check` asserts the guard on every job.
#
# The index announce of `ocx/sdkgen` is not part of this workflow: a new
# package needs its index claim first.

on:
  workflow_call:
    inputs:
      plan:
        # Forwarded by cargo-dist; not consumed here, but the contract requires it.
        required: true
        type: string

permissions:
  contents: read

env:
  # Logical name `ocx.sh/ocx/sdkgen`; the physical home is the owner namespace
  # on GHCR, as for `ocx/cli` (post-release-oci-publish.yml).
  SDKGEN_REPOSITORY: ghcr.io/ocx-sh/ocx/sdkgen

jobs:
  compute-tag:
    # Same rule as post-release-oci-publish.yml: no registry publish for a
    # pre-release tag.
    if: ${{ github.repository == 'ocx-sh/ocx' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.tag.outputs.version_tag }}
    steps:
      - id: tag
        shell: bash
        run: |
          set -euo pipefail
          # Frozen once so every platform push below lands on one tag.
          ts="$(date -u +%Y%m%d%H%M%S)"
          echo "version_tag=${GITHUB_REF_NAME#v}_${ts}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: [compute-tag]
    if: ${{ github.repository == 'ocx-sh/ocx' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-22.04, zig: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-22.04, zig: true }
          - { target: x86_64-apple-darwin, runner: macos-latest, zig: false }
          - { target: aarch64-apple-darwin, runner: macos-latest, zig: false }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest, zig: false }
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The workspace's [patch.crates-io] entries point at submodules, so
          # cargo cannot resolve the lockfile without them.
          submodules: true
          persist-credentials: false
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install target on rust-toolchain.toml channel
        # rust-toolchain.toml pins an explicit channel; see .github/actions/build-rust.
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - name: Install Zig
        if: ${{ matrix.zig }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Install cargo-zigbuild
        if: ${{ matrix.zig }}
        uses: taiki-e/install-action@58e862542551f667fa44c8a2a4a1d64ad477c96a # v2.75.17
        with:
          tool: cargo-zigbuild
      - name: Build (cargo)
        if: ${{ !matrix.zig }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p ocx_sdkgen --target "$TARGET"
      - name: Build (zigbuild)
        if: ${{ matrix.zig }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo zigbuild --release --locked -p ocx_sdkgen --target "$TARGET"
      - name: Upload ocx-sdkgen binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdkgen-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/ocx-sdkgen${{ contains(matrix.target, 'windows') && '.exe' || '' }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Push packages
    needs: [compute-tag, build]
    if: ${{ github.repository == 'ocx-sh/ocx' }}
    runs-on: ubuntu-latest
    environment: ocx.sh
    outputs:
      # The index digest the last push left behind; `sign` signs exactly this.
      index_digest: ${{ steps.push.outputs.index_digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install go-task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      - name: Download ocx-sdkgen binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sdkgen-*
          path: sdkgen/
      - name: Download cargo-dist archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-build-*
          path: distrib/
          merge-multiple: true
      - name: Install OCX from the release build
        # The ocx this release just built drives the push, as in oci-publish.yml.
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          tar -xzf distrib/ocx-x86_64-unknown-linux-musl.tar.gz -C "$stage"
          found="$(find "$stage" -name ocx -type f | head -1)"
          if [[ -z "$found" ]]; then
            echo "::error::no ocx in distrib/ocx-x86_64-unknown-linux-musl.tar.gz"
            exit 1
          fi
          install -m 0755 "$found" /usr/local/bin/ocx
      - name: Package and push
        id: push
        shell: bash
        env:
          VERSION_TAG: ${{ needs.compute-tag.outputs.version_tag }}
          OCX_AUTH_ghcr_io_USER: ${{ github.actor }}
          OCX_AUTH_ghcr_io_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          declare -A PLATFORM_MAP=(
            ["x86_64-unknown-linux-musl"]="linux/amd64"
            ["aarch64-unknown-linux-musl"]="linux/arm64"
            ["x86_64-apple-darwin"]="darwin/amd64"
            ["aarch64-apple-darwin"]="darwin/arm64"
            ["x86_64-pc-windows-msvc"]="windows/amd64"
          )
          for target in "${!PLATFORM_MAP[@]}"; do
            platform="${PLATFORM_MAP[$target]}"
            ext=""
            [[ "$target" == *windows* ]] && ext=".exe"
            src="sdkgen/sdkgen-${target}/ocx-sdkgen${ext}"
            if [[ ! -f "$src" ]]; then
              echo "::error::missing artifact $src"
              exit 1
            fi
            out="$(mktemp -d)"
            task release:sdkgen:package BIN="$src" PLATFORM="$platform" OUT="$out"
            echo "==> Publishing ${SDKGEN_REPOSITORY}:${VERSION_TAG} (${platform})"
            ocx --format json package push \
              --identifier "${SDKGEN_REPOSITORY}:${VERSION_TAG}" \
              --platform "${platform}" \
              --cascade \
              --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              "$out/ocx-sdkgen.tar.xz" > "$out/push.json"
            # Each push merges into the tag's index and rewrites its digest, so
            # only the last one is final.
            index_digest="$(jq -r '.manifest_digest' "$out/push.json")"
            rm -rf "$out"
          done
          if [[ ! "$index_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::push reported no index digest (got '${index_digest}')"
            exit 1
          fi
          echo "index_digest=${index_digest}" >> "$GITHUB_OUTPUT"

  sign:
    name: Sign the published index
    needs: [publish]
    if: ${{ github.repository == 'ocx-sh/ocx' }}
    runs-on: ubuntu-latest
    environment: ocx.sh
    # The only job in this workflow with `id-token: write`. It signs by
    # certificate (Fulcio, keyless), so it runs no repository code: no
    # checkout, no task, only the ocx the release built.
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download cargo-dist archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-build-*
          path: distrib/
          merge-multiple: true
      - name: Install OCX from the release build
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          tar -xzf distrib/ocx-x86_64-unknown-linux-musl.tar.gz -C "$stage"
          found="$(find "$stage" -name ocx -type f | head -1)"
          if [[ -z "$found" ]]; then
            echo "::error::no ocx in distrib/ocx-x86_64-unknown-linux-musl.tar.gz"
            exit 1
          fi
          install -m 0755 "$found" /usr/local/bin/ocx
      - name: Sign
        shell: bash
        env:
          INDEX_DIGEST: ${{ needs.publish.outputs.index_digest }}
          OCX_AUTH_ghcr_io_USER: ${{ github.actor }}
          OCX_AUTH_ghcr_io_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The index, not one platform, by the digest `publish` pushed rather
          # than the tag: a tag moved after the push would otherwise be what
          # gets signed.
          if [[ ! "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::publish exposed no index digest (got '${INDEX_DIGEST}')"
            exit 1
          fi
          ocx package sign --no-tty "${SDKGEN_REPOSITORY}@${INDEX_DIGEST}"
