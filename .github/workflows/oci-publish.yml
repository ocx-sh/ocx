name: OCI Publish

# Reusable workflow that publishes bare-binary build artifacts to an OCI
# registry as OCX packages. Called by `deploy-dev.yml` (rolling main publishes)
# and `post-release-oci-publish.yml` (tag-driven release publishes).
#
# Inputs assume that for every (target, variant) pair an artifact named
# `${variant}${variant_sep}${target}` was uploaded by the caller — a single
# file whose name is `${variant}${variant_sep}${target}` (no extension on
# unix targets, `.exe` on windows). The default variant uses the empty prefix,
# so the artifact name is `ocx-${target}`. Non-default variants prefix the
# binary name, e.g. `ocx-mirror-${target}`.

on:
  workflow_call:
    inputs:
      registry:
        description: Registry hostname (e.g. `dev.ocx.sh`, `ocx.sh`).
        required: true
        type: string
      repo:
        description: First-party namespace within the registry (typically `ocx`).
          Default variant publishes to `<repo>/cli`; named variants to `<repo>/<variant>`.
        required: true
        type: string
      version_tag:
        description: Fully formed publish tag, including any pre-release and UTC
          build-metadata segments (e.g. `0.3.0-dev_20260514120000`). Callers are
          responsible for freezing the build-metadata segment once per workflow
          run so every (variant, target) leg of the publish loop shares the
          same tag — `ocx package push` is invoked without `--build-timestamp`.
        required: true
        type: string
      variants:
        description: JSON array of variant prefixes; `""` for the default ocx variant.
        required: true
        type: string
      targets:
        description: JSON array of Rust target triples to publish.
        required: true
        type: string
      environment:
        description: GitHub Environment whose secrets gate the publish.
        required: true
        type: string
      artifact_source:
        description: How to stage binaries — `bare` (artifacts named `ocx-${target}` from build-rust) or `cargo-dist` (`artifacts-build-*` archives in `target/distrib/`).
        required: false
        type: string
        default: bare
    secrets:
      REGISTRY_USER:
        required: true
      REGISTRY_TOKEN:
        required: true
      OCX_ANNOUNCE_TOKEN:
        description: GitHub credential the index announce pull request is opened
          with. Absent (fork build, dev publish) means publish without announcing.
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download bare-binary artifacts
        if: ${{ inputs.artifact_source == 'bare' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          merge-multiple: true

      - name: Download cargo-dist archives
        if: ${{ inputs.artifact_source == 'cargo-dist' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-build-*
          path: distrib/
          merge-multiple: true

      - name: Extract cargo-dist archives into bare-binary layout
        if: ${{ inputs.artifact_source == 'cargo-dist' }}
        shell: bash
        env:
          TARGETS_JSON: ${{ inputs.targets }}
          VARIANTS_JSON: ${{ inputs.variants }}
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t TARGETS  < <(echo "${TARGETS_JSON}"  | jq -r '.[]')
          mapfile -t VARIANTS < <(echo "${VARIANTS_JSON}" | jq -r '.[]')
          for target in "${TARGETS[@]}"; do
            ext=""
            archive_ext="tar.gz"
            if [[ "$target" == *windows* ]]; then
              ext=".exe"
              archive_ext="zip"
            fi
            archive="distrib/ocx-${target}.${archive_ext}"
            if [[ ! -f "$archive" ]]; then
              echo "::error::missing $archive"
              exit 1
            fi
            stage="$(mktemp -d)"
            if [[ "$archive" == *.zip ]]; then
              unzip -q "$archive" -d "$stage"
            else
              tar -xf "$archive" -C "$stage"
            fi
            for variant in "${VARIANTS[@]}"; do
              if [[ -z "$variant" ]]; then
                bin_stem="ocx"
              else
                bin_stem="ocx-${variant}"
              fi
              found="$(find "$stage" -name "${bin_stem}${ext}" -type f | head -1)"
              if [[ -z "$found" ]]; then
                echo "::error::no ${bin_stem}${ext} in $archive"
                exit 1
              fi
              cp "$found" "dist/${bin_stem}-${target}${ext}"
            done
            rm -rf "$stage"
          done

      - name: Install OCX from staged binary
        run: |
          set -euo pipefail
          SRC="dist/ocx-x86_64-unknown-linux-musl"
          if [[ ! -f "$SRC" ]]; then
            echo "::error::missing linux-musl-x86_64 ocx binary; cannot publish without an ocx to drive the push"
            exit 1
          fi
          install -m 0755 "$SRC" /usr/local/bin/ocx
          ocx version

      - name: Publish to registry
        env:
          REGISTRY: ${{ inputs.registry }}
          REPO: ${{ inputs.repo }}
          VERSION_TAG: ${{ inputs.version_tag }}
          VARIANTS_JSON: ${{ inputs.variants }}
          TARGETS_JSON: ${{ inputs.targets }}
          OCX_AUTH_REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          OCX_AUTH_REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          OCX_ANNOUNCE_TOKEN: ${{ secrets.OCX_ANNOUNCE_TOKEN }}
        run: |
          set -euo pipefail

          # B3: validate registry against allowlist before using it in dynamic export.
          # Prevents command substitution injection if registry ever contains shell metacharacters.
          if ! [[ "${REGISTRY}" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::registry '${REGISTRY}' contains invalid characters (must match ^[a-zA-Z0-9._-]+\$)"
            exit 1
          fi

          # W9: allowlist defense-in-depth — only permit known registries.
          case "$REGISTRY" in
            dev.ocx.sh|ocx.sh) ;;
            *) echo "::error::registry '$REGISTRY' not in allowlist"; exit 1 ;;
          esac

          # Map secrets to the registry-specific env names ocx reads.
          # Hostname dots become underscores in OCX_AUTH_<host>_USER/TOKEN.
          auth_key="$(echo "${REGISTRY}" | tr '.' '_')"
          export "OCX_AUTH_${auth_key}_USER=${OCX_AUTH_REGISTRY_USER}"
          export "OCX_AUTH_${auth_key}_TOKEN=${OCX_AUTH_REGISTRY_TOKEN}"

          # The glibc rows carry `+libc.glibc` because a `-gnu` build is
          # dynamically linked against glibc; `ocx package create` reads the
          # binary and refuses a platform that does not declare it. The musl
          # rows stay bare: those builds are fully static, so an empty
          # `os.features` is a true claim of universality. Declaring the
          # feature is also what lets a gnu and a musl build of the same
          # arch coexist under one tag — as identical `linux/amd64` keys the
          # second would evict the first from the image index.
          declare -A PLATFORM_MAP=(
            ["x86_64-unknown-linux-gnu"]="linux/amd64+libc.glibc"
            ["x86_64-unknown-linux-musl"]="linux/amd64"
            ["aarch64-unknown-linux-gnu"]="linux/arm64+libc.glibc"
            ["aarch64-unknown-linux-musl"]="linux/arm64"
            ["x86_64-apple-darwin"]="darwin/amd64"
            ["aarch64-apple-darwin"]="darwin/arm64"
            ["x86_64-pc-windows-msvc"]="windows/amd64"
            ["aarch64-pc-windows-msvc"]="windows/arm64"
          )

          METADATA="packaging/ocx/metadata.json"

          # The UTC build-metadata segment is already baked into VERSION_TAG by
          # the caller (deploy-dev.yml / post-release-oci-publish.yml). --cascade
          # still derives the rolling X.Y.Z / X.Y / X / latest tags users install.

          # Publish the just-pushed tags into the ocx-sh/index entry for the
          # package. No `--fork`: this repository lives in the organization that
          # owns the index, and GitHub refuses to fork a repository into its own
          # owning organization, so the announce branch is pushed to the index
          # directly. It still lands as a pull request, which is what the index's
          # governance gate and its refresh/new-package labelling run on.
          # `package announce` and `push --announce-file` shipped together, so
          # one probe answers for both. It has to gate the PUSH flag too: an
          # older ocx rejects an unknown flag with exit 64, which would fail the
          # publish itself rather than just skipping the announce. That is
          # reachable here — re-publishing an old tag installs that tag's own ocx.
          if ocx package announce --help >/dev/null 2>&1; then
            announce_supported=1
          else
            announce_supported=0
            echo "::notice::this ocx has no 'package announce'; publishing without announcing"
          fi

          announce_package() {
            local repo_path="$1" tags_file="$2"
            if (( ! announce_supported )); then
              return 0
            fi
            # The announce re-observes each curated tag on the physical
            # repository the index root points at, which is the PROD registry —
            # a dev tag simply does not exist there.
            if [[ "$REGISTRY" != "ocx.sh" ]]; then
              echo "::notice::skipping index announce for ${repo_path}: ${REGISTRY} is not the registry ocx-sh/index points at"
              return 0
            fi
            if [[ -z "${OCX_ANNOUNCE_TOKEN:-}" ]]; then
              echo "::notice::skipping index announce for ${repo_path}: OCX_ANNOUNCE_TOKEN is unavailable"
              return 0
            fi
            if [[ ! -s "$tags_file" ]]; then
              echo "::error::no published tags recorded for ${repo_path}; refusing to announce nothing"
              return 1
            fi
            echo "==> Announcing ${repo_path} into ocx-sh/index"
            ocx package announce \
              --package "${repo_path}" \
              --tags-from-file "$tags_file" \
              --index-repo ocx-sh/index
          }

          # variants is a JSON array of strings; iterate.
          mapfile -t VARIANTS < <(echo "${VARIANTS_JSON}" | jq -r '.[]')
          mapfile -t TARGETS  < <(echo "${TARGETS_JSON}"  | jq -r '.[]')

          for variant in "${VARIANTS[@]}"; do
            # Empty string variant = default (binary "ocx") -> repo "<ns>/cli".
            # Non-empty variant = e.g. "mirror" -> binary "ocx-mirror" -> repo "<ns>/mirror".
            # First-party tools live under the "<ns>/" namespace; plain X.Y.Z tags.
            if [[ -z "$variant" ]]; then
              bin_stem="ocx"
              repo_path="${REPO}/cli"
            else
              bin_stem="ocx-${variant}"
              repo_path="${REPO}/${variant}"
            fi

            # Every target leg appends the tags it published (plus the cascade
            # tags it moved) here; the announce below curates them in one call.
            announce_tags="$(mktemp)"
            announce_flag=()
            (( announce_supported )) && announce_flag=(--announce-file "$announce_tags")

            for target in "${TARGETS[@]}"; do
              platform="${PLATFORM_MAP[$target]:-}"
              if [[ -z "$platform" ]]; then
                echo "::error::unknown target $target; add it to PLATFORM_MAP"
                exit 1
              fi

              ext=""
              [[ "$target" == *windows* ]] && ext=".exe"
              SRC="dist/${bin_stem}-${target}${ext}"
              if [[ ! -f "$SRC" ]]; then
                echo "::error::missing artifact $SRC"
                exit 1
              fi

              WORK="$(mktemp -d)"
              mkdir -p "$WORK/repackage/bin"
              install -m 0755 "$SRC" "$WORK/repackage/bin/${bin_stem}${ext}"

              ARCHIVE="$WORK/${bin_stem}-${target}.tar.xz"
              # No --metadata below: `push` derives the sidecar path from its
              # layer via the SAME conventions::infer_metadata_file that
              # `create` uses to write it, so the two cannot drift. Handing
              # `push` the source `$METADATA` instead fails with "metadata
              # sidecar has no recorded platform" (exit 65) — only the
              # generated sidecar carries the recorded platform.
              ocx package create "$WORK/repackage" \
                -m "$METADATA" \
                -o "$ARCHIVE" \
                -p "$platform"

              identifier="${REGISTRY}/${repo_path}:${VERSION_TAG}"
              echo "==> Publishing ${identifier} (${platform})"
              ocx package push \
                --identifier "${identifier}" \
                --platform "${platform}" \
                --cascade \
                --new \
                "${announce_flag[@]}" \
                "$ARCHIVE"

              rm -rf "$WORK"
            done

            # Repository-level catalog description (`__ocx.desc` tag), pushed
            # BEFORE the announce so the announce observes it and carries the
            # readme and logo into the index entry. Version-independent;
            # refreshed on every publish.
            #
            # CATALOG.md, not README.md: the README is written for the GitHub
            # repository page, so it carries CI badges and repo-relative links
            # (`./assets/logo.svg`, `LICENSE`, `CONTRIBUTING.md`) that resolve
            # nowhere in a catalog renderer. Its frontmatter supplies the title,
            # description and keywords, so no flags are needed here.
            #
            # Default variant only: the copy names this package, and a named
            # variant would need its own. None exists today — ocx-mirror
            # publishes ocx.sh/ocx/mirror from its own repository.
            if [[ -z "$variant" ]]; then
              echo "==> Pushing catalog description for ${REGISTRY}/${repo_path}"
              ocx package describe "${REGISTRY}/${repo_path}" \
                --readme packaging/ocx/CATALOG.md \
                --logo assets/logo.svg
            fi

            announce_package "$repo_path" "$announce_tags"
            rm -f "$announce_tags"
          done
