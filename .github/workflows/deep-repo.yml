# Seeded once by ocx-sh/conventions; this file belongs to the repo from here on.
# verify-deep calls it as its `repo` job: put the repo-owned jobs that run in the nightly and labelled deep tier here.
# A called workflow sees only the secrets it declares, so keep every secret the `repo_workflows` answer
# lists declared under `on.workflow_call.secrets`.
name: deep-repo

on:
  workflow_call:
    secrets:
      BAZEL_CACHE_WRITE_AUTH:
        required: false

permissions: {}

jobs:
  repo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: echo "no repo-owned deep jobs yet"
