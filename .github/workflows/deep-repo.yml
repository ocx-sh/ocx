name: Deep (repo)

# The repo-owned jobs of the deep tier, called by the conventions template's `repo` job in
# `verify-deep.yml` (nightly, `workflow_dispatch`, the `run-deep` label, and `workflow_call` from the
# readiness gate). The template's own `deep` job runs `task ci:deep`; this file holds the platform and
# satellite coverage a pull request does not pay for.
#
# Linux unit tests, the full acceptance suite and the Bazel gates are the basic tier's now
# (`verify-basic.yml`, `basic-repo.yml`); what stays deep is everything that needs another OS or another
# repository: the cross-builds, the macOS and Windows unit and full acceptance legs (download and execute
# only, no cargo, bazel or Rust toolchain on a non-Linux runner), the two ocx-mirror satellite jobs, the
# index conformance drift check and the shell activation matrix.
#
# Every job runs under `contents: read`, the most the template's caller grants; a nested job asking for
# more fails the whole run at startup. Test results publish as annotations and a job summary.
#
# STATED RESIDUAL — no pull request runs the `cfg(windows)` / `cfg(target_os = "macos")` unit tests or
# these legs unless someone dispatches `verify-deep.yml` or labels the pull request `run-deep`.

on:
  workflow_call:
    secrets:
      BAZEL_CACHE_WRITE_AUTH:
        required: false
      OTEL_OTLP_AUTH:
        required: false

permissions: {}

jobs:
  # One parallel leg per triple (variant B of plan_pr637_round2.md D13: cross-builds in the deep tier
  # only). The artifacts it uploads belong to this run, which is how the native legs below find them.
  cross:
    name: Cross-build
    permissions:
      contents: read
    uses: ./.github/workflows/cross.yml
    secrets:
      BAZEL_CACHE_WRITE_AUTH: ${{ secrets.BAZEL_CACHE_WRITE_AUTH }}

  # macOS and Windows unit tests: download the test executables `cross`
  # cross-compiled and run them. Nothing is compiled or installed here beyond
  # the task runner and a Python for the runner script.
  unit-native:
    name: Unit Test (${{ matrix.job.name }})
    needs: cross
    runs-on: ${{ matrix.job.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: macos-latest, name: macOS, target: aarch64-apple-darwin }
          - { os: windows-latest, name: Windows, target: x86_64-pc-windows-gnullvm }
    env:
      OTEL_OTLP_AUTH: ${{ secrets.OTEL_OTLP_AUTH }}
    steps:
      # The taskfile includes every sub-taskfile, so a sparse checkout would
      # fail to load; a plain checkout of the tree is a few seconds and needs
      # no submodules.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Download unit-test bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-tests-${{ matrix.job.target }}
          path: bundle
      # `cross:test:run` reds on a failing test and on an under-run.
      - name: Run unit tests
        shell: bash
        env:
          # The only leg where Windows PowerShell 5.1 meets the emitted wrapper
          # (ocx#524); both interpreters ship on the image, so a skip is a red.
          __OCX_TESTING_REQUIRE_LIVE_SHELLS: ${{ matrix.job.name == 'Windows' && 'pwsh,powershell' || '' }}
        run: task cross:test:run BUNDLE="bundle/unit-tests.tar.gz" SOURCE_ROOT="$GITHUB_WORKSPACE"
      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deep-unit-${{ matrix.job.name }}
          path: target/cross/unit-junit.xml
      - name: Push unit test timings
        if: ${{ !cancelled() && env.OTEL_OTLP_AUTH != '' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: ./.github/actions/test-telemetry
        with:
          junit: target/cross/unit-junit.xml
          suite: unit

  # The activation matrix on the platforms the per-PR Linux shell zoo cannot reach.
  shell-activation-deep:
    name: Shell Activation (Deep)
    permissions:
      contents: read
    uses: ./.github/workflows/shell-activation-deep.yml

  # The full acceptance suite on macOS and Windows against native zot, on the binaries `cross`
  # cross-compiled: four shards and one merge job per OS, judged against that OS's own limits. Neither
  # runner has Docker, so `no-docker` declares it and the registry:2 and Sigstore fixtures skip with a
  # `no docker:` reason; the Linux basic tier stays strict and runs them. Replaces the smoke subset
  # that ran here, which this run covers.
  acceptance-native:
    name: Acceptance (${{ matrix.job.name }})
    needs: cross
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: macos-latest, name: macOS, target: aarch64-apple-darwin, limits: test/limits/macos }
          - { os: windows-latest, name: Windows, target: x86_64-pc-windows-gnullvm, limits: test/limits/windows }
    uses: ./.github/workflows/acceptance.yml
    with:
      os: ${{ matrix.job.os }}
      binary: artifact:test-bin-${{ matrix.job.target }}
      shard-count: 4
      limits-dir: ${{ matrix.job.limits }}
      no-docker: true
    secrets:
      # Owed by the secret sweep; only the callee's `binary` job reads it, and `artifact:` skips that job.
      BAZEL_CACHE_WRITE_AUTH: ${{ secrets.BAZEL_CACHE_WRITE_AUTH }}

  # Annotations and the job summary only: the template's caller grants `contents: read`, so no check run.
  test-results:
    name: Publish Deep Test Results
    needs: unit-native
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deep-*
          path: artifacts
      - name: Publish Test Results
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: artifacts/**/*.xml
          require_tests: false
          annotate_only: true

  satellite-verify:
    name: Satellite Verify (ocx-mirror)
    # NON-BLOCKING until ocx-sh/ocx-mirror re-points at the split crates
    # (plan_crate_split_workspace.md DEC-4). The flip is deleting the
    # `continue-on-error` line below and nothing else; the ocx-mirror
    # follow-up PR that WP-39 specifies carries it. While the line is set
    # this job must NEVER be made a required check: the job's own check run
    # still concludes `failure` (only the workflow run and `needs.*.result`
    # read `success`), so a required check on it would block every merge
    # until the mirror re-points — and if GitHub ever read the job as green,
    # it would gate nothing. Either way, required + continue-on-error is a
    # gate that cannot do its job. Job-level rather than step-level so the
    # job shows red in the run view when the task fails.
    continue-on-error: true
    runs-on: ubuntu-latest
    # Reads two public repositories; nothing here writes.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ocx
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ocx
          submodules: true
          persist-credentials: false
      # `actions/checkout` refuses a `path:` outside the workspace, so the
      # satellite is a sibling under it rather than the task's `../ocx-mirror`
      # default, and `OCX_MIRROR_DIR` names it. Its submodule is not fetched:
      # `task satellite:verify` overlays this checkout over the mirror's
      # `external/ocx` (rsync --delete), so the pinned pointer's tree would
      # only be cloned to be deleted.
      - name: Checkout ocx-mirror
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ocx-sh/ocx-mirror
          path: ocx-mirror
          # The default branch: the template's dispatch passes no ref.
          persist-credentials: false
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # The toolchain file and the cached workspace live under `ocx/`, not
          # at the workspace root.
          rust-src-dir: ocx
          matcher: true
          # Same reason as verify-basic.yml: denial lives in
          # [workspace.lints.rust] so the path-vendored forks stay capped.
          rustflags: ""
          # The mirror builds into the persistent target dir the task keeps
          # under `.tmp/satellite-verify/`; cache it (on failure too — the job
          # is expected red until the mirror re-points, and a cache that only
          # saves on green would never warm).
          cache-workspaces: "ocx -> .tmp/satellite-verify/cargo-target"
          cache-on-failure: true
      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Build ocx-mirror against this tree and check the satellite linking rule
        env:
          OCX_MIRROR_DIR: ${{ github.workspace }}/ocx-mirror
        run: task satellite:verify --force

  satellite-contract:
    name: Satellite Contract (ocx-mirror)
    runs-on: ubuntu-latest
    # Reads two public repositories; nothing here writes.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ocx
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ocx
          submodules: true
          persist-credentials: false
      - name: Checkout ocx-mirror
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ocx-sh/ocx-mirror
          path: ocx-mirror
          persist-credentials: false
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rust-src-dir: ocx
          matcher: true
          rustflags: ""
          # The candidate `ocx` and the mirror share this target dir.
          cache-workspaces: "ocx -> .tmp/satellite-verify/cargo-target"
          cache-on-failure: true
      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Run ocx-mirror's acceptance suite against the candidate ocx
        env:
          OCX_MIRROR_DIR: ${{ github.workspace }}/ocx-mirror
        run: task satellite:contract --force

  index-conformance-drift:
    name: Index Conformance Drift
    runs-on: ubuntu-latest
    # Reads a public repository through `gh api`; nothing here writes.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Compare vendored fixtures against ocx-sh/indexbot@main
        env:
          # `gh api` against the public ocx-sh/indexbot; read-only, no elevation.
          GH_TOKEN: ${{ github.token }}
        run: task test:index-conformance-drift
