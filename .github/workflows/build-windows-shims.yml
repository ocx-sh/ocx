# Builds + attests the committed native launcher blobs (issue #66,
# adr_windows_exe_shim.md): one per target triple, Linux, macOS and Windows on
# both architectures. The launcher is cross-built on Linux via cargo-zigbuild
# (no Windows or macOS runner needed for the build), so the per-target matrix
# legs are gated behind a cheap Linux gate job rather than a Windows runner.
#
# This workflow does NOT sign the blob. Authenticode signing (SignPath
# Foundation) is a documented Phase-2 step gated on operations work owned by
# the maintainer (ADR §Out of Implementation Scope) and lands in a separate PR
# that refreshes the committed blob with the signed bytes. Do not add a
# signing step here without the Phase-2 prerequisites.
name: Launcher Build

on:
  push:
    branches: [main]
    # Also watch the build inputs that change the emitted PE bytes — a
    # toolchain / dependency / profile / build-flag change must not bypass
    # the provenance gate (fresh hermetic build + SHA canary; Codex finding 2).
    paths:
      - 'crates/ocx_shim/**'
      - 'crates/ocx_env_apply/**'
      - 'crates/ocx_store/src/shims/**'
      - 'crates/ocx_store/src/shim.rs'
      - 'crates/ocx_package_manager/src/launcher.rs'
      - 'crates/ocx_package_manager/src/launcher/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/config.toml'
      - 'taskfiles/rust.taskfile.yml'
      - '.github/workflows/build-windows-shims.yml'
      - '.github/workflows/launcher-blobs.yml'
      - 'scripts/launcher_blob_check.sh'
      - 'scripts/shim_inputs.py'
      - 'crates/ocx_store/src/shim_inputs.sha256'
      - 'test/tests/test_windows_shim.py'
      - 'test/tests/test_trampoline_exec.py'
      - 'test/conftest.py'
  pull_request:
    branches: [main]
    paths:
      - 'crates/ocx_shim/**'
      - 'crates/ocx_env_apply/**'
      - 'crates/ocx_store/src/shims/**'
      - 'crates/ocx_store/src/shim.rs'
      - 'crates/ocx_package_manager/src/launcher.rs'
      - 'crates/ocx_package_manager/src/launcher/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/config.toml'
      - 'taskfiles/rust.taskfile.yml'
      - '.github/workflows/build-windows-shims.yml'
      - '.github/workflows/launcher-blobs.yml'
      - 'scripts/launcher_blob_check.sh'
      - 'scripts/shim_inputs.py'
      - 'crates/ocx_store/src/shim_inputs.sha256'
      - 'test/tests/test_windows_shim.py'
      - 'test/tests/test_trampoline_exec.py'
      - 'test/conftest.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Cheap Linux gate: the per-arch matrix only runs if the host-runnable
  # ocx_shim/launcher specification suite is green (cost: gate Windows-class
  # work behind Linux passing — subsystem-ci.md cost table).
  gate:
    name: Linux Gate (launcher spec tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Setup OCX
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: '0.6.2'
          # Toolchain from ocx.toml + ocx.lock (uv, go-task, CPython), as in
          # verify-basic.yml; the object store stays uncached, as there.
          cache: false
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # The gate compiles the path-vendored sigstore fork
          # (external/sigstore-rs), reached through both ocx_store and
          # ocx_package_manager; the action's default RUSTFLAGS=-D warnings
          # denies its upstream lints (Cargo does not auto-cap path deps).
          # Denial is scoped to [workspace.lints.rust] instead.
          rustflags: ""
      # actions-rust-lang/setup-rust-toolchain does NOT ship cargo-nextest;
      # the repo provisions it via taiki-e/install-action everywhere it runs
      # nextest in CI (verify-basic.yml, verify-deep.yml). Without this the
      # gate step fails `no such command: nextest`, so `build` and
      # `acceptance-windows` (both `needs: gate`) never run and the committed
      # shim blobs / Win32 behaviours are unprotected.
      - name: Install nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest
      - name: Shim + launcher spec tests (host-runnable)
        run: cargo nextest run -p ocx_shim -p ocx_store -p ocx_package_manager --locked

  build:
    name: Cross-build ${{ matrix.target }}
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # SLSA provenance (Sigstore/Rekor OIDC)
      attestations: write   # actions/attest-build-provenance
    strategy:
      # The six targets are independent and each must pass the blob validation
      # gate; fail-fast would mask one target's status behind another's.
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-gnullvm
          - aarch64-pc-windows-gnullvm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
          # The drift check below walks `git log` per path.
          fetch-depth: 0
      - name: Setup OCX
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: '0.6.2'
          # Toolchain from ocx.toml + ocx.lock (uv, go-task, CPython), as in
          # verify-basic.yml; the object store stays uncached, as there.
          cache: false
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          # rust-toolchain.toml pins the channel and the gnullvm targets; this
          # adds the per-matrix target, which is how the musl and darwin
          # targets get installed.

      # Zig = the hermetic toolchain: it bundles clang, lld and the libc
      # headers, so the build depends on no floating Microsoft or Apple SDK
      # (the launcher links only libSystem on macOS, which zig stubs itself). The blob
      # is NOT byte-reproducible (see the provenance-gate step below), but the
      # Zig version does change the emitted bytes — bump it in a blob-refresh
      # PR, never on its own (see adr_shim_hermetic_zigbuild.md).
      # Stable release fetched directly from the canonical permanent URL.
      # Rationale: (1) ziglang.org dev builds 404 within weeks; only stable
      # tarballs are permanent, and this job must still build a year from now.
      # (2) mlugg/setup-zig's community-mirror index proved unreliable here
      # (every mirror + official 404'd). A pinned ziglang.org/download URL is
      # immutable for a stable release and removes the third-party + mirror
      # dependency entirely. ZIG_VERSION changes the emitted bytes — bump
      # deliberately in a blob-refresh PR.
      - name: Setup Zig
        env:
          ZIG_VERSION: "0.16.0"
          ZIG_SHA256: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
        run: |
          set -euo pipefail
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "Zig ${ZIG_VERSION} -> $url"
          curl -fsSL --retry 3 -o zig.tar.xz "$url"
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
          mkdir -p zig-dist && tar -xf zig.tar.xz -C zig-dist --strip-components=1
          echo "$PWD/zig-dist" >> "$GITHUB_PATH"
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-zigbuild@0.22.3

      # Fresh hermetic build — must succeed (proves the pinned Zig+rustc
      # toolchain still produces a working shim for changed build inputs).
      # The committed blob, not this output, is the attested artifact.
      - name: Cross-build shim (cargo-zigbuild, hermetic, stripped `shim` profile)
        run: task rust:shim:build TARGET=${{ matrix.target }}

      - name: Resolve blob paths
        id: paths
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            *-pc-windows-gnullvm) ext=".exe" ;;
            *) ext="" ;;
          esac
          built="target/${TARGET}/shim/ocx-shim${ext}"
          committed="crates/ocx_store/src/shims/ocx-shim-${TARGET}${ext}"
          echo "built=${built}" >> "$GITHUB_OUTPUT"
          echo "committed=${committed}" >> "$GITHUB_OUTPUT"

      # Canonical hermetic bytes, uploaded BEFORE the validation gate and
      # even if it fails: this is the authoritative source for the blob-refresh
      # PR flow (a dev machine cannot necessarily install the pinned Zig).
      - name: Upload freshly built blob (refresh source)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocx-shim-fresh-${{ matrix.target }}
          path: ${{ steps.paths.outputs.built }}
          compression-level: 0
          retention-days: 1
          overwrite: true

      # Provenance / inputs gate (NOT byte-equality). cargo-zigbuild's
      # gnullvm PE link is not byte-reproducible run-to-run even with a
      # pinned Zig+rustc and /Brepro (lld embeds a per-link build id that
      # /Brepro does not neutralize; verified across ~10 CI runs). A
      # byte-identical-rebuild gate is therefore impossible here. Integrity
      # instead rests on three controls:
      #   1. SLSA build provenance attested on the committed blob (below).
      #   2. The in-tree RECORDED_SHA256 corruption canary — verified here
      #      against the committed blob so a refresh that updates the blob
      #      but not the constant (or vice versa) fails loudly.
      #   3. This job's path filter: any change to the shim build inputs
      #      (crates/ocx_shim/**, Cargo.lock, rust-toolchain.toml, the
      #      taskfile, this workflow) runs this job, and a fresh hermetic
      #      build must still succeed + fit the budget; the refresh PR
      #      re-cuts the blob from the uploaded artifact above.
      # See adr_shim_hermetic_zigbuild.md §"gate redesign".
      - name: Validate shim blobs (provenance model)
        env:
          TARGET: ${{ matrix.target }}
          BUILT: ${{ steps.paths.outputs.built }}
          COMMITTED: ${{ steps.paths.outputs.committed }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            *-pc-windows-gnullvm) magic="4d5a";     kind="PE" ;;
            *-unknown-linux-musl) magic="7f454c46"; kind="ELF" ;;
            *-apple-darwin)       magic="cffaedfe"; kind="64-bit Mach-O" ;;
            *) echo "::error::no image format known for ${TARGET}"; exit 1 ;;
          esac
          # The fail-closed size budget declared in shim.rs, one budget for
          # every blob (C-019).
          budget_kib="$(grep -oE 'SHIM_SIZE_BUDGET: usize = [0-9]+ \* 1024' \
            crates/ocx_store/src/shim.rs | grep -oE '^SHIM_SIZE_BUDGET: usize = [0-9]+' \
            | grep -oE '[0-9]+$')"
          max=$(( budget_kib * 1024 ))
          # Fresh build and committed blob both: the fresh one fits the budget
          # before any refresh PR exists, the committed one is what ships.
          for blob in "$BUILT" "$COMMITTED"; do
            # 1. the right image format for the target
            got_magic="$(head -c"$(( ${#magic} / 2 ))" "$blob" | od -An -tx1 | tr -d ' \n')"
            if [ "$got_magic" != "$magic" ]; then
              echo "::error::${blob} is not a ${kind} image (magic ${got_magic}, want ${magic})"
              exit 1
            fi
            # 2. within the size budget
            size=$(stat -c%s "$blob")
            if [ "$size" -gt "$max" ]; then
              echo "::error::${blob} ${size}B exceeds SHIM_SIZE_BUDGET ${max}B"
              exit 1
            fi
            # 3. the macOS code signature: arm64 refuses to run an unsigned
            # image, x86_64 needs none (C-019). Presence is the load command,
            # so a missing signature fails here, not on a user's machine.
            case "$TARGET" in
              *-apple-darwin)
                python3 -I - "$blob" "$TARGET" <<'PY'
          import struct, sys
          LC_CODE_SIGNATURE = 0x1D
          data = open(sys.argv[1], "rb").read()
          ncmds = struct.unpack_from("<I", data, 16)[0]
          off, signed = 32, False
          for _ in range(ncmds):
              cmd, size = struct.unpack_from("<II", data, off)
              signed |= cmd == LC_CODE_SIGNATURE
              off += size
          want = sys.argv[2].startswith("aarch64-")
          if signed != want:
              sys.exit(f"::error::{sys.argv[1]} LC_CODE_SIGNATURE present={signed}, want {want}")
          PY
                ;;
            esac
            echo "OK: ${blob} valid ${kind}, ${size}B <= ${max}B"
          done
          # 4. corruption canary: the committed blob's digest is recorded in
          # shim.rs. Looked up by value, not by position, so no blob order is
          # assumed; a blob refreshed without its constant (or the constant
          # without the blob) fails here.
          got="$(sha256sum "$COMMITTED" | cut -d' ' -f1)"
          if ! grep -q "\"${got}\"" crates/ocx_store/src/shim.rs; then
            echo "::error::${COMMITTED} sha256 ${got} is not recorded in crates/ocx_store/src/shim.rs"
            echo "::error::Refresh: download the ocx-shim-fresh-${TARGET} artifact, replace the blob, update its SHA-256 in crates/ocx_store/src/shim.rs."
            exit 1
          fi
          echo "OK: ${COMMITTED} sha ${got} recorded in shim.rs"

      # SLSA Build provenance on the committed blob (real provenance leg; the
      # in-tree SHA is only a corruption canary — ADR §"SHA256 = corruption
      # canary"). Refresh-PR checklist adds `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.paths.outputs.committed }}

      - name: Upload shim blob
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocx-shim-${{ matrix.target }}
          path: ${{ steps.paths.outputs.committed }}
          compression-level: 0
          retention-days: 7
          overwrite: true

      # The three provenance controls above (SLSA attestation, the RECORDED_SHA256
      # canary, this job's path filter) all answer "have the committed bytes
      # been corrupted". NONE answers "were the committed bytes built from the
      # committed source" -- RECORDED_SHA256 matches a stale blob perfectly, so a
      # shim source change that forgets the refresh passes every existing gate
      # while the shipped reader and the shipped writer disagree about the wire
      # format between them.
      #
      # Not hypothetical: the `.exec` sidecar gained a second line in source
      # while the blobs kept the one-line parser, which made every Windows
      # trampoline exit 78 with a fully green tree.
      #
      # Byte-reproducibility cannot close this (see above -- lld embeds a
      # per-link build id). Reachability can. Runs LAST so the fresh-blob
      # artifact this failure tells you to use has already been uploaded.
      - name: Committed blobs must be re-cut when shim sources change
        env:
          COMMITTED: ${{ steps.paths.outputs.committed }}
        run: |
          set -euo pipefail
          # Recency, not membership. A range check ("did this branch touch both
          # trees?") passes a branch that re-cut the blobs early and then changed
          # the shim again -- which is exactly the state that ships a two-line
          # sidecar against a one-line parser. Compare the last commit to touch
          # each tree instead: the blobs must be at or after the sources.
          # `:(exclude)` on the Bazel description: `crates/ocx_shim/BUILD.bazel`
          # describes a parallel build of the same sources and cannot change a
          # byte of the cargo-built blob, so a commit that only adds or edits it
          # is not a source change. Everything else under the tree still is --
          # the exclusion names one file, not a glob, so a new `.rs` or a
          # `Cargo.toml` bump still reds here.
          # `crates/ocx_env_apply/` is the shim's sidecar decoder: a change there
          # changes the blob's bytes the same way. The recorded input digest counts as a
          # source too: rewriting it without a re-cut would clear the next step's check.
          last_src="$(git log -1 --format=%H HEAD -- crates/ocx_shim/ crates/ocx_env_apply/ crates/ocx_store/src/shim_inputs.sha256 ':(exclude)crates/ocx_shim/BUILD.bazel' ':(exclude)crates/ocx_env_apply/BUILD.bazel')"
          # This leg's own blob: re-cutting one of the six must not clear the check for the other five.
          last_blob="$(git log -1 --format=%H HEAD -- "$COMMITTED")"
          if [ -z "$last_src" ]; then
            echo "::error::no commit touches crates/ocx_shim/, crates/ocx_env_apply/ or crates/ocx_store/src/shim_inputs.sha256: the pathspec matches nothing, so nothing was compared"; exit 1
          fi
          if [ -z "$last_blob" ]; then
            echo "::error::shim sources exist but no committed blob was ever recorded"; exit 1
          fi
          if [ "$last_src" = "$last_blob" ]; then
            echo "shim sources and blobs move together at $(git log -1 --format=%h "$last_src")"; exit 0
          fi
          if git merge-base --is-ancestor "$last_src" "$last_blob"; then
            echo "blobs re-cut at $(git log -1 --format=%h "$last_blob"), at or after the last source change"
            exit 0
          fi
          echo "::error::the committed shim blobs are older than the shim sources."
          echo "last shim source change: $(git log -1 --format='%h %s' "$last_src")"
          echo "last blob re-cut:        $(git log -1 --format='%h %s' "$last_blob")"
          echo "Re-cut them from THIS run's ocx-shim-fresh-<target> artifacts and update"
          echo "every blob's SHA-256 in crates/ocx_store/src/shim.rs (ritual: its module doc)."
          exit 1

      # The non-source half of the same question: a toolchain, profile, dependency or Zig bump changes
      # the blobs as surely as a source edit, and the step above sees only the two source trees. Also
      # last, after the refresh artifact is uploaded.
      - name: Committed blobs must be re-cut when a build input changes
        run: task rust:shim:inputs:check

  # Windows acceptance: the genuinely Win32-dependent shim behaviours
  # (PATHEXT resolution, CreateProcessW argv passthrough, the BatBadBut
  # `& whoami` regression, exit-code propagation, missing/malformed sidecar,
  # OCX_BINARY_PIN honouring) that the host-runnable unit tests cannot cover.
  # Without this job `test_windows_shim.py` is green-by-skip (no runner ever
  # supplies an `ocx-shim.exe`), so those regressions never gate (Codex
  # finding 3). Registry-independent: the fixture builds a fake pkg_root on
  # disk; the `registry:2` Docker fixture is Linux-only and is NOT used here
  # (system_design §8). Gated behind the cheap Linux `gate` job per
  # subsystem-ci.md cost rules (Windows runner = ~1.7x Linux).
  acceptance-windows:
    name: Windows Acceptance (launcher)
    needs: gate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      # The ocx this puts on PATH never reaches the tests below: their fixture
      # strips every ambient ocx and pins its own stand-ins.
      - name: Setup OCX
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: '0.6.2'
          # Toolchain from ocx.toml + ocx.lock (uv, go-task, CPython), as in
          # verify-basic.yml; the object store stays uncached, as there.
          cache: false

      # Native windows-latest build (debug — acceptance, not a published
      # binary; subsystem-ci.md "no --release for tests"). This is the shim
      # the Python acceptance suite drives via OCX_SHIM_BINARY.
      - name: Build ocx-shim (native windows)
        run: cargo build -p ocx_shim --locked

      # Run ONLY the Windows shim acceptance module. The general acceptance
      # suite needs the `registry:2` Docker fixture which does not start on
      # windows-latest; this module is registry-independent by design and is
      # invoked directly (not via `task test`, which would start the registry
      # and rebuild `ocx`).
      - name: Windows shim acceptance tests
        working-directory: test
        shell: bash
        env:
          # The live gate: point the suite at the freshly built shim so the
          # tests run instead of skipping (the false-green condition).
          OCX_SHIM_BINARY: ${{ github.workspace }}/target/debug/ocx-shim.exe
          # Registry-independent: skip the `docker compose up registry:2`
          # session hook (Docker registry is Linux-only — system_design §8).
          OCX_TESTS_NO_REGISTRY: "1"
        run: uv run pytest tests/test_windows_shim.py tests/test_trampoline_exec.py -v

  # The committed blobs themselves, each on its own OS and architecture. `build` and
  # `acceptance-windows` test fresh builds; only this job starts the bytes `ocx` embeds.
  native-blobs:
    name: Committed blobs (native)
    needs: gate
    permissions:
      contents: read
    uses: ./.github/workflows/launcher-blobs.yml

  # Phase-2 placeholder (NOT implemented): Authenticode signing via SignPath
  # Foundation. Prerequisites (ocx.sh /code-signing-policy page, maintainer
  # MFA, RFC3161 timestamping, strip-before-sign) are operations work owned by
  # the maintainer (ADR §Out of Implementation Scope). The signing step
  # (~15 lines, no Windows runner) lands in a separate PR that also refreshes
  # the committed blob with the signed bytes. Do not implement it here.
