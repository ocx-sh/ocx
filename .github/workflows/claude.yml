# ocx-baseline: template-owned file — change ocx-sh/conventions, then run task copier:update
name: Claude

# PR review on open, ready and new pushes, plus an @claude responder on comments. Every job skips (green, not red)
# when CLAUDE_CODE_OAUTH_TOKEN is empty; PR review also skips fork PRs, whose secrets are never available. Secrets
# cannot be read in a job `if:`, so the gate job exports the answer as an output.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  gate:
    name: Token gate
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      has_token: ${{ steps.token.outputs.has_token }}
    steps:
      - id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

  review:
    name: PR review
    needs: gate
    if: >-
      needs.gate.outputs.has_token == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review with Claude Code
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read the diff with `gh pr diff` and judge it for correctness, security, and
            the repo's conventions in AGENTS.md (read it first, if present). Comment inline on concrete problems,
            then post exactly one summary review comment with `gh pr comment`: a verdict plus the issues that matter.
            Skip style nits a linter would catch. Do not push commits or edit files.
          claude_args: >-
            --max-turns 25
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  respond:
    name: "@claude responder"
    needs: gate
    if: >-
      needs.gate.outputs.has_token == 'true' &&
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Respond to @claude
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          # The job's own token: without it the action exchanges the OIDC token for the write-capable Claude App token.
          github_token: ${{ github.token }}
          claude_args: >-
            --max-turns 25
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
