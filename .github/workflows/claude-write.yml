name: Claude Write

# The write-capable Claude responder. `claude.yml` is the conventions template's read-only reviewer and
# `@claude` responder (`contents: read`); this file is the one that may edit files and push, so it answers
# only what the template does not, and never the same event twice:
#
#   - an issue labelled `claude`, or opened with `@claude` in its body (the template takes no `issues` events);
#   - a comment holding `/claude-write` and no `@claude` (the template answers every `@claude` comment).
#
# Only an org member or owner can start it. `.claude/tests/test_workflows.py` holds the disjointness.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled, opened]

permissions: {}

jobs:
  claude:
    # Gate: only org members and owners can trigger Claude. The association checked is the author of the
    # text Claude will read: the comment for a comment event, the issue for an issue event.
    if: |
      (
        (
          (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
          (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER') &&
          contains(github.event.comment.body, '/claude-write') &&
          !contains(github.event.comment.body, '@claude')
        ) ||
        (
          github.event_name == 'issues' &&
          (github.event.issue.author_association == 'MEMBER' || github.event.issue.author_association == 'OWNER') &&
          (
            (github.event.action == 'labeled' && github.event.label.name == 'claude') ||
            (github.event.action == 'opened' && contains(github.event.issue.body, '@claude'))
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        # The action replaces the checkout's credential with its own token before it pushes
        # (src/github/operations/git-config.ts `replaceCheckoutCredentials` in anthropics/claude-code-action),
        # so the checkout keeps none.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # `@claude` starts an issue; `/claude-write` starts a comment. The label needs no phrase.
          trigger_phrase: ${{ github.event_name == 'issues' && '@claude' || '/claude-write' }}
          # The job's own token, as in the template's responder: without it the action exchanges an OIDC
          # token for the write-capable Claude App token, and this job holds no `id-token` grant.
          github_token: ${{ github.token }}
          claude_args: "--max-turns 25 --allowedTools '*'"
