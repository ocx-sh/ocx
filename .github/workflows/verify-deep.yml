name: Verify Deep

# The deep tier of the two-tier gate (subsystem-ci.md "Verification tiers"):
# the 3-OS build + unit matrix, the Windows-arm64 cross-compile, the full
# acceptance suite with the Sigstore stack, and `satellite-verify`. Runs on
# demand, on `main`, in the merge queue and weekly — NOT per pull request,
# because a deep run is ≈113 runner-minutes against the basic tier's ≈18, most
# of it Windows and macOS minutes (subsystem-ci.md "Cost Factors"), and every
# PR paid it on every push. `verify-basic.yml` is the whole automatic PR gate
# now; the deep tier is opt-in per branch:
#
#     gh workflow run verify-deep.yml --ref <branch>
#
# STATED RESIDUAL — no pull request compiles the `cfg(windows)` /
# `cfg(target_os = "macos")` arms or runs the full acceptance suite unless
# someone dispatches this workflow. The push to `main` below is where that
# coverage lands automatically, which is after the merge, not before it.

on:
  # The manual invocation, and with the `pull_request` trigger gone the only
  # way a branch gets deep coverage before it lands.
  workflow_dispatch:
  # Reusable: composed into the pre-release `release-readiness.yml` gate so a
  # single dispatch reports one GO/NO-GO across all platforms.
  workflow_call:
    inputs:
      full:
        description: Run the build / cross-compile / acceptance matrix, not just the drift check.
        type: boolean
        default: true
  # Every push to `main`: merges are rebase-only and there is no queue, so a PR
  # verified at its own head lands on a `main` that moved since, and this is
  # the one full run over the tree that actually landed (DX-16).
  # `verify-basic.yml` runs its smoke tier on the same push.
  # remove push: [main] once merge_group is live (D6)
  push:
    branches: [main]
  # The merge queue, so a deep check the owner later marks required can still
  # run on the queued merge commit.
  merge_group: {}
  # Weekly, for `index-conformance-drift` only — it is the one check here that
  # can go stale without anyone touching this repository. The build / cross-compile
  # / acceptance matrix stays off the cron: a cron'd 3-OS build plus Docker
  # acceptance is real money for a signal the push to `main` already produces.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  checks: write
  pull-requests: write

# Literal group name (not the subsystem-ci.md §6 `${{ github.workflow }}-...`
# convention), for the reason spelled out in `shell-activation-deep.yml`: this
# workflow is also reused from `release-readiness.yml`, where `github.workflow`
# resolves to the CALLER's name and the convention would make parent and child
# contend for one group.
concurrency:
  group: verify-deep-${{ github.ref }}
  # A cancelled merge-queue run is a failed check to the queue, which then
  # drops the entry — so queue refs are never cancelled; `main` keeps its
  # carve-out. `.claude/tests/test_workflows.py` asserts this expression.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/gh-readonly-queue/') && github.ref != 'refs/heads/main' }}

jobs:
  index-conformance-drift:
    name: Index Conformance Drift
    # Unconditional: this is the job the weekly cron exists for.
    runs-on: ubuntu-latest
    # Reads a public repository through `gh api`; nothing here writes.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      - name: Compare vendored fixtures against ocx-sh/indexbot@main
        env:
          # `gh api` against the public ocx-sh/indexbot; read-only, no elevation.
          GH_TOKEN: ${{ github.token }}
        run: task test:index-conformance-drift

  build:
    name: Build & Unit Test (${{ matrix.job.name }})
    # Under `workflow_call` the `github` context is the CALLER's, so
    # `github.event_name` alone would skip this matrix for a caller that ever
    # gains a `schedule:` trigger — a GO verdict over no build at all.
    # `inputs.full` is null on our own dispatch/cron and true (its default) on
    # every call, so the expensive legs are tied to the call, not the trigger.
    if: github.event_name != 'schedule' || inputs.full
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: ubuntu-latest, name: Linux, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, name: macOS, target: aarch64-apple-darwin }
          - { os: windows-latest, name: Windows, target: x86_64-pc-windows-msvc }
    env:
      # One target dir per job: the build passes `--target=`, so a bare
      # `cargo run` (task schema:generate) landed in target/release and paid a
      # second full compile of the workspace (5.8 min on Linux, run 35003182482).
      CARGO_BUILD_TARGET: ${{ matrix.job.target }}
      # Shared compile cache: sccache in front of the Garage S3 store at
      # sccache.ocx.sh (herwig-systems/server-hetzner1#2). A fork PR sees no
      # secrets; then RUSTC_WRAPPER is empty, cargo runs rustc directly and the
      # sccache step below is skipped — never a build that fails on a missing
      # cache. The org secrets are SCCACHE_AWS_*; the S3 client reads AWS_*.
      SCCACHE_ENABLED: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID != '' }}
      RUSTC_WRAPPER: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      SCCACHE_BUCKET: cache
      SCCACHE_ENDPOINT: https://sccache.ocx.sh
      SCCACHE_REGION: garage
      SCCACHE_S3_KEY_PREFIX: v1
      SCCACHE_S3_USE_SSL: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      # Test telemetry (subsystem-ci.md § Test telemetry). Lifted into the job
      # env for the same reason the sccache credentials are: `secrets` is not
      # a context a composite action's `if:` can read, and the step below
      # guards on `env.OTEL_OTLP_AUTH != ''` so a fork PR — which sees no
      # secrets — skips the push instead of failing it.
      OTEL_OTLP_AUTH: ${{ secrets.OTEL_OTLP_AUTH }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: true
      - name: Build
        uses: ./.github/actions/build-rust
        with:
          target: ${{ matrix.job.target }}
          # Acceptance (Linux) runs this binary; the self-update test seam
          # (__OCX_SELF_IMAGE) is gated behind ocx/__testing — match the
          # local `task test` build. These are test-only artifacts.
          features: ocx/__testing
      # nextest is the engine on macOS and Windows only. The two legs are split
      # rather than unified, and the reason is the floor: `crates/TEST_TARGET_MAP.toml`
      # records a per-target case count measured on Linux, and `cfg`-gated tests make
      # those counts platform-dependent — the same reason `rust:test:floor` and
      # `rust:test:ceiling` have carried `platforms: [linux]` since they existed.
      # A Bazel lane on Windows would red against Linux's numbers, and re-recording
      # them per platform is three tables where there is one subject.
      - name: Install nextest
        if: matrix.job.name != 'Linux'
        uses: taiki-e/install-action@65851e10cd6c377f11a60e600abc07cb08643468 # v2.79.3
        with:
          tool: cargo-nextest
      - name: Test
        if: matrix.job.name != 'Linux'
        run: cargo nextest run --workspace --target=${{ matrix.job.target }} --profile ci --locked
      - name: Setup Task
        if: matrix.job.name == 'Linux'
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      # `ocx` on PATH is a prerequisite, not a convenience: every task in
      # `taskfiles/bazel.taskfile.yml` shells out through `ocx exec bazel --`,
      # and without it the step below exits 127. `project: ''` would be wrong
      # here — `ocx exec` resolves the bazel binding from this repository's own
      # `ocx.toml`, which is where the 9.2.0 pin `bazel:pin:check` asserts lives.
      - name: Setup OCX
        if: matrix.job.name == 'Linux'
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: '0.6.2'
          # Default-off: the action would otherwise restore
          # $OCX_HOME/{blobs,layers,packages,tags} across runs, and a restored
          # object store is runner-executable content.
          cache: false
      # The **read** credential, on the Linux leg only because it is the only
      # leg that runs bazel. Read, never write: `write-auth` is not passed here
      # in any spelling, so this job holds no write credential and the cache
      # stays read-only on every trigger this workflow has — which includes a
      # non-draft pull request, the lane the cache exists for. A fork PR sees no
      # secrets, the binding is the empty string, the action writes nothing and
      # `bazel:test:unit` omits `--bazelrc` and reads anonymously. Without this
      # step every request was an anonymous 401 and the step below compiled cold.
      - name: Bazel cache credential
        if: matrix.job.name == 'Linux'
        uses: ./.github/actions/bazel-cache-rc
        with:
          read-auth: ${{ secrets.BAZEL_CACHE_READ_AUTH }}
      # C-016's other half. `verify-basic.yml`'s `smoke` job carries the same
      # swap and the measurement behind it; this leg differs only in that its
      # `Test` step had no floor and no ceiling at all — it was a bare
      # `cargo nextest run`, so the swap *adds* a coverage gate here rather
      # than moving one. `CARGO_BUILD_TARGET` is set job-wide and Bazel ignores
      # it; the Bazel lane's platform comes from its own toolchain resolution.
      # The twin of `verify-basic.yml`'s, which carries the reasoning. Both
      # lanes compile Rust under Bazel against one shared remote cache, so the
      # linker the autoconfigured C++ toolchain picks has to be the same on
      # both or neither ever hits the other's entries.
      - name: Install lld
        if: matrix.job.name == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: Unit tests (Bazel)
        if: matrix.job.name == 'Linux'
        run: task bazel:test:unit
      # C-015's caller half; see the twin in `verify-basic.yml`. `always()`
      # rather than `success()`, and no platform half in the condition: the
      # cleanup is `rm -f` over two names, so it is green on the macOS and
      # Windows legs where nothing was ever written, and a second condition is
      # a second thing that can go stale.
      - name: Remove the Bazel cache credential
        if: always()
        uses: ./.github/actions/bazel-cache-rc
        with:
          cleanup: 'true'
      - name: Generate Schema
        if: matrix.job.name == 'Linux'
        run: task schema:generate
      - name: Upload Schema
        if: matrix.job.name == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocx-schema
          path: website/src/public/schemas/metadata/v1.json
          retention-days: 1
      # Every leg publishes now, and the path is the one its own engine wrote.
      # Bazel's synthesised `test.xml` still carries one `testcase` per *target*
      # (34, against 8213 cases), which is why the Linux leg skipped both steps
      # after the swap — but `task bazel:test:unit` writes a per-case report at
      # `target/bazel/junit.xml` off the same `test.log` files its floor reads,
      # and that one is the peer of nextest's. `junit.xml` on both sides so the
      # `test-results` job's `artifacts/**/junit.xml` glob needs no second
      # spelling. macOS and Windows are unchanged.
      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deep-unit-${{ matrix.job.name }}
          path: ${{ matrix.job.name == 'Linux' && 'target/bazel/junit.xml' || 'target/nextest/ci/junit.xml' }}
      # Per-test timings to otel.ocx.sh, so the dashboards can name which unit
      # tests accumulate the wall clock on which OS. `!cancelled()` rather than
      # `success()`: a failing suite still writes the report, and its timings
      # are the ones worth looking at. Tolerated twice over — the action turns
      # every one of its own failures into a warning, and this guards the case
      # where the runner kills it.
      - name: Push unit test timings
        if: ${{ !cancelled() && env.OTEL_OTLP_AUTH != '' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: ./.github/actions/test-telemetry
        with:
          junit: ${{ matrix.job.name == 'Linux' && 'target/bazel/junit.xml' || 'target/nextest/ci/junit.xml' }}
          suite: unit

  cross-compile:
    name: Cross-compile (${{ matrix.job.name }})
    if: github.event_name != 'schedule' || inputs.full
    runs-on: ubuntu-latest
    container:
      image: messense/cargo-xwin
    strategy:
      fail-fast: false
      matrix:
        job:
          # x86_64-pc-windows-msvc is now built natively in the `build` job
          # (windows-latest leg) so it can execute unit tests, including the
          # cfg(target_os = "windows") F1/F2 cannot-recur tests. Cross-compile
          # leg keeps aarch64 only — no native arm64 Windows runner on GitHub.
          - { name: Windows ARM64, target: aarch64-pc-windows-msvc }
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: true
      - name: Install Rust target
        run: rustup target add ${{ matrix.job.target }}
      - name: Build
        run: cargo xwin build --release --target=${{ matrix.job.target }} --locked
      - name: Prepare Binaries
        run: |
          cp target/${{ matrix.job.target }}/release/ocx.exe ocx-${{ matrix.job.target }}.exe
      - name: Upload ocx Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocx-${{ matrix.job.target }}
          path: ocx-${{ matrix.job.target }}.exe
          compression-level: 0
          retention-days: 7

  acceptance-tests:
    name: Acceptance (${{ matrix.job.name }})
    needs: [build, cross-compile]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # No macOS entry: arm64 runners (macos-14/15) lack nested virtualization
          # so Docker/Colima cannot run. Intel runners (macos-13) support Colima but
          # add ~$0.87/run and complexity for marginal gain over the arm64 unit tests
          # in the build job. Revisit if GitHub ships M3 runners with nested virt.
          #
          # No Windows entry: the embedded `registry:2` Docker image does not run
          # reliably on `windows-latest` runners (Linux container under Hyper-V
          # routing issues). F1 / F2 cannot-recur coverage is provided by the
          # `windows-latest` leg of the `build` job above via cfg(target_os =
          # "windows") unit tests. See ADR adr_file_lock_unification.md §CI
          # Integration. Revisit if a stable Windows registry option appears.
          - { os: ubuntu-latest, name: Linux, target: x86_64-unknown-linux-gnu, ext: "" }
    env:
      # Test telemetry, same guard as the `build` job above: `secrets` is not
      # readable from a composite action's `if:`, so the value is lifted here
      # and the push step tests `env.OTEL_OTLP_AUTH != ''`.
      OTEL_OTLP_AUTH: ${{ secrets.OTEL_OTLP_AUTH }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - name: Start Registry
        shell: bash
        run: |
          # zot (OCI 1.1 Referrers API) is the primary acceptance registry —
          # distribution's registry:2/registry:3 do NOT serve
          # /v2/<name>/referrers/<digest> (#195). Started from the compose file
          # (single source of truth). Both services run so the registry:2
          # negative fixture (legacy_registry, #106) is CI-provable and the
          # mirror tests run in CI too (deliberate scope expansion).
          docker compose -f test/docker-compose.yml up -d registry mirror-registry
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:5000/v2/ > /dev/null 2>&1; then
              echo "Registry is ready"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::Registry did not become reachable"
          exit 1
      - name: Start Sigstore stack
        shell: bash
        run: |
          # The signing acceptance tests run against a real Fulcio + Rekor +
          # TesseraCT + dex stack, not a fake, so the `sigstore` profile is a
          # hard prerequisite: `tests/fixtures/sigstore_stack.py` raises rather
          # than skipping, because a skip here is indistinguishable from a pass
          # and these are the tests carrying the supply-chain contract.
          #
          # Started here rather than left to the session fixture so the image
          # pull is its own step with its own log, and so the elapsed number the
          # ADR asks for is recorded on every run.
          start=$SECONDS
          docker compose -f test/docker-compose.yml --profile sigstore up -d
          # Four of the seven images are distroless, so compose healthchecks
          # cannot run inside them; wait-for-stack.py polls from the host and is
          # the same gate the fixtures use and the self-hosting docs hand out.
          python3 test/sigstore/wait-for-stack.py --timeout 300
          echo "sigstore stack ready in $((SECONDS - start))s"
      # The readiness gate prints which service is down and names the log
      # command, but nobody can run that command on a finished runner — without
      # this step a bring-up failure costs a whole second run to diagnose.
      - name: Sigstore stack logs (on failure)
        if: failure()
        shell: bash
        run: |
          docker compose -f test/docker-compose.yml --profile sigstore ps
          for service in rekor trillian-log-server trillian-log-signer sigstore-mysql fulcio sigstore-ct dex; do
            echo "::group::$service"
            docker compose -f test/docker-compose.yml --profile sigstore logs --tail=80 "$service" || true
            echo "::endgroup::"
          done
      - name: Download Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ocx-${{ matrix.job.target }}
          path: test/bin
      - name: Download Schema
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ocx-schema
          path: website/src/public/schemas/metadata
      - name: Prepare Binaries
        shell: bash
        run: |
          mv "test/bin/ocx-${{ matrix.job.target }}${{ matrix.job.ext }}" "test/bin/ocx${{ matrix.job.ext }}"
          chmod +x test/bin/ocx${{ matrix.job.ext }}
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Setup Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      # `ocx` on PATH is a prerequisite of the step below, not a convenience:
      # every task in `taskfiles/bazel.taskfile.yml` shells out through
      # `ocx exec bazel --`, which is how the 9.2.0 pin in this repository's own
      # `ocx.toml` reaches the command. Without it the run exits 127. Same
      # spelling and same reason as the `build` job's Linux leg.
      - name: Setup OCX
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: '0.6.2'
          # Default-off: the action would otherwise restore
          # $OCX_HOME/{blobs,layers,packages,tags} across runs, and a restored
          # object store is runner-executable content.
          cache: false
      # The **read** credential, never the write one — `write-auth` is not
      # passed here in any spelling, so this job holds no write credential on
      # any trigger. A fork PR sees no secrets, the binding is the empty string,
      # the action writes nothing, and `bazel:test:accept` omits `--bazelrc` and
      # reads the cache anonymously over `--disk_cache`. Copied from the `build`
      # job's Linux leg, which is the only other lane that runs bazel.
      - name: Bazel cache credential
        uses: ./.github/actions/bazel-cache-rc
        with:
          read-auth: ${{ secrets.BAZEL_CACHE_READ_AUTH }}
      - name: Run Acceptance Tests
        shell: bash
        # `ubuntu-latest` ships systemd, so its `environment.d` generator is
        # present and a skip in `test_session_path.py` would mean the binary
        # moved — not that the host lacks it. The `environment.d` prepend has
        # open upstream reports of not landing for PATH (systemd/systemd#40430),
        # so this is the one leg where "skipped" and "passed" must not read the
        # same. Fails closed: any value but empty or `0` arms the gate.
        env:
          __OCX_TESTING_REQUIRE_ENVIRONMENT_D: "1"
        # `bazel:test:accept`, not `task test:parallel`. The acceptance `sh_test`
        # targets (one per module) have existed since WP-36 and nothing ran them: this job and
        # `task verify` both called pytest directly, so stage 4 was neither
        # cached nor reported through Bazel. It is now reported through Bazel.
        # It saves nothing here: acceptance verdicts cache on local disk only
        # (adr_bazel_build_adoption.md § Stage 4, amended) and this job holds no
        # write credential, so a fresh runner starts with an empty disk cache
        # and executes all 172 targets on every run. The verdict cache pays off
        # in the local loop; this lane reads only compile actions from the
        # remote cache. The targets run concurrently behind the runner's host
        # locks (`test/bazel.bzl` § Concurrency) — `ACCEPT_JOBS` at the task's
        # default, `min(8, nproc)` — the runner's core count here.
        #
        # The suite floor and the skip/xfail ceilings did not leave with
        # `test:parallel`: the task reads them off the per-module per-case JUnit
        # reports Bazel writes, which is the same data at a finer grain than the
        # terminal-summary parser they replace. Those reports are what the two
        # steps below upload and push — `test/results/junit.xml` is written by
        # the pytest entry points only, so it is not what this lane produces.
        run: task bazel:test:accept
      - name: Stop Registry
        if: ${{ always() }}
        shell: bash
        # `--profile sigstore` is load-bearing: a bare `down` leaves
        # profile-gated services running. Harmless on an ephemeral runner, but
        # this line gets copied to developer machines.
        run: docker compose -f test/docker-compose.yml --profile sigstore down 2>/dev/null || true
      # C-015's caller half; the twin of the `build` job's. `always()` rather
      # than `success()`: a cancelled or failed job must leave no credential on
      # the runner either, and a composite action has no `post:` hook.
      - name: Remove the Bazel cache credential
        if: always()
        uses: ./.github/actions/bazel-cache-rc
        with:
          cleanup: 'true'
      # One report per module, copied out of `bazel-testlogs` by the task —
      # real per-case pytest JUnit, because the acceptance runner passes
      # `--junit-xml=$XML_OUTPUT_FILE` (the Rust lane's `test.xml` is Bazel's
      # synthesised one target/one testcase file, which is why that leg uploads
      # nothing). The paths land as `deep-acceptance-Linux/<module>/junit.xml`,
      # which is what the `test-results` job's `artifacts/**/junit.xml` glob is
      # written for.
      - name: Upload Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deep-acceptance-${{ matrix.job.name }}
          path: target/bazel/accept/*/junit.xml
      # The acceptance suite is the long half of the run; these are the
      # timings the dashboards exist for. Same tolerance as the unit push.
      #
      # `timeout-minutes: 15` and not the unit lane's 5: the action pushes one
      # trace per matched report and this lane produces one per module rather than
      # one. The binary is downloaded once; what repeats is a re-emit and an
      # export per module.
      - name: Push acceptance test timings
        if: ${{ !cancelled() && env.OTEL_OTLP_AUTH != '' }}
        continue-on-error: true
        timeout-minutes: 15
        uses: ./.github/actions/test-telemetry
        with:
          junit: target/bazel/accept/*/junit.xml
          suite: acceptance

  test-results:
    name: Publish Deep Test Results
    needs: [build, cross-compile, acceptance-tests]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && (github.event_name != 'schedule' || inputs.full) }}
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: deep-*
          path: artifacts
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0
        with:
          files: "artifacts/**/junit.xml"
          check_name: "Deep Test Results"

  satellite-verify:
    name: Satellite Verify (ocx-mirror)
    # The schedule clause matches `build`: the weekly cron is the drift check
    # only, and a mirror build is real money for a signal the push to `main`
    # already produces.
    if: github.event_name != 'schedule' || inputs.full
    # NON-BLOCKING until ocx-sh/ocx-mirror re-points at the split crates
    # (plan_crate_split_workspace.md DEC-4). The flip is deleting the
    # `continue-on-error` line below and nothing else; the ocx-mirror
    # follow-up PR that WP-39 specifies carries it. While the line is set
    # this job must NEVER be made a required check: the job's own check run
    # still concludes `failure` (only the workflow run and `needs.*.result`
    # read `success`), so a required check on it would block every merge
    # until the mirror re-points — and if GitHub ever read the job as green,
    # it would gate nothing. Either way, required + continue-on-error is a
    # gate that cannot do its job. Job-level rather than step-level so the
    # job shows red in the run view when the task fails.
    continue-on-error: true
    runs-on: ubuntu-latest
    # Reads two public repositories; nothing here writes.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ocx
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ocx
          submodules: true
      # `actions/checkout` refuses a `path:` outside the workspace, so the
      # satellite is a sibling under it rather than the task's `../ocx-mirror`
      # default, and `OCX_MIRROR_DIR` names it. Its submodule is not fetched:
      # `task satellite:verify` overlays this checkout over the mirror's
      # `external/ocx` (rsync --delete), so the pinned pointer's tree would
      # only be cloned to be deleted.
      - name: Checkout ocx-mirror
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ocx-sh/ocx-mirror
          path: ocx-mirror
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          # The toolchain file and the cached workspace live under `ocx/`, not
          # at the workspace root.
          rust-src-dir: ocx
          matcher: true
          # Same reason as verify-basic.yml: denial lives in
          # [workspace.lints.rust] so the path-vendored forks stay capped.
          rustflags: ""
          # The mirror builds into the persistent target dir the task keeps
          # under `.tmp/satellite-verify/`; cache it (on failure too — the job
          # is expected red until the mirror re-points, and a cache that only
          # saves on green would never warm).
          cache-workspaces: "ocx -> .tmp/satellite-verify/cargo-target"
          cache-on-failure: true
      - name: Setup Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      - name: Build ocx-mirror against this tree and check the satellite linking rule
        env:
          OCX_MIRROR_DIR: ${{ github.workspace }}/ocx-mirror
        run: task satellite:verify --force
