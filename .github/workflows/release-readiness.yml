name: Release Readiness

# One pre-release GO/NO-GO gate. Dispatch this on the ref you intend to release
# (e.g. `gh workflow run release-readiness.yml --ref main` before tagging vX.Y.Z).
# It runs the full cross-platform deep coverage as a reusable workflow and rolls
# its result into a single verdict:
#
#   - Verify Deep — the conventions template's deep tier (`task ci:deep`) and the
#                   repo-owned deep jobs behind it: cross-builds, unit and smoke on
#                   macOS and Windows, the two satellite jobs, index conformance
#                   drift and the shell activation matrix.
#
# Linux per-PR gates (verify-basic.yml, shell-activation.yml) already cover the
# Linux surface on every change; this gate adds the expensive macOS/Windows
# coverage on demand so a green run means "safe to cut the release". It is NOT
# wired into the cargo-dist release.yml — run it yourself before tagging.
#
# Nesting: this workflow -> verify-deep.yml -> deep-repo.yml -> cross.yml or
# shell-activation-deep.yml is four levels. GitHub allows ten on github.com (the
# top-level caller plus nine reusable workflows; four on GitHub Enterprise Server):
# docs.github.com "Reusing workflow configurations", section "Nesting reusable
# workflows". deep-repo.yml must not call anything that calls a further workflow.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deep:
    name: Verify Deep
    # A called workflow's jobs may not ask for more than the job that calls it grants, and the check is
    # static: it counts the jobs an `if:` would skip. This is the union over everything verify-deep.yml
    # reaches — `contents: read` for the template's `deep`, `repo` and the repo-owned jobs, and
    # `issues: write` for its `nightly-red` job, which only runs on a schedule.
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/verify-deep.yml
    # No secrets: verify-deep.yml declares none under `workflow_call`, so none can be passed, and the run
    # is uncached until the readiness gate stops calling the template workflow.

  gate:
    name: Verdict
    needs: [deep]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report GO/NO-GO
        env:
          DEEP_RESULT: ${{ needs.deep.result }}
        run: |
          {
            echo "## Release Readiness"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Verify Deep (cross-builds, macOS + Windows unit and smoke, satellites, shell activation) | \`${DEEP_RESULT}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${DEEP_RESULT}" = "success" ]; then
            echo "**Verdict: GO - safe to release.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Verdict: NO-GO - do not release.**" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Release readiness NO-GO (verify-deep=${DEEP_RESULT})"
            exit 1
          fi
