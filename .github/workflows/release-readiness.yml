name: Release Readiness

# The GO/NO-GO gate for a release: the full acceptance suite, on the bytes `release.yml` would publish.
# Dispatch it on the exact commit about to be released (the `release/vX` branch holding the
# `release: vX` commit):
#
#   gh workflow run release-readiness.yml --ref release/vX
#
# `release.yml` then refuses a release or a candidate unless this workflow succeeded for that SHA
# (`readiness-gate.yml`, scripts/release_readiness_gate.py).
#
#   plan (the Cargo.toml version) -> cross (cross.yml, stamped: the 8 binaries release.yml builds)
#        -> assets (the release archives) -> scan (scan-binaries.yml, as release.yml)
#        -> stage (extract `ocx`, add ocx-shim and ocx_schema, natively) -> acceptance (acceptance.yml
#           per platform, 4 shards and a merge against test/limits/<os>-release) -> verdict
#   shell-activation-deep (macOS and Windows activation) runs beside the acceptance legs.
#
# Nothing here publishes: no release, no tag, no registry push. Artifacts live one day in this run.
# Linux x64 is tested on the glibc archive, the one a glibc host installs. The Windows archives are the
# `pc-windows-gnullvm` cross-builds, so the Windows legs run the bytes that ship.
#
# Inputs: `bypass` skips every test job and the verdict goes green; it needs a `reason`, which lands in
# the run-name (so the gate script and `gh run list` name it) and in the step summary. Use it for an
# outage of this workflow, never for a red result.
#
# Nesting: cross.yml, acceptance.yml, scan-binaries.yml and shell-activation-deep.yml are called one
# level down; none of them calls a further workflow.

run-name: "readiness ${{ github.sha }}${{ inputs.bypass && format(' BYPASS: {0}', inputs.reason) || '' }}"

on:
  workflow_dispatch:
    inputs:
      bypass:
        description: Skip every test job and report GO. Requires a reason; the run-name carries it.
        type: boolean
        default: false
      reason:
        description: Why the readiness gate is bypassed. Required with bypass.
        type: string
        default: ''

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    name: Release version
    if: ${{ !inputs.bypass }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the Cargo.toml version
        id: version
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The eight stamped binaries `release.yml` builds, from the same task. No cache secret: the build that
  # produces release bytes holds no credential.
  cross:
    name: Cross-build (stamped)
    if: ${{ !inputs.bypass }}
    needs: plan
    permissions:
      contents: read
    uses: ./.github/workflows/cross.yml
    with:
      stamp: true
      channel: release
      version: ${{ needs.plan.outputs.version }}

  assets:
    name: Release archives
    if: ${{ !inputs.bypass }}
    needs: [plan, cross]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup OCX
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: '0.6.2'
          cache: false
      - name: Assemble the release assets
        uses: ./.github/actions/release-assets
        with:
          version: ${{ needs.plan.outputs.version }}

  scan:
    name: Scan for test provenance
    needs: assets
    permissions:
      contents: read
    uses: ./.github/workflows/scan-binaries.yml

  # The archive holds `ocx` alone; the suite also drives `ocx-shim` and `ocx_schema`, so each is built
  # natively beside it and the three are laid out as `test/bin` (`ocx`, `ocx-shim`, `schema/ocx_schema`).
  stage:
    name: Stage test/bin (${{ matrix.target }})
    if: ${{ !inputs.bypass }}
    needs: assets
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: x86_64-pc-windows-gnullvm, os: windows-latest }
          - { target: aarch64-pc-windows-gnullvm, os: windows-11-arm }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Download the release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: archive
      - name: Extract (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: mkdir extract && tar -xzf "archive/ocx-$TARGET.tar.gz" -C extract
      - name: Extract (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -Path "archive/ocx-$env:TARGET.zip" -DestinationPath extract
      - name: Build ocx-shim and ocx_schema
        shell: bash
        run: cargo build --release --locked -p ocx_shim -p ocx_schema
      - name: Lay out test/bin
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          [[ "$RUNNER_OS" == "Windows" ]] && ext=".exe"
          ocx="$(find extract -type f -name "ocx$ext" | head -1)"
          [[ -n "$ocx" ]] || { echo "::error::no ocx$ext in the release archive"; exit 1; }
          mkdir -p stage/schema
          cp "$ocx" "stage/ocx$ext"
          cp "target/release/ocx-shim$ext" "stage/ocx-shim$ext"
          cp "target/release/ocx_schema$ext" "stage/schema/ocx_schema$ext"
          ls -lR stage
      - name: Upload test/bin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readiness-bin-${{ matrix.target }}
          path: stage/
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  acceptance:
    name: Acceptance (${{ matrix.name }})
    if: ${{ !inputs.bypass }}
    needs: [stage, scan]
    permissions:
      contents: read
    # `toolchain-group: test` on the legs whose `ocx.lock` lacks a leaf for a default tool: the suite takes only
    # `zot` from the project, and loading the whole project there exits 78 (test_workflows.py derives the set).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, target: x86_64-unknown-linux-gnu, os: ubuntu-latest, limits: test/limits/linux-release, no-docker: false, toolchain-group: '' }
          - { name: Linux arm64, target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, limits: test/limits/linux-release, no-docker: false, toolchain-group: '' }
          - { name: macOS arm64, target: aarch64-apple-darwin, os: macos-latest, limits: test/limits/macos-release, no-docker: true, toolchain-group: '' }
          - { name: macOS x64, target: x86_64-apple-darwin, os: macos-15-intel, limits: test/limits/macos-release, no-docker: true, toolchain-group: 'test' }
          - { name: Windows x64, target: x86_64-pc-windows-gnullvm, os: windows-latest, limits: test/limits/windows-release, no-docker: true, toolchain-group: '' }
          - { name: Windows arm64, target: aarch64-pc-windows-gnullvm, os: windows-11-arm, limits: test/limits/windows-release, no-docker: true, toolchain-group: 'test' }
    uses: ./.github/workflows/acceptance.yml
    with:
      os: ${{ matrix.os }}
      binary: artifact:readiness-bin-${{ matrix.target }}
      shard-count: 4
      limits-dir: ${{ matrix.limits }}
      release-binary: true
      no-docker: ${{ matrix.no-docker }}
      toolchain-group: ${{ matrix.toolchain-group }}
    secrets:
      # Owed by the secret sweep; only the callee's `binary` job reads it, and `artifact:` skips that job.
      BAZEL_CACHE_WRITE_AUTH: ${{ secrets.BAZEL_CACHE_WRITE_AUTH }}

  shell-activation-deep:
    name: Shell activation (macOS, Windows)
    if: ${{ !inputs.bypass }}
    needs: scan
    permissions:
      contents: read
    uses: ./.github/workflows/shell-activation-deep.yml

  verdict:
    name: Verdict
    needs: [plan, cross, assets, scan, stage, acceptance, shell-activation-deep]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report GO/NO-GO
        env:
          BYPASS: ${{ inputs.bypass }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          PLAN: ${{ needs.plan.result }}
          CROSS: ${{ needs.cross.result }}
          ASSETS: ${{ needs.assets.result }}
          SCAN: ${{ needs.scan.result }}
          STAGE: ${{ needs.stage.result }}
          ACCEPTANCE: ${{ needs.acceptance.result }}
          SHELL_ACTIVATION: ${{ needs.shell-activation-deep.result }}
        run: |
          set -uo pipefail
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [[ "$BYPASS" == "true" ]]; then
            if [[ -z "${REASON//[[:space:]]/}" ]]; then
              echo "::error::bypass needs a reason"
              echo "**Verdict: NO-GO - bypass was set without a reason.**" >> "$summary"
              exit 1
            fi
            {
              echo "## Release Readiness"
              echo ""
              echo "**Verdict: GO by BYPASS - no test ran.** Commit \`${SHA}\`, dispatched by ${ACTOR}."
              echo ""
              echo "Reason: ${REASON}"
            } >> "$summary"
            exit 0
          fi
          failed=()
          {
            echo "## Release Readiness"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
          } >> "$summary"
          row() {
            echo "| $1 | \`$2\` |" >> "$summary"
            [[ "$2" == "success" ]] || failed+=("$1=$2")
          }
          row "release version" "$PLAN"
          row "stamped cross-build, 8 targets" "$CROSS"
          row "release archives" "$ASSETS"
          row "provenance scan" "$SCAN"
          row "stage test/bin, 6 platforms" "$STAGE"
          row "acceptance on the release bytes, 6 platforms" "$ACCEPTANCE"
          row "shell activation (macOS, Windows)" "$SHELL_ACTIVATION"
          echo "" >> "$summary"
          if (( ${#failed[@]} == 0 )); then
            echo "**Verdict: GO - safe to tag \`${SHA}\`.**" >> "$summary"
          else
            echo "**Verdict: NO-GO - do not release.**" >> "$summary"
            echo "::error::Release readiness NO-GO (${failed[*]})"
            exit 1
          fi
