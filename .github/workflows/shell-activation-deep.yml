name: Shell Activation (Deep)

# Cross-platform `ocx self setup` + `ocx self activate` coverage for the platforms
# the per-PR `shell-activation.yml` (Linux shell-zoo) cannot reach: macOS and
# Windows. Runs on demand and weekly, NOT per-PR, because macOS/Windows runner
# minutes are far more expensive than Linux (see subsystem-ci.md "Cost Factors").
#
# - macOS: reuses the self-contained `test/tests/test_shell_activation.py` matrix
#   AND the per-prompt reconciler matrix `test/tests/test_shell_reconcile.py`
#   (POSIX-family + the ocx-packaged shells nushell/elvish/pwsh installed via ocx),
#   plus the per-platform NFR latency gate (C-044).
# - Windows: runs the `test/manual/test-windows-activation.ps1` gate under
#   the built-in Windows PowerShell 5.1, the built-in PowerShell 7, AND the
#   ocx-installed PowerShell 7 ("Core") — the user-facing dogfood path. That gate
#   now also drives one non-interactive apply/revert reconcile cycle (S-045).
#
# cmd/batch PATH idempotency is covered separately by the `live_batch_*` unit test
# on the windows-latest `nextest --workspace` leg of `verify-deep.yml`.
#
# STATED RESIDUAL — the Windows leg proves activation-time and reconcile-time
# behaviour, NOT prompt *firing*. A real interactive ConPTY session under Windows
# PowerShell 5.1 needs a bespoke harness (oh-my-posh's `go-pty` pattern is the only
# working precedent found, and it skips 5.1). S-045's interactive half is therefore
# uncovered, and is named here rather than implied to be covered.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:00 UTC — catches platform drift without per-PR cost.
    - cron: "0 6 * * 1"
  # Reusable: composed into the pre-release `release-readiness.yml` gate so a
  # single dispatch reports one GO/NO-GO across all platforms.
  workflow_call:

permissions:
  contents: read

# Literal group name (not the subsystem-ci.md §6 `${{ github.workflow }}-...`
# convention): this workflow is ALSO reused via `workflow_call` from
# `release-readiness.yml`, where `github.workflow` resolves to the CALLER's name
# ("Release Readiness"). With the convention, the composed child would compute the
# SAME group as the parent's own concurrency, and since `cancel-in-progress` is
# false on main the parent would hold the group while waiting on the child —
# a self-deadlock that GitHub resolves by failing the called workflow. A literal
# prefix keeps standalone dispatch/cron de-duplication without colliding with any
# caller.
concurrency:
  group: shell-activation-deep-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  macos:
    name: Activation (macOS arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          persist-credentials: false
      - name: Build ocx (aarch64-apple-darwin)
        uses: ./.github/actions/build-rust
        with:
          target: aarch64-apple-darwin
      # Same split as `shell-activation.yml`: the activation matrix runs the
      # release-clean binary because its claim is about what ships, while C-044's
      # fault injection lives in `shell::hook::registration` behind
      # `ocx/__testing` and is absent from a release-clean build — a gate pointed
      # at that one has an `--expect-fail` step that cannot go red. Same target,
      # so this recompiles `ocx_lib` and `ocx` only.
      - name: Build ocx (aarch64-apple-darwin, __testing)
        uses: ./.github/actions/build-rust
        with:
          target: aarch64-apple-darwin
          features: ocx/__testing
          artifact_suffix: "-testing"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install ocx-packaged shells and run the activation matrix
        shell: bash
        run: |
          set -euo pipefail
          ocx="$PWD/ocx-aarch64-apple-darwin"
          chmod +x "$ocx"

          # Put the ocx-packaged shells (nushell/elvish/pwsh) on PATH so the
          # matrix's shutil.which discovers them. `package env` auto-installs.
          # fish is Linux-only on ocx.sh, so it is simply skipped by the matrix.
          export OCX_HOME="$RUNNER_TEMP/ocx-shells"
          eval "$("$ocx" --remote package env nushell elvish pwsh --shell=bash)"
          echo "resolved shells:"
          for s in nu elvish pwsh; do command -v "$s" || echo "  ($s absent)"; done

          # Run the self-contained matrices in isolation from test/conftest.py
          # (its session fixtures start a Docker registry, unavailable on macOS).
          # `shell_matrix.py` is copied flat because test_shell_reconcile.py
          # imports it as a top-level module — the same shape the shell-zoo
          # container mounts, so the two legs cannot drift on import path.
          work="$RUNNER_TEMP/matrix"
          mkdir -p "$work"
          cp test/tests/test_shell_activation.py "$work/"
          cp test/tests/test_shell_reconcile.py "$work/"
          cp test/src/shell_matrix.py "$work/"
          cd "$work"
          OCX_ACTIVATION_BINARY="$ocx" \
            uv run --no-project --with pytest -- \
            python -m pytest test_shell_activation.py test_shell_reconcile.py \
            -v -p no:cacheprovider

      - name: Setup Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
      # C-044 is a PER-PLATFORM assert with the floor measured in the same job.
      # A Linux number imported onto macOS would be exactly the "another tool's
      # benchmark as a budget" mistake the ADR calls out, so macOS measures its
      # own floor here. The fault-injected red runs inside the same task, which
      # is why this points at the `-testing` binary and not the shipped one.
      - name: NFR latency gate (C-044)
        shell: bash
        run: |
          set -euo pipefail
          task test:shell-latency \
            SKIP_BUILD=true \
            LATENCY_OCX_BINARY="$PWD/ocx-aarch64-apple-darwin-testing"
      - name: Upload latency measurement
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shell-latency-macos
          path: test/bench/results/shell-latency*.json
          retention-days: 7

  windows:
    name: Activation (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          persist-credentials: false
      - name: Build ocx (x86_64-pc-windows-msvc)
        uses: ./.github/actions/build-rust
        with:
          target: x86_64-pc-windows-msvc
      - name: env.ps1 gate — Windows PowerShell 5.1 (built-in)
        shell: powershell
        run: .\test\manual\test-windows-activation.ps1 -OcxBin .\ocx-x86_64-pc-windows-msvc.exe
      - name: env.ps1 gate — PowerShell 7 (built-in)
        shell: pwsh
        run: .\test\manual\test-windows-activation.ps1 -OcxBin .\ocx-x86_64-pc-windows-msvc.exe
      - name: env.ps1 gate — PowerShell 7 (ocx-installed Core)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ocx = ".\ocx-x86_64-pc-windows-msvc.exe"
          $env:OCX_HOME = "$env:RUNNER_TEMP\ocx-shells"
          # Put the ocx-packaged pwsh first on PATH (move-to-front), then run the
          # same gate under it — proves the dogfood "install pwsh via ocx" path.
          & $ocx --remote package env pwsh --shell=powershell | Out-String | Invoke-Expression
          $pwshCmd = (Get-Command pwsh).Source
          Write-Host "ocx-resolved pwsh: $pwshCmd"
          & $pwshCmd -NoProfile -File .\test\manual\test-windows-activation.ps1 -OcxBin $ocx
