name: Deploy Docs

# Publishes /docs/ and /schemas/ of https://ocx.sh to Bunny storage. Only push to main and a manual
# dispatch: no pull_request or tag trigger; the `ocx.sh` environment's branch policy gates the secret.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Whole runs serialize in push order: a later push never deploys before an earlier one.
concurrency:
  group: ocx-sh-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # Scope warning denial to [workspace.lints.rust]: the default RUSTFLAGS
          # would deny lints of the path-vendored forks.
          rustflags: ""
      - name: Setup OCX
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: '0.6.2'
          # Toolchain from ocx.toml + ocx.lock, as in verify-basic.yml; the
          # object store stays uncached, as there.
          cache: false
      # The build reaches schema generation, a Bazel build: it shares the cache
      # like the verify lanes do.
      - name: Bazel cache credential
        uses: ./.github/actions/bazel-cache-rc
        with:
          write-auth: ${{ secrets.BAZEL_CACHE_WRITE_AUTH }}
      - name: Build the site
        run: task website:build
      # Links, old URLs and the built-site tests, before anything uploads.
      - name: Check the built site
        run: task website:check
      - name: Docs plugin tests
        run: task website:test
      # Registry-backed drift gate for all `# doc:` scripts; deploy-only (kept out
      # of the per-commit `task verify`). SKIP_BUILD=false: CI defaults it to true
      # and this job has no prebuilt test/bin/ocx.
      - name: Run doc-script drift gate
        run: task test:doc-scripts:drift
        env:
          SKIP_BUILD: "false"
      - name: Remove the Bazel cache credential
        if: always()
        uses: ./.github/actions/bazel-cache-rc
        with:
          cleanup: 'true'
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: website/dist
          overwrite: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ocx.sh
      url: https://ocx.sh/docs/
    permissions: {}
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - name: Deploy docs
        uses: ocx-sh/website/.github/actions/deploy@e86b83014538975c186912e5038567c69b2f2f2c # v0.3.0
        with:
          dist: dist/docs
          path: /docs/
          storage-key: ${{ secrets.BUNNY_STORAGE_KEY }}
      - name: Deploy schemas
        uses: ocx-sh/website/.github/actions/deploy@e86b83014538975c186912e5038567c69b2f2f2c # v0.3.0
        with:
          dist: dist/schemas
          path: /schemas/
          storage-key: ${{ secrets.BUNNY_STORAGE_KEY }}
