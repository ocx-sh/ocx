name: Publish to Registry

# cargo-dist post-announce job. Delegates the platform-loop + push logic to
# `oci-publish.yml`; this workflow only contributes the prod-specific inputs
# (registry, version derivation from tag, cargo-dist archive layout).

on:
  workflow_call:
    inputs:
      plan:
        # Forwarded by cargo-dist; not consumed here, but the contract requires it.
        required: true
        type: string

permissions:
  contents: read
  # Forwarded to oci-publish.yml for the GHCR push. Each link in the chain caps
  # the next, so dropping this here would strip the scope release.yml grants
  # (via `github-custom-job-permissions`) before the push job ever sees it.
  packages: write

jobs:
  compute-tag:
    # Skip registry publish for pre-release tags (e.g. v0.6.0-canary.1).
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.tag.outputs.version_tag }}
    steps:
      - id: tag
        shell: bash
        run: |
          set -euo pipefail
          # Freeze the UTC build-metadata segment here so every (variant, target)
          # leg of the publish loop shares the same tag. Computing it inside the
          # per-push `ocx package push --build-timestamp` would re-stamp each call
          # at second granularity and split the multi-platform index.
          ts="$(date -u +%Y%m%d%H%M%S)"
          echo "version_tag=${GITHUB_REF_NAME#v}_${ts}" >> "$GITHUB_OUTPUT"

  publish:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: [compute-tag]
    uses: ./.github/workflows/oci-publish.yml
    with:
      # Logical name stays `ocx.sh/ocx/cli` — that is what the index entry is
      # keyed by and what users install. Only the physical home moved to GHCR,
      # so `repo` (logical) and `physical_namespace` (push target) differ here.
      registry: ghcr.io
      repo: ocx
      physical_namespace: ocx-sh
      announce: true
      version_tag: ${{ needs.compute-tag.outputs.version_tag }}
      # Prod registry carries the default ocx variant only. ocx-mirror
      # releases publish ocx.sh/ocx/mirror from its own repo:
      # github.com/ocx-sh/ocx-mirror.
      variants: '[""]'
      targets: '["x86_64-unknown-linux-musl","aarch64-unknown-linux-musl","x86_64-apple-darwin","aarch64-apple-darwin","x86_64-pc-windows-msvc","aarch64-pc-windows-msvc"]'
      environment: ocx.sh
      artifact_source: cargo-dist
    secrets:
      # GHCR takes the workflow's own token; no registry credential to provision.
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OCX_ANNOUNCE_TOKEN: ${{ secrets.OCX_ANNOUNCE_TOKEN }}
