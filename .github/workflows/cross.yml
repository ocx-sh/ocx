name: Cross

# One parallel leg per target triple, called by the deep tier (`deep-repo.yml`, every triple) and by the
# basic tier (`basic-repo.yml`, the two triples with a native smoke leg). Serially in one job the eight
# `-c opt` builds took 2h+ cold; every leg shares the Bazel cache (#638). A leg uploads only its own `ocx`,
# plus the unit bundle and acceptance binaries where its triple has a native leg. `needs:` names a whole
# matrix, so a consumer waits for the slowest leg, not only its own.
#
# Reusable only: the artifacts it uploads belong to the caller's run, which is how the callers' native
# legs find them.

on:
  workflow_call:
    inputs:
      targets:
        description: >-
          Whitespace-separated triples to build, each one of `task cross:targets`. Empty builds all of them.
        type: string
        default: ''
    secrets:
      BAZEL_CACHE_WRITE_AUTH:
        required: false

permissions: {}

jobs:
  # The matrix comes from `task cross:matrix`, so it is `task cross:targets` by construction (or the
  # caller's subset of it), and each leg's `bundle` / `test-bin` flags live next to that list.
  plan:
    name: Plan the cross-builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Print the matrix
        id: matrix
        env:
          ONLY: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          matrix="$(task cross:matrix ONLY="$ONLY")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  cross:
    name: Cross-build (${{ matrix.target }})
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Setup Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      - name: Setup OCX
        uses: ocx-sh/setup-ocx@25fa771f8572572dc64528db89560de68a163a0e # v1.4.0
        with:
          version: '0.6.2'
          cache: false
      # Reads and writes the shared cache; with no secret (a fork PR, or a caller that passed none) the
      # action writes no rc and Bazel runs uncached.
      - name: Bazel cache credential
        uses: ./.github/actions/bazel-cache-rc
        with:
          write-auth: ${{ secrets.BAZEL_CACHE_WRITE_AUTH }}
      # NO release-provenance `--scan` here. The old cross-compile job ran it
      # over a real `--release` cargo build; this job has no such build, and
      # the Bazel-built `ocx` deliberately carries the `__testing` placeholder
      # provenance (`crates/ocx_cli/BUILD.bazel` `_TESTING_PROVENANCE`), so a
      # scan of these bytes would red by design. A second, release-profile
      # compile just to scan it is the cost this restructure removes. The scan
      # still runs over the real release bytes in `scan-binaries.yml`
      # (called by `release.yml` and `deploy-dev.yml`) before anything ships.
      # A leg with a bundle builds the binary, the unit tests and the acceptance binaries in one Bazel
      # invocation (`cross:build:bundle`): the binary's crate chain and the tests' overlap there, where
      # separate steps ran them one after the other. The files land where the separate tasks put them.
      - name: Cross-build ocx, unit tests and acceptance binaries
        if: matrix.bundle
        env:
          TARGET: ${{ matrix.target }}
        run: task cross:build:bundle TARGET="$TARGET"
      - name: Cross-build ocx
        if: ${{ !matrix.bundle }}
        env:
          TARGET: ${{ matrix.target }}
        run: task cross:build TARGET="$TARGET"
      - name: Stage acceptance binaries
        if: ${{ matrix.test-bin && !matrix.bundle }}
        env:
          TARGET: ${{ matrix.target }}
        run: task cross:test:bin TARGET="$TARGET"
      - name: Remove the Bazel cache credential
        if: always()
        uses: ./.github/actions/bazel-cache-rc
        with:
          cleanup: 'true'
      # `ocx*` is `ocx` or `ocx.exe`; `test-bin/` and the bundle do not match.
      - name: Upload ocx
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ocx-${{ matrix.target }}
          path: target/cross/${{ matrix.target }}/ocx*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
      - name: Upload unit-test bundle
        if: matrix.bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-tests-${{ matrix.target }}
          path: target/cross/${{ matrix.target }}/unit-tests.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
      - name: Upload acceptance binaries
        if: matrix.test-bin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-bin-${{ matrix.target }}
          path: target/cross/${{ matrix.target }}/test-bin/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true
