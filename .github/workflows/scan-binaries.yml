name: Scan Binaries

# Refuse to publish an `ocx` binary built with test provenance (ADR
# adr_test_speed_tiers.md C-PROV). Test builds (`--features ocx/__testing`)
# bake fixed placeholder provenance into the binary; this job downloads the
# archives a run is about to publish and runs
# `scripts/release_provenance_check.py` over them:
#
#   --scan --min-files <n>  every binary, every target — a byte scan for the
#                           three placeholder markers, floored on the number
#                           of binaries read, so a download that fetched
#                           nothing cannot pass;
#   --link --min-files <n>  the Linux binaries of the archives — no `GLIBC_`
#                           version above the script's `GLIBC_FLOOR`, no `NEEDED`
#                           library off its allow-list, floored on the Linux
#                           binaries read;
#   --exec                  the one binary native to this runner — its
#                           `version` report must carry release provenance.
#
# Callers:
#   release.yml            the `scan` job, over the `release-dist` archives its `build`
#                          job assembled from the stamped cross-builds; `publish`
#                          needs it and reads its result, so a marker in any
#                          binary pushes nothing.
#   release-readiness.yml  the same archives, before the acceptance legs run on them.
#
# No job-level `if:` and no `continue-on-error`, on purpose: the callers read this
# job's result, and a scan that could skip itself would be a bypass. An empty
# download fails through the floor instead.

on:
  workflow_call:
    inputs:
      artifact-pattern:
        description: Pattern of the run's artifacts that carry the release archives.
        required: false
        type: string
        default: release-dist
      min-files:
        description: Reader floor — the number of binaries the scan must read (one per published target).
        required: false
        type: number
        default: 8
      link-min-files:
        description: Reader floor of the link check — the number of Linux binaries it must read (one per Linux target).
        required: false
        type: number
        default: 4

permissions:
  contents: read

jobs:
  scan:
    name: Scan for test provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the binaries to publish
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-pattern }}
          path: ${{ runner.temp }}/scan-download
          merge-multiple: true

      - name: Scan every binary, link-check the Linux ones, exec the native one
        shell: bash
        env:
          DOWNLOAD: ${{ runner.temp }}/scan-download
          STAGE: ${{ runner.temp }}/scan-stage
          MIN_FILES: ${{ inputs.min-files }}
          LINK_MIN_FILES: ${{ inputs.link-min-files }}
          NATIVE_TARGET: x86_64-unknown-linux-musl
        run: |
          set -euo pipefail
          mkdir -p "$DOWNLOAD" "$STAGE"
          shopt -s nullglob
          for archive in "$DOWNLOAD"/ocx-*.tar.gz "$DOWNLOAD"/ocx-*.zip; do
            name="$(basename "$archive")"
            name="${name%.tar.gz}"
            name="${name%.zip}"
            mkdir -p "$STAGE/$name"
            case "$archive" in
              *.zip) unzip -q "$archive" -d "$STAGE/$name" ;;
              *) tar -xzf "$archive" -C "$STAGE/$name" ;;
            esac
          done
          shopt -u nullglob
          mapfile -t binaries < <(find "$STAGE" -type f \( -name ocx -o -name ocx.exe \) | sort)
          mapfile -t linux_binaries < <(find "$STAGE" -type f -name ocx -path '*-unknown-linux-*' | sort)
          native="$(find "$STAGE/ocx-$NATIVE_TARGET" -type f -name ocx 2>/dev/null | head -1 || true)"
          echo "binaries to scan (${#binaries[@]}):"
          printf '  %s\n' "${binaries[@]}"
          if (( ${#binaries[@]} == 0 )); then
            echo "::error::no binary downloaded — the scan has nothing to read"
            exit 1
          fi
          python3 scripts/release_provenance_check.py --scan "${binaries[@]}" --min-files "$MIN_FILES"
          python3 scripts/release_provenance_check.py --link "${linux_binaries[@]}" --min-files "$LINK_MIN_FILES"
          if [[ -z "$native" ]]; then
            echo "::error::no $NATIVE_TARGET binary among the downloads; --exec has nothing native to run"
            exit 1
          fi
          chmod +x "$native"
          python3 scripts/release_provenance_check.py --exec "$native"
