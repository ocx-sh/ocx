name: Build Rust Binary
description: Build an ocx binary for a given target (native builds or zig cross-compile)

inputs:
  target:
    description: Rust target triple
    required: true
  use_zigbuild:
    description: Use cargo-zigbuild instead of cargo build (required for cross-compiling aarch64-linux and musl from x86 runners)
    required: false
    default: "false"
  features:
    description: Space/comma-separated cargo features (e.g. `ocx/__testing` for acceptance binaries). Empty = release-clean.
    required: false
    default: ""
  artifact_suffix:
    description: >-
      Suffix appended to both the emitted filename and the uploaded artifact name.
      Needed only when one workflow builds the SAME target twice (a release-clean
      binary plus an `ocx/__testing` one) — artifact names are unique per run, and
      two same-named uploads collide. Empty = the historical `ocx-<target>` name.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
        targets: ${{ inputs.target }}
    - name: Install target on rust-toolchain.toml channel
      # rust-toolchain.toml pins an explicit channel; dtolnay's `targets:` only
      # adds the target to the `stable` alias toolchain. Re-add against the
      # pinned channel resolved from the workspace root so cargo finds std/core.
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: rustup target add "$TARGET"
    - name: Rust Cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
    # Compile cache in front of the shared Garage store; the calling job sets
    # SCCACHE_ENABLED, RUSTC_WRAPPER and the SCCACHE_* / AWS_* env from the org
    # secrets (see verify-deep.yml `build`). Absent that env — a fork PR, or a
    # workflow that never opted in — this step is skipped and cargo runs
    # rustc directly. Complements rust-cache, which keeps target/ (link
    # outputs sccache never caches); sccache adds hits across jobs, OSes and
    # developer machines for every dependency crate.
    - name: sccache
      if: ${{ env.SCCACHE_ENABLED == 'true' }}
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
    - name: Install Zig
      if: ${{ inputs.use_zigbuild == 'true' }}
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
    - name: Install cargo-zigbuild
      if: ${{ inputs.use_zigbuild == 'true' }}
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      with:
        tool: cargo-zigbuild
    - name: Build (cargo)
      if: ${{ inputs.use_zigbuild != 'true' }}
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        FEATURES: ${{ inputs.features }}
      run: cargo build --release --target="$TARGET" --locked ${FEATURES:+--features "$FEATURES"}
    - name: Build (zigbuild)
      if: ${{ inputs.use_zigbuild == 'true' }}
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        FEATURES: ${{ inputs.features }}
      run: cargo zigbuild --release --target="$TARGET" --locked ${FEATURES:+--features "$FEATURES"}
    - name: Prepare Binaries
      # The suffix lands in the FILENAME too, not just the artifact name: a job
      # that builds one target twice would otherwise have both binaries land on
      # the same path, and which one a later step ran would be decided by step
      # order rather than by what the step asked for.
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        SUFFIX: ${{ inputs.artifact_suffix }}
      run: |
        ext=""
        [[ "$TARGET" == *windows* ]] && ext=".exe"
        cp "target/${TARGET}/release/ocx${ext}" "ocx-${TARGET}${SUFFIX}${ext}"
    - name: Upload ocx Binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ocx-${{ inputs.target }}${{ inputs.artifact_suffix }}
        path: ocx-${{ inputs.target }}${{ inputs.artifact_suffix }}${{ contains(inputs.target, 'windows') && '.exe' || '' }}
        compression-level: 0
        retention-days: 7
