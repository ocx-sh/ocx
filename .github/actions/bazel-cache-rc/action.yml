name: Bazel Cache Credential
description: >-
  Write the CI-only rc file that lets a lane upload to the shared Bazel cache: the
  credential helper that answers with the write credential, and the rc file that
  names it and grants `--remote_upload_local_results=true`. Both land under
  `$RUNNER_TEMP` and never in the workspace: Bazel spawns a
  `--credential_helper` with the full client environment, before the sandbox, so
  a helper reachable from a shipped rc file runs on a read-only
  `bazel query //...` from any clone (bazel#30439, closed by the vendor as
  intended; BZL-CACHE-04, MUST). With `write-auth` empty nothing is written —
  that is the fork-PR lane, to which GitHub gives no secrets. The caller passes
  the file with `--bazelrc="$RUNNER_TEMP/bazel-cache.rc"`, which loads after the
  workspace `.bazelrc` and so overrides its `--remote_upload_local_results=false`,
  and only when the file exists: `--bazelrc` naming a missing file is a hard
  error (measured on 9.2.0: exit 2, `Unable to read .bazelrc file`), so a fork
  lane must not name it.

inputs:
  write-auth:
    description: >-
      The cache **write** credential, as one
      `authorization=Basic <base64 of user:password>` value. The caller passes it
      unconditionally from the org secret `BAZEL_CACHE_WRITE_AUTH`; a run that
      holds no secret passes the empty string and gets no file. It reaches the
      credential helper and nothing else — never a `--remote_header` line.
    required: false
    default: ""
  cleanup:
    description: >-
      `true` deletes both files instead of writing them. A composite action has no
      `post:` hook — the runner's action schema gives `post`/`post-if` to
      `node-runs` and `container-runs` only — so the caller runs this action a
      second time under `if: always()`, and a cancelled or failed job leaves no
      credential on the runner.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Write the Bazel cache credential
      if: inputs.cleanup != 'true'
      shell: bash
      env:
        # Through `env:`, never as `${{ inputs.write-auth }}` inside the `run:`
        # body below. GitHub materialises every step script to a file under
        # `/home/runner/work/_temp/` before running it, so the interpolated
        # spelling writes the credential to a second place on disk and through
        # the expression-expansion path.
        WRITE_AUTH: ${{ inputs.write-auth }}
      run: |
        set -euo pipefail
        # Before either file exists, so neither is group- or world-readable for
        # even an instant. `write_rc.py` then chmods explicitly, since `open(2)`
        # is umask-clipped and `chmod(2)` is not.
        umask 077
        # The credential reaches the interpreter through the environment and
        # appears on no command line, so a `set -x` on this step traces exactly
        # these three lines and nothing else.
        python3 "$GITHUB_ACTION_PATH/write_rc.py"

    - name: Remove the Bazel cache credential
      if: inputs.cleanup == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # The two names `write_rc.py` may write. `rm -f` so the step is green on
        # a job that failed before the credential was ever written — the job an
        # `if: always()` cleanup exists for.
        rm -f "$RUNNER_TEMP/bazel-cache.rc" "$RUNNER_TEMP/bazel-cache-helper"
