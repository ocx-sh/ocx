# actionlint configuration.
# Docs: https://github.com/rhysd/actionlint/blob/main/docs/config.md

# release.yml is generated by cargo-dist (`dist generate-ci`) and must never be
# hand-edited (see .claude/rules/workflow-release.md). Its drift is policed by
# verify-release-ci.yml (`dist generate --check`), not by actionlint, so ignore
# every finding actionlint reports against it.
paths:
  .github/workflows/release.yml:
    ignore:
      - ".*"

# The Windows leg of `acceptance-native` puts Git's `usr\bin` on PATH with
# `echo 'C:\Program Files\Git\usr\bin' >> "$GITHUB_PATH"`. ShellCheck's info-level SC2028
# wants printf there; the backslashes are literal on purpose and the step moves between
# workflows byte for byte, so the one finding is ignored rather than the step edited. The
# repository's own `task ci:actionlint` gates ShellCheck at warning and never saw it; the
# template's `task workflows:lint` sets no floor.
  .github/workflows/deep-repo.yml:
    ignore:
      - "shellcheck reported issue in this script: SC2028:info:"
