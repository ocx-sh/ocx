# Optional tier-1 prose layer for the docs-quality rule set.
# Vale is never a rule's only verification. Every prose rule in this set is
# checkable with grep, checks/prose.py or markdownlint alone (DOC-PLAIN-19).
# Adopt this file only after the mandatory gate is green.
#
# Pin a package by org and repo, never by display name (DOC-PLAIN-21). Two
# separately authored packages ship as "vale-ai-tells": one with 17 tiered
# rules and one with about 111 rules all at error. Resolving by display name
# pulls whichever the registry happens to serve.
#
# Vale's own default severity is "suggestion", so a package that sets error on
# every rule turns a suggestion layer into a merge gate by surprise. Print the
# resolved package's rule count and its error share before enabling it:
#   vale ls-config | grep -c '\.yml'
#   grep -rc 'level: error' styles/

StylesPath = styles
MinAlertLevel = warning

# Named by org and repo. Replace each ref with the release tag you tested.
Packages = https://github.com/errata-ai/Google/releases/download/v0.5.0/Google.zip

[*.md]
BasedOnStyles = Google

# markdownlint MD054 owns link style, so Vale's equivalent stays off. Two
# linters demanding opposite fixes on one construct is the collision that
# makes a contributor's fix break the other tool (DOC-PLAIN-20).
Google.Ellipses = NO
Google.Parens = NO

# Sentence-case headings, the one construct grep cannot decide (DOC-PLAIN-14).
Google.Headings = warning

# Passive voice ships with no budget, so it stays a suggestion here rather
# than a gate.
Google.Passive = suggestion
