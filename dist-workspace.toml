[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "aarch64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
# The archive format to use for non-windows builds (defaults .tar.xz).
# .tar.gz on purpose: extraction must work on hosts without xz-utils.
unix-archive = ".tar.gz"
# The archive format to use for windows builds (defaults .zip)
windows-archive = ".zip"
# Which actions to run on pull requests
pr-run-mode = "skip"
# Generate and dist a source tarball
source-tarball = false
# Refuse a binary carrying test provenance before anything is published (scan-binaries.yml).
# `global`, not `local`: a `local-artifacts-jobs` entry needs only `plan`, so it runs beside the
# build and sees no binary; a `global-artifacts-jobs` entry needs `build-local-artifacts`, and
# `host` (the GitHub Release, and through `announce` every post-announce publish) needs it.
# .claude/tests/test_workflows.py pins both edges.
global-artifacts-jobs = ["./scan-binaries"]
# Refuse a tag that fails the version check or whose commit has no green release-readiness
# run (verify-version.yml, readiness-gate.yml, scripts/release_readiness_gate.py). Both `local`,
# not `plan-jobs`: dist makes every other job wait on a plan job and `host` reads their skip
# as a pass, so a red plan job would still publish. A `local` job needs only `plan`, so
# `host` sees its failure itself.
local-artifacts-jobs = ["./verify-version", "./readiness-gate"]
# Post-announce jobs to run in CI
post-announce-jobs = ["./post-release-oci-publish", "./docker-publish", "./sdkgen-publish"]
# Extra permissions for custom jobs. The override REPLACES the defaults, so
# every scope the called workflow needs must be listed.
github-custom-job-permissions = { verify-version = { contents = "read" }, scan-binaries = { contents = "read" }, readiness-gate = { contents = "read", actions = "read" }, docker-publish = { contents = "read", packages = "write", id-token = "write", attestations = "write", artifact-metadata = "write" }, post-release-oci-publish = { contents = "read", packages = "write" }, sdkgen-publish = { contents = "read", packages = "write", id-token = "write" } }
# No `include` for LICENSE-THIRD-PARTY.md: dist's auto-include glob is a
# prefix match on `LICENSE*`, so it already lands in every archive. Listing
# it explicitly puts it in twice (verified with `dist plan`).
# Whether to embed dependency information using cargo-auditable
cargo-auditable = true
# Whether to use cargo-cyclonedx to generate an SBOM
cargo-cyclonedx = true

# Build Windows arm64 natively, on the runner release-readiness.yml tests it on. Without this entry
# dist cross-builds the target with cargo-xwin on ubuntu, and the zip readiness executes is not the zip
# `release.yml` ships. `host` equal to the target is what makes dist skip the cross toolchain.
# .claude/tests/test_workflows.py pins the runner to readiness's.
[dist.github-custom-runners.aarch64-pc-windows-msvc]
runner = "windows-11-arm"
host = "aarch64-pc-windows-msvc"
