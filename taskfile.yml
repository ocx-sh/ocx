# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  REPORTS_ROOT: '{{.ROOT_DIR}}/target/reports'

includes:
  bazel: ./taskfiles/bazel.taskfile.yml
  git: ./taskfiles/git.taskfile.yml
  infra: ./taskfiles/infra.taskfile.yml
  rust: ./taskfiles/rust.taskfile.yml
  shell: ./taskfiles/shell.taskfile.yml
  ci: ./taskfiles/ci.taskfile.yml
  coverage: ./taskfiles/coverage.taskfile.yml
  duplo: ./taskfiles/duplo.taskfile.yml
  release: ./taskfiles/release.taskfile.yml
  satellite: ./taskfiles/satellite.taskfile.yml
  scripts: ./taskfiles/scripts.taskfile.yml
  telemetry: ./taskfiles/telemetry.taskfile.yml
  claude:
    taskfile: ./.claude/taskfile.yml
    dir: ./.claude
  test:
    taskfile: ./test/taskfile.yml
    dir: ./test
  recordings:
    taskfile: ./website/recordings.taskfile.yml
    dir: ./test
  schema:
    taskfile: ./website/schema.taskfile.yml
    dir: ./website
  website:
    taskfile: ./website/taskfile.yml
    dir: ./website

tasks:
  ocx:dirty-update:
    desc: Temporary dirty update to solve chicken-and-egg for ocx automation within this repository.
    cmds:
      - cargo build --release --bin ocx
      - cp target/release/ocx ~/.local/bin/ocx

  push:
    vars:
      DATE:
        sh: date -u +"%Y-%m-%dT%H:%M:%SZ"
    cmds:
      - git add .
      # A bare timestamp is not a conventional subject, and since the commit
      # gate moved into git itself (the `commit-msg` hook) this task's own
      # commit is judged like any other.
      # Quoted whole: the `: ` in the subject would otherwise make YAML read
      # the entry as a mapping.
      - 'git commit -m "chore: checkpoint {{ .DATE }}"'
      - git push {{ .CLI_ARGS }}

  checkpoint:
    cmds:
      - if: '! [[ $(git show -s --format=%s HEAD) == "Checkpoint" ]]'
        cmd: git commit --allow-empty -m "Checkpoint"
      - cmd: git add .
      - cmd: git commit --amend --no-edit --allow-empty

  check:
    # `--locked` makes a hand-merged Cargo.lock fail here, at the next run,
    # instead of in CI: the lock is only ever regenerated by cargo (D-054).
    cmd: cargo check --workspace --locked

  run:
    desc: Build and run ocx (pass args after --)
    cmd: cargo run --release --bin ocx -- {{.CLI_ARGS}}

  default:
    deps:
      # The repository arms its own git hooks here and in `verify`: those are
      # the two commands everyone working here runs, and the commit/push gate
      # is worth nothing until those hooks are in git's hooks directory.
      - task: git:hooks
      - task: rust:format:check
      - task: rust:clippy:check
      - task: check

  # Shared internal helpers (called by subsystem taskfiles via :prefix)
  # Convention: dot-prefix (.name) for internal tasks, like GitLab CI hidden jobs.
  .ensure-cargo-tool:
    internal: true
    status:
      - '{{.TOOL}} --version'
    cmds:
      - cargo install --locked {{.CRATE | default .TOOL}}

  # Two-phase verify: parallel lint, then sequential build+test
  verify:
    desc: Full quality gate
    summary: |
      Phase 1 (parallel, .verify:lint): rust:format:check, rust:clippy:check,
        shell:verify (shellcheck + shfmt), ci:verify (actionlint), claude:verify
        (structural tests + link check), scripts:verify (the gate-tool self-tests),
        test:lint (ruff over the acceptance suite), website:lint:links,
        bazel:pin:check (the Bazel pin authority; it reads text and one
        `bazel --version`, loads no graph, and so belongs in the parallel leg)
      Phase 2 (sequential, .verify:build-test): rust:license:check,
        rust:license:deps, rust:license:notice:check,
        scripts:suite-census, scripts:dead-path-sweep, rust:lint:ratchet,
        rust:doc:ratchet, rust:build,
        bazel:build:nobuild, then bazel:build:drift and bazel:tag:guard,
        which read the graph that step proves loadable, then bazel:lint
        (buildifier over every BUILD/.bzl file) and bazel:mod:check
        (the module lockfile is fresh) — A7's other two lint lines, both
        sub-second, neither of which had any caller before WP-39,
        then bazel:test:unit (`bazel test //crates/...` with its floor and
        skip ceiling read per target off that run's own build event stream —
        it replaces the three-step cargo nextest bracket, whose listing step
        alone measured 536.5 s on CI against 173.5 s for the run it fenced),
        that nextest ceiling parser's own red/green fixtures
        (rust:test:ceiling:self-test), the per-test duration budget's own
        red/red/green fixtures (rust:test:duration:self-test — both live
        parsers left this phase with the nextest run log they read),
        rust:test:doc
        (nextest runs no doctest, and the scoped gate's per-crate doctest step
        is iterated over an empty CRATES on every escalate), then
        bazel:test:accept — one serial `bazel test` over the acceptance
        package, the suite as 181 cached sh_test targets, carrying the suite
        floor and the skip/xfail ceilings read off its own per-case JUnit
        reports, and carrying the pytest entry point's own summary parser
        fixtures where the step it replaces reached them
      Ends with a *full* verify mark (.verify:mark SCOPE=full) — the only
        mark a `release:` commit or a commit on main accepts.
      A step whose `sources:` are unchanged is skipped, and the full mark is
        written anyway — that is the point: the check already passed on this
        content, and re-running it buys nothing. `--force` re-runs everything
        regardless. What this rests on is `sources:` being complete; an
        under-declared one is the way a cached green goes wrong. (The task name
        is spelled out nowhere in this summary on purpose: it is read as a
        phase member, and a name here that no phase runs is itself a red.)
      Use `task --status verify` to check freshness without running.
    cmds:
      # Deliberately not named in the summary above: that text is checked
      # against what `.verify:lint` / `.verify:build-test` run, and this is
      # neither — it is the one-line bootstrap that installs the git hooks.
      - task: git:hooks
      - task: .verify:lint
      - task: .verify:build-test
      - task: .verify:mark
        vars: { SCOPE: full }

  verify:scoped:
    desc: Scoped quality gate — only what changed since the last full verify (hubs and unrouted paths escalate to `task verify`)
    summary: |
      scripts/scoped_gate.py --plan decides (plan_crate_split_workspace.md C-019):
        escalate → task verify: a hub crate (≥ 4 reverse dependents), an
                   ecosystem crate, a crate whose test:scoped row reads
                   `escalate` (TABLE_ESCALATES: ocx_test_support, ocx,
                   ocx_python — `ocx` until the verbs move out of the CLI
                   crate), a path with no
                   route, or the gate tooling under `scripts/**` changed (its
                   self-tests are routed too, and the full run's
                   `.verify:lint` runs them)
        routed   → only the routed checks: claude:tests for `.claude/**`,
                   `.agents/**` and CLAUDE.md, actionlint (+ test_workflows.py)
                   for `.github/**`, test:parallel over the touched
                   `test/tests/test_*.py`, scripts:self-test for `scripts/**`,
                   the workspace-structure guards
                   (`nextest -p ocx_test_support --test workspace_structure`)
                   for a changed `crates/<c>/Cargo.toml` or README, plus
                   `cargo check --workspace --all-targets --locked` for the
                   manifest route — a manifest decides what compiles and
                   `Cargo.lock` carries no feature data, so nothing else
                   would catch a `[features]` edit that breaks the build
                   (D40)
        scoped   → the routed checks, cargo check --workspace, then per changed
                   crate clippy / nextest / doc tests, the workspace
                   rust:doc:ratchet, then
                   test:smoke and test:scoped -- <crates>
      Ends with a *scoped* mark: the pre-commit hook accepts it for ordinary
      commits, never for a `release:` commit or a commit on main (those need
      `task verify`). Sub-tasks (`claude:tests`, `test:parallel`,
      `test:smoke`) keep their `sources:` cache, so an unchanged step is
      skipped — `--force` re-runs everything.
    vars:
      PLAN:
        sh: python3 {{.ROOT_DIR}}/scripts/scoped_gate.py --plan
      DECISION: '{{(fromJson .PLAN).decision}}'
      # Empty unless the decision is `scoped`: an escalated run must not add
      # per-crate steps after the full verify it already ran.
      CRATES: '{{if eq (fromJson .PLAN).decision "scoped"}}{{(fromJson .PLAN).crates | join " "}}{{end}}'
      ROUTE_CLAUDE: '{{(fromJson .PLAN).routes.claude | join " "}}'
      ROUTE_WORKFLOWS: '{{(fromJson .PLAN).routes.workflows | join " "}}'
      ROUTE_TESTS: '{{(fromJson .PLAN).routes.tests | join " "}}'
      ROUTE_SCRIPTS: '{{(fromJson .PLAN).routes.scripts | join " "}}'
      ROUTE_MANIFESTS: '{{(fromJson .PLAN).routes.manifests | join " "}}'
      WORKFLOW_TEST_CMD: '{{(fromJson .PLAN).workflow_test_cmd}}'
    # Every step is a `cmds:` entry, never a precondition: `--force` skips
    # preconditions, and a gate must not be silently skippable.
    cmds:
      # Here too, not only in `verify`: this is the gate a work package runs,
      # and it only reaches `verify` on an escalate. A checkout whose operator
      # never runs anything else would otherwise commit with no hooks armed.
      - task: git:hooks
      - printf '%s\n' {{shellQuote .PLAN}}
      - if: '[ "{{.DECISION}}" = escalate ]'
        task: verify
      - if: '[ "{{.DECISION}}" != escalate ] && [ -n "{{.ROUTE_CLAUDE}}" ]'
        task: claude:tests
      - if: '[ "{{.DECISION}}" != escalate ] && [ -n "{{.ROUTE_WORKFLOWS}}" ]'
        task: ci:actionlint
      - if: '[ "{{.DECISION}}" != escalate ] && [ -n "{{.ROUTE_WORKFLOWS}}" ]'
        cmd: '{{.WORKFLOW_TEST_CMD}}'
      - if: '[ "{{.DECISION}}" != escalate ] && [ -n "{{.ROUTE_TESTS}}" ]'
        task: test:lint
      - if: '[ "{{.DECISION}}" != escalate ] && [ -n "{{.ROUTE_TESTS}}" ]'
        task: test:parallel
        vars: { CLI_ARGS: '{{.ROUTE_TESTS}}' }
      # Today a `scripts/**` change always escalates (the full run's
      # `.verify:lint` covers this); the step is the route's consumer for
      # when the gate ever certifies a scripts edit on its own.
      - if: '[ "{{.DECISION}}" != escalate ] && [ -n "{{.ROUTE_SCRIPTS}}" ]'
        task: scripts:self-test
      # A crate's Cargo.toml / README is workspace structure: the guards over
      # it are one test target, and `nextest -p <that crate>` selects none of
      # them. Reaching them used to mean the full verify because they were a
      # test of package `ocx`; since D34 they are a test of `ocx_test_support`,
      # which builds in seconds, so the route certifies the path on its own.
      - if: '[ "{{.DECISION}}" != escalate ] && [ -n "{{.ROUTE_MANIFESTS}}" ]'
        cmd: cargo nextest run -p ocx_test_support --test workspace_structure --locked
      - if: '[ "{{.DECISION}}" = scoped ]'
        cmd: cargo fmt --all -- --check
      # D40: a manifest edit decides what the workspace compiles — `[features]`,
      # a dependency edge, `default-features`, a `[[bin]]` — and `Cargo.lock`
      # carries no feature data, so such an edit never drags the lock into the
      # change set and never escalates. The guards target above compiles
      # `ocx_test_support` alone, so on its own this route certified a
      # workspace that does not build. `--locked` is part of the check: a
      # manifest edit the lock has not caught up with fails here by name.
      - if: '[ "{{.DECISION}}" != escalate ] && { [ "{{.DECISION}}" = scoped ] || [ -n "{{.ROUTE_MANIFESTS}}" ]; }'
        cmd: cargo check --workspace --all-targets --locked
      - for: { var: CRATES }
        cmd: cargo clippy -p {{.ITEM}} --all-targets --locked -- -D warnings
      # The scoped arm's unit run follows `.verify:build-test`'s: the engine
      # is Bazel, so a crate that passes here and a crate that passes in the
      # full gate passed under the same runner. `:all` rather than a named
      # target because a crate's test rules are not enumerable from the crate
      # name, and `--nocache_test_results` is deliberately NOT set - the point
      # of the scoped arm is that an untouched crate is free.
      #
      # `cargo nextest run -p <crate>` stays reachable as `rust:test:nextest`
      # (local convenience, per the goal's "nextest stays local-only"); it is
      # no longer what a gate reads.
      - for: { var: CRATES }
        cmd: ocx exec bazel -- bazel test //crates/{{.ITEM}}:all
      - for: { var: CRATES }
        cmd: cargo test --doc -p {{.ITEM}} --locked
      # Both arms, deliberately: the escalate arm reaches this through
      # `verify`. Until WP-10 only the scoped arm ran a doc check at all, so
      # escalating — which every batch does — *lost* the one gate that reads
      # intra-doc links. Workspace-wide rather than per-crate because the
      # baseline is keyed by file and a partial stream reads as a decrease.
      - if: '[ "{{.DECISION}}" = scoped ]'
        task: rust:doc:ratchet
      - if: '[ "{{.DECISION}}" = scoped ]'
        task: test:smoke
      - if: '[ "{{.DECISION}}" = scoped ]'
        task: test:scoped
        vars: { CLI_ARGS: '{{.CRATES}}' }
      - if: '[ "{{.DECISION}}" != escalate ]'
        task: .verify:mark
        vars: { SCOPE: scoped, CRATES: '{{.CRATES}}' }

  .verify:mark:
    internal: true
    desc: >-
      Write the JSON verify mark ({timestamp, head, scope, crates}) the
      pre-commit hook and verify:scoped read. Only `verify` passes SCOPE=full.
    vars:
      SCOPE: '{{.SCOPE | default "scoped"}}'
    cmds:
      - python3 {{.ROOT_DIR}}/scripts/scoped_gate.py --mark {{.SCOPE}} {{if .CRATES}}--crates {{.CRATES}}{{end}}

  verify:mark:
    desc: |
      Mark the current tree as verified at scope *scoped* (5-min TTL) — the
      deliberate escape hatch, and using it is allowed. For a cheaper tier run
      on purpose with the expensive one deferred (unit tests green, acceptance
      suite left for later) so intermediate commits on a branch stay fast, and
      for a passing verify where only cherry-pick / rebase merge context
      changed since. Name the deferral in the commit body. A hand mark is never
      `full` — a `release:` commit, a commit on main and `task
      release:prepare` need `task verify`.
    cmds:
      # On main the gate refuses a scoped mark, so writing one reads as
      # "verify:mark does nothing". Say so instead of marking.
      - cmd: >-
          b=$(git rev-parse --abbrev-ref HEAD);
          case "$b" in main|master)
            echo "verify:mark: branch is '$b', where the commit gate accepts only a FULL mark — run 'task verify' (a scoped mark would be written and then refused)" >&2;
            exit 1;; esac
      # Pinned, not defaulted: a CLI var (`task verify:mark SCOPE=full`) beats
      # the callee's `default`, and a hand mark must never be `full`.
      - task: .verify:mark
        vars: { SCOPE: scoped, CRATES: '' }
      - cmd: 'echo "verify:mark: scoped mark written at HEAD $(git rev-parse --short HEAD), 5-minute TTL"'

  .verify:lint:
    internal: true
    deps:
      - task: rust:format:check
      - task: rust:clippy:check
      - task: shell:verify
      - task: ci:verify
      - task: claude:verify
      - task: scripts:verify
      - task: test:lint
      - task: website:lint:links
      # The one Bazel gate that loads no graph: `bazel --version` against
      # `.bazelversion`, plus the `rust-toolchain.toml` ↔ `MODULE.bazel` twin.
      # The other five are sequential and live in phase 2, behind the step
      # that proves the graph loads.
      - task: bazel:pin:check

  .verify:build-test:
    internal: true
    cmds:
      - task: rust:license:check
      - task: rust:license:deps
      - task: rust:license:notice:check
      # Crate-split structural gates (plan_crate_split_workspace.md C-011,
      # C-070): the lint ratchet and the unit-test floor/ceiling around the
      # unit run. Linux-pinned tasks are no-ops elsewhere. The phase-1 edge
      # inventory (C-008) stood here and was retired with `ocx_lib` at WP-37 —
      # it counted `crate::` reaches inside the monolith and has no subject.
      # The acceptance suite's own shape, beside the two lint ratchets and for
      # the same reason: a number that moves for a sanctioned cause is the
      # cover a number moving for an unsanctioned one hides under (DEC-38).
      - task: scripts:suite-census
      # Sibling of the census, and wired here for the reason the ceiling's
      # self-test was: it had a task and a --self-test and was named by no
      # gate, so it proved it *could* sweep and never swept. A crate
      # extraction is exactly what leaves a `crates/ocx_*/src/...` literal
      # pointing at nothing, and those live in rule prose and comments no
      # compiler reads — so this belongs in the unconditional leg, not in
      # `scripts:verify`, which a diff touching only `crates/**` never reaches.
      - task: scripts:dead-path-sweep
      - task: rust:lint:ratchet
      # Sibling of the clippy ratchet, added for the same reason: the rustdoc
      # backlog can only be denied wholesale, so the gate that watched it ran
      # on the scoped arm alone and no escalated work package ever saw it.
      - task: rust:doc:ratchet
      - task: rust:build
      # The Bazel gates (plan_bazel_build_adoption.md C-010, C-011, C-014), in
      # this order because the other two read a graph and this step is what
      # proves there is one: a loading or analysis error surfaces here by its
      # own name instead of downstream as a missing edge or a missing tag.
      # DX-40 is the measured case — one BUILD file made `test/` a package and
      # 63 `//:` labels broke at once.
      - task: bazel:build:nobuild
      - task: bazel:build:drift
      - task: bazel:tag:guard
      # A7's other two lint lines (C-025). Both are sub-second warm — 0.66 s
      # and 0.31 s measured on the pinned binary — and both had no caller at
      # all until WP-39: `//:buildifier.check` has been green since WP-10 with
      # nothing running it, and `--lockfile_mode=error` appears in no rc file
      # on purpose. A7's fourth line, `bazel test //...`, is deliberately NOT
      # here: it compiles the workspace a second time and runs the acceptance
      # suite, so it belongs to `task bazel:test`, the release-gate entry
      # point, which WP-30's NO-GO leaves without a lane to call it.
      - task: bazel:lint
      - task: bazel:mod:check
      # A7's fourth line over the Rust half, and the three cargo steps it
      # replaces — `rust:test:floor`, `rust:test:unit`, `rust:test:ceiling`.
      # Measured on `verify-basic.yml`'s `smoke` job (measurement_bazel_r2.md
      # § 6): the floor step alone was **536.5 s**, because `cargo nextest
      # list --workspace --release --locked` builds every test binary in
      # release before it can name a case, against 173.5 s for the run itself.
      # Swapping only the execution step — which is what C-016 said and WP-23
      # did — removed 173.5 s and left the 536.5 s compile in place. So the
      # floor's subject moves to the run Bazel already did: one invocation, a
      # per-target case count read out of its build event stream against
      # `crates/TEST_TARGET_MAP.toml`, and the skip ceiling off the same read.
      #
      # It is per target rather than a sum, because `crates/NEXTEST_FLOOR`
      # carries 10 cases of headroom and `bazel test` exits 0 over a graph
      # that shrank — both measured, and both shown in the reader's own
      # `--self-test`, which is this task's first item.
      #
      # `rust:test:floor` / `:unit` / `:ceiling` survive as the local nextest
      # convenience and as `verify-deep.yml`'s macOS and Windows legs; they
      # are simply not what the gate reads any more.
      - task: bazel:test:unit
      # The nextest ceiling is a shell parser and this is its red/green proof.
      # It stays on the gate although `rust:test:ceiling` no longer runs here:
      # the task is still the answer on a machine `bazel:test:unit` does not
      # cover (it is `platforms: [linux]`, as the floor and ceiling were), and
      # a parser whose fixtures run nowhere is how it stopped matching before.
      - task: rust:test:ceiling:self-test
      # `rust:test:duration` is NOT here, for the reason `rust:test:ceiling`
      # is not: its subject is `target/nextest/run.log`, which the bracket the
      # swap removed was what wrote — `rust:test:floor` deleted it, `Test`
      # tee'd into it. With neither on the lane the live gate reads whatever
      # an earlier run left behind, or nothing: measured both ways on this
      # change, it printed 12 findings off a 963 KB stale log locally and
      # died `FileNotFoundError` on a clean CI runner. libtest prints no
      # per-test timing, so the budget is not re-derivable from the Bazel
      # logs the floor already reads; a per-TARGET budget off `TestResult`
      # is a different property and its own work package.
      #
      # Its red/red/green fixtures stay, exactly as the ceiling's do: the task
      # is still the answer on a machine `bazel:test:unit` does not cover, and
      # a parser whose fixtures run nowhere is how it stopped matching before.
      - task: rust:test:duration:self-test
      # nextest cannot run doctests, so nothing above this line executes one.
      # The per-crate `cargo test --doc` in `verify:scoped` runs under
      # `for: {var: CRATES}`, and CRATES is empty on an escalate — which a
      # change under the CLI crate is, `ocx` being in TABLE_ESCALATES. DX-58's
      # defect, fixed for `rust:doc:ratchet` and left standing here.
      - task: rust:test:doc
      # A7's fourth line over the acceptance half, replacing `test:parallel`.
      # The 181 `sh_test` targets have existed since WP-36 and nothing ran
      # them: both this phase and `verify-deep.yml`'s acceptance job called
      # `task test:parallel`, i.e. pytest directly, so stage 4 was neither
      # cached nor reported through Bazel. It is now, with its results CACHED
      # (adr_bazel_build_adoption.md § Stage 4, amended) — which is what pays
      # for the serial `--local_test_jobs=1` run: an unchanged tree executes 0
      # of 181, and one edited module executes 1.
      #
      # `test/SUITE_FLOOR` and the skip/xfail ceilings did not leave with
      # `test:parallel`: `bazel:test:accept` reads them off the 181 per-case
      # JUnit reports Bazel writes, which is more than the terminal-summary
      # parser they replace saw. `task test:parallel` survives as the local
      # xdist convenience and as `verify:scoped`'s acceptance leg.
      #
      # That parser's own red/green fixtures stay on the gate — inside
      # `bazel:test:accept` rather than beside it, which is where the step it
      # replaces reached them (`test:parallel` -> `test:default` ->
      # `ceilings:self-test`). Same obligation, same lane, and the phase keeps
      # one entry where it had one.
      - task: bazel:test:accept
