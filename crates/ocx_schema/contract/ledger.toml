# The breaks the current goldens make against `baseline/`, each acknowledged
# once. `task contract:rotate` drops every `[[break]]` table, and keeps this header,
# when it rotates the baseline.
#
# One `[[break]]` table per acknowledged finding:
#
#   [[break]]
#   document = "reports"     # reports | errors | cli
#   subjects = ["PushReport", "CopyReport"]
#                            # reports: root names; cli: command paths such as
#                            # "package push"; errors: ["*"]. Must list every
#                            # root or command the pointer reaches.
#   rule = "B02"             # a differ code, "doc" (reworded description, no
#                            # bump) or "semantic" (changed meaning, bumps)
#   pointer = "/$defs/PushReportRoot/properties/digest"
#                            # the finding's pointer: into the baseline for a
#                            # removal or change, into the current golden for
#                            # an addition
#   reason = "why the break is accepted"
#
# A listed root or command carries version baseline + 1; one no entry lists,
# its baseline version. A `doc` entry bumps nothing. An entry that matches no
# finding is stale and reds, except a `semantic` entry.

[[break]]
document = "cli"
subjects = ["package sbom"]
rule = "semantic"
pointer = "/root/commands/14/commands/17/args/1"
reason = "several SBOM candidates of one type now resolve to the newest instead of exiting 65 (multiple_attestations)"

[[break]]
document = "cli"
subjects = ["package verify"]
rule = "semantic"
pointer = "/root/commands/14/commands/22/args/0"
reason = "an omitted --platform now selects the host platform of an image index instead of acting on no platform"

[[break]]
document = "cli"
subjects = ["package sbom"]
rule = "semantic"
pointer = "/root/commands/14/commands/17/args/0"
reason = "an omitted --platform now selects the host platform of an image index instead of acting on no platform"

[[break]]
document = "cli"
subjects = ["package push"]
rule = "semantic"
pointer = "/root/commands/14/commands/15/args/10"
reason = "a failed --sign or --sbom now writes no tag, emits no report and returns the error document instead of a report with a failed signature"

[[break]]
document = "errors"
subjects = ["*"]
rule = "doc"
pointer = "/$defs/ErrorDetail/x-ocx-enum/378"
reason = "registry_delete_unsupported names where tag deletion goes on ghcr.io: ocx package prune --forge github"

[[break]]
document = "reports"
subjects = ["PushReport"]
rule = "B05"
pointer = "/$defs/AttestationStatus/x-ocx-enum/1"
reason = "a failed attestation emits the error document, so the failed status was unreachable and is removed"

[[break]]
document = "reports"
subjects = ["PushReport"]
rule = "B02"
pointer = "/$defs/AttestationOutcome/properties/kind"
reason = "the field described a failed attestation, which emits the error document instead"

[[break]]
document = "reports"
subjects = ["PushReport"]
rule = "B02"
pointer = "/$defs/AttestationOutcome/properties/message"
reason = "the field described a failed attestation, which emits the error document instead"

[[break]]
document = "reports"
subjects = ["PushReport"]
rule = "doc"
pointer = "/$defs/AttestationOutcome"
reason = "the description no longer covers a failed attestation"

[[break]]
document = "reports"
subjects = ["PushReport"]
rule = "doc"
pointer = "/$defs/AttestationOutcome/properties/predicate_type"
reason = "the field is present on every attestation, not only a succeeded one"

[[break]]
document = "reports"
subjects = ["PushReport"]
rule = "doc"
pointer = "/$defs/AttestationOutcome/properties/referrer_digest"
reason = "the field is no longer absent on failure, only under simplesigning"

[[break]]
document = "reports"
subjects = ["PushReport"]
rule = "doc"
pointer = "/$defs/AttestationOutcome/properties/signed"
reason = "the field is present on every attestation, not only a succeeded one"

[[break]]
document = "reports"
subjects = ["PushReport"]
rule = "doc"
pointer = "/$defs/PushReportRoot/properties/attestation"
reason = "a failed attestation emits the error document instead of this report"
