[package]
name = "ocx_util"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Internal-only escape hatch: gates `singleflight`'s test-only constructor.
# `cfg(test)` does not cross a crate boundary, so the seam is a feature a
# **dev**-dependency enables — resolver v3 keeps a dev-dependency feature out
# of the normal build, so a release binary physically lacks it.
__testing = []

[dependencies]
# The one `ocx_*` row, and none may be added beside it: `ocx_exit` is the
# vocabulary of error classification, which `scripts/crate_map.toml` allows
# this bottom tier to name and no other `ocx_*` crate.
ocx_exit.workspace = true
async-trait.workspace = true
bzip2.workspace = true
chrono.workspace = true
dunce.workspace = true
flate2.workspace = true
fs4.workspace = true
hex.workspace = true
log.workspace = true
lzma-rust2.workspace = true
pem.workspace = true
pki-types.workspace = true
regex.workspace = true
reqwest.workspace = true
# `fs::locked_file`'s acquire-time identity re-verify: "is the file I hold
# still the file at this path?" is `(dev, ino)` on Unix and
# `GetFileInformationByHandle` on Windows, whose std accessors are still
# unstable (`windows_by_handle`, rust#63010). Already in the tree via walkdir.
same-file.workspace = true
schemars.workspace = true
serde.workspace = true
# `preserve_order`: `opaque::OpaqueJson` re-emits a publisher's keys in their own order.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
symlink.workspace = true
tar.workspace = true
# Runtime, not test-only: `fs::persist_temp_file` is the workspace's one
# atomic-publish primitive and builds its `NamedTempFile` in production.
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
# The bundled Mozilla roots `tls::embedded_roots` seeds into a hand-rolled
# `reqwest::ClientBuilder`.
webpki-root-certs.workspace = true
x509-cert.workspace = true
zip.workspace = true
zstd.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
junction.workspace = true
windows-sys.workspace = true

[dev-dependencies]
# Fixture data (`data::archive_xz`, `pki::TestPki`, `fifo::mkfifo`). A dev edge
# to `ocx_test_support` is allowed from every crate
# (`scripts/crate_map.toml` `[dev].allowed_everywhere`).
ocx_test_support = { path = "../ocx_test_support" }
# `FutureExt` in the file-lock contention tests only.
futures.workspace = true
# The in-process TLS server behind the extra-CA-roots handshake proof
# (ocx#448). Test-only: production never terminates TLS, only dials out.
tokio-rustls = { workspace = true, default-features = false }

[lints]
workspace = true
