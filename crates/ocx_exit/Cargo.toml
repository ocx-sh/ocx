[package]
name = "ocx_exit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# `ErrorCategory` derives `Serialize` because its snake_case form IS the JSON
# error envelope's frozen `error.kind` value. `ExitCode` derives nothing from
# serde — a process status is a number.
serde.workspace = true
# The `Classify` derive this crate re-exports, so a tier crate names `ocx_exit`
# alone. A proc-macro runs at compile time and links nothing into a consumer.
ocx_exit_derive.workspace = true

[dev-dependencies]
# Test-only. The `error.kind` contract is an assertion on serialized *text*
# (`"unsupported"`), so the tests must render the variants
# through a real serializer rather than trust the derive. A dev edge is not
# built by `cargo build --release`, so this never reaches the shipped graph
# and `[dependencies]` above stays the serde and derive list.
serde_json.workspace = true

[lints]
workspace = true
