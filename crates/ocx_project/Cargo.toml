[package]
name = "ocx_project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# The tiers this one composes over, every edge sanctioned by
# `scripts/crate_map.toml`'s `ocx_project` row.
ocx_config.workspace = true
ocx_index.workspace = true
ocx_oci.workspace = true
ocx_package.workspace = true
ocx_shell.workspace = true
ocx_store.workspace = true
ocx_trust.workspace = true
ocx_util.workspace = true

chrono.workspace = true
clap_builder.workspace = true
dunce.workspace = true
hex.workspace = true
log.workspace = true
regex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
serde_repr.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true


[lints]
workspace = true

[dev-dependencies]
# The moved tests' own needs: an async trait for the resolver fakes, and the
# fixture/boundary helpers every crate's tests may use.
async-trait.workspace = true
# `__testing` ONLY — both runtime edges are in `[dependencies]` above. Without
# these two rows the crate's test target builds only inside a `--workspace`
# run, where a sibling's `__testing` unifies the feature in: `cargo test -p
# ocx_project` alone fails with 34 errors on `ocx_util::env::overrides` and
# `ocx_index::IndexImpl`. A dev edge enabling `__testing` is allowed from every
# crate, and the pattern is `ocx_lib`'s.
ocx_config = { workspace = true, features = ["__test_scaffolding"] }
ocx_index = { workspace = true, features = ["__testing"] }
ocx_util = { workspace = true, features = ["__testing"] }
