[package]
name = "ocx_shim"
version.workspace = true
edition = "2024"
license.workspace = true
repository = "https://github.com/ocx-sh/ocx"
# Internal blob (include_bytes!'d into ocx); not a release artifact.
publish = false

[[bin]]
name = "ocx-shim"
path = "src/main.rs"

[dependencies]
# The launcher decodes the `NAME.launch` record with these and applies it through `ocx_env_apply`;
# std + serde only, so the size budget holds.
ocx_env_apply.workspace = true
serde.workspace = true
serde_json.workspace = true

# `O_NONBLOCK` for the record open, so a FIFO planted at the record path cannot hang the launcher.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# CreateProcessW's signature references Security::SECURITY_ATTRIBUTES;
# windows-sys gates each function behind the features of every type it
# mentions, so the Security feature is required to import CreateProcessW.
windows-sys.workspace = true
dunce.workspace = true

[lints]
workspace = true

# size profile
#
# The binary-size budget (opt-level="z", lto=true, codegen-units=1, panic="abort", strip="symbols") is not declared
# here: Cargo honours `[profile.*]` tables only at the workspace root, and a size-tuned release profile there would
# change the release build of every workspace crate. The committed launcher blobs are built by their own profile and
# CI job; see `adr_unified_launcher.md`.
