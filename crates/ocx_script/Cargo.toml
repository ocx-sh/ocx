[package]
name = "ocx_script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# The composed package environment a script runs against (`host::HostState`).
ocx_config.workspace = true
# `Platform` and its `OperatingSystem`/`Architecture` enums — the typed values
# `ocx.os.*` / `ocx.arch.*` mirror, and what `variant_parity` pins them against.
ocx_oci.workspace = true
# `fs::path::{escapes_root, lexical_normalize}` — the sandbox guard's path
# containment check.
ocx_util.workspace = true

# Embedded Starlark engine — exact-pinned family (see root Cargo.toml comment).
# This crate is the firewall: no other workspace member may name these, which
# `lib.rs`'s `no_starlark_import_outside_firewall` asserts over all of `crates/`.
starlark.workspace = true
starlark_syntax.workspace = true
starlark_map.workspace = true
starlark_derive.workspace = true
# Sealed-trait supertrait of starlark's `StarlarkValue` (see root Cargo.toml).
# Host-allocated typed values (`OsValue`, `ArchValue`, `PlatformValue`,
# `RunResultValue`) implement `allocative::Allocative` directly.
allocative.workspace = true
# `expect.matches(text, pattern)` compiles the script author's pattern; an
# invalid one is a script-value error, not an assertion failure.
regex.workspace = true
thiserror.workspace = true
# `ocx.run`'s child process, and the `Handle::current().block_on` the sync
# entry point uses inside `block_in_place`.
tokio.workspace = true

[dev-dependencies]
# Test-only. `engine::classify` unit tests construct starlark `ErrorKind`
# variants to lock the variant -> outcome table; every variant field is an
# `anyhow::Error` (starlark_syntax 0.13 API), so the tests must name `anyhow` to
# build them. Kept out of `[dependencies]` on purpose: the runtime error surface
# is `thiserror` (quality-rust-errors.md), and a dev-dependency makes any runtime
# `use anyhow` a compile error.
anyhow.workspace = true
# Test-only. The sandbox-guard and `ocx.run` tests build a package root and a
# scratch root to run scripts against.
tempfile.workspace = true

[lints]
workspace = true
