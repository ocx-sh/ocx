# ---------------------------------------------------------------------------
# C-008's suite-level exclusion set: what `cargo nextest list` reports and no
# stage-1/2 Bazel target executes. `rust:test:floor` still counts these, which
# is why they are enumerated rather than left to a count comparison.
# ---------------------------------------------------------------------------

[[excluded_suite]]
suite = "ocx_schema::bin/ocx_schema"
crate = "ocx_schema"
cases = 0
reason = "a `[[bin]]` suite with no `#[cfg(test)]`; stages 1-2 build no `rust_binary` (ADR ruling 3) and there is nothing to run."

[[excluded_suite]]
suite = "ocx::linux_self_contained"
crate = "ocx_cli"
cases = 1
reason = "`env!(\"CARGO_BIN_EXE_ocx\")` — the suite's subject is the *shipped* binary's dynamic-link set, and stages 1-2 build no `rust_binary`. Giving it a fabricated path would green it against a file that is not ocx, which is worse than not running it."
