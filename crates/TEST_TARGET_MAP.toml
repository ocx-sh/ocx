# C-009 — one row per Bazel test target under `//crates/...` (`rust_test`,
# the `sh_test` seam twin, and one `rust_doc_test` per library crate), with the
# testcase count `bazel test` last executed for it. `bazel:build:drift` holds
# the row count to the number of those targets the graph has.
#
# **Rows are hand-derived; no writer exists.** `scripts/bazel_test_floor.py`
# only reads this file (`--bep`/`--junit`). A row is copied from the target's
# own `test.log` — the one `bazel test //crates/... --build_event_json_file=…`
# names in its `testResult` event — off libtest's summary line
# `test result: … P passed; F failed; I ignored; 0 measured; S filtered out`:
# `cases = P + F`, `ignored = I`, `skipped = S`, each omitted when 0. A target's
# row lands in the commit that adds the target. **Counts rise only.** A row
# whose count falls is either a deleted test or a `--skip` filter that widened
# past the name it was written for, and both are findings — say which in the
# commit body or the ratchet is doing nothing.
#
# A `rust_doc_test` row's `ignored` is its `ignore` fences. They are
# documentation rather than skipped tests, so the skip ceiling
# (`crates/NEXTEST_SKIP_CEILING`) leaves those targets out (C-034). Which
# doctests are ignored was pinned once, by C-031's name diff against
# `cargo test --doc --workspace -- --list` in the commit that added the rows;
# no gate repeats that diff. Afterwards a running doctest turned `ignore`
# lowers its row's executed count, and the floor reds on that.
#
# `cases` is *executed* testcases (passed + failed), so it excludes the
# `--skip`ped ones; `skipped` records how many a target's `args` filter out and
# is the testcase-level half of C-008's exclusion set. The suite-level half is
# the `[[excluded_suite]]` rows at the bottom: suites `cargo nextest list`
# reports that stage 1 builds no target for at all.
#
# Reconciliation against the other universe, measured on this tree
# (`cargo nextest list --workspace --release --locked --message-format json`,
# then `scripts/bazel_floor_proofs.py --derive --listing`):
#
#   nextest : 37 rust-suites (3 bin + 20 lib + 14 test), 8295 testcases,
#             8 of them `#[ignore]`d.
#   bazel   : 35 `rust_test` targets, 8246 executed + 40 skipped + 8 ignored.
#   8295 = 8246 + 40 + 8 + 1, the 1 being `ocx::linux_self_contained` below.
#
# The 20 `rust_doc_test` rows stand outside it too: nextest runs no doctest.
#
# One target stands outside both sums: `//crates/ocx_cli:ocx_cli_seam_test`,
# an `sh_test` that re-runs `ocx_cli_test`'s own binary with its `seam::` cases
# selected under a poisoned environment (ADR C-SEAM). It has no nextest suite of
# its own, so it adds a row here and nothing to the reconciliation.
#
# `derive_exclusions` in that script no longer derives the set from
# `kind != lib|test`. That rule was stale in both directions: `ocx::bin/ocx`
# (1 case) and `ocx_shim::bin/ocx-shim` (109) do have `rust_test` targets, and
# `ocx::linux_self_contained` is `kind = "test"` and has none, which the rule
# could not see — it reported 3 suites / 110 testcases against a true 2 / 1.
# The set below is the measured one and the script now names the same two.

