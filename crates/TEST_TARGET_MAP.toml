# C-009 — one row per Bazel `rust_test` target under `//crates/...`, with the
# testcase count `bazel test` last executed for it.
#
# Generated, never hand-edited: regenerate with the task's `-- --update`, which
# re-reads `bazel-testlogs/**/test.log`. **Counts rise only.** A row whose count
# falls is either a deleted test or a `--skip` filter that widened past the name
# it was written for, and both are findings — say which in the commit body or
# the ratchet is doing nothing.
#
# `cases` is *executed* testcases (passed + failed), so it excludes the
# `--skip`ped ones; `skipped` records how many a target's `args` filter out and
# is the testcase-level half of C-008's exclusion set. The suite-level half is
# the `[[excluded_suite]]` rows at the bottom: suites `cargo nextest list`
# reports that stage 1 builds no target for at all.
#
# Reconciliation against the other universe, measured on this tree
# (`cargo nextest list --workspace --release --locked --message-format json`,
# then `scripts/bazel_floor_proofs.py --derive --listing`):
#
#   nextest : 37 rust-suites (3 bin + 20 lib + 14 test), 8295 testcases,
#             8 of them `#[ignore]`d.
#   bazel   : 35 `rust_test` targets, 8246 executed + 40 skipped + 8 ignored.
#   8295 = 8246 + 40 + 8 + 1, the 1 being `ocx::linux_self_contained` below.
#
# One target stands outside both sums: `//crates/ocx_cli:ocx_cli_seam_test`,
# an `sh_test` that re-runs `ocx_cli_test`'s own binary with its `seam::` cases
# selected under a poisoned environment (ADR C-SEAM). It has no nextest suite of
# its own, so it adds a row here and nothing to the reconciliation.
#
# `derive_exclusions` in that script no longer derives the set from
# `kind != lib|test`. That rule was stale in both directions: `ocx::bin/ocx`
# (1 case) and `ocx_shim::bin/ocx-shim` (109) do have `rust_test` targets, and
# `ocx::linux_self_contained` is `kind = "test"` and has none, which the rule
# could not see — it reported 3 suites / 110 testcases against a true 2 / 1.
# The set below is the measured one and the script now names the same two.

