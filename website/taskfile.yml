# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

includes:
  schema:
    taskfile: ./schema.taskfile.yml
    internal: true
  sbom:
    taskfile: ./sbom.taskfile.yml
    internal: true
  recordings:
    taskfile: ./recordings.taskfile.yml
    internal: true
  scripts:
    taskfile: ./scripts.taskfile.yml

tasks:
  install:
    cmd: bun install

  lint:links:
    desc: Check markdown cross-references and section anchors under src/docs (offline)
    # `--root-dir src/public` because VitePress serves that directory at the
    # site root; without it every `<Terminal src="/casts/…">` reads as missing.
    # `.cast` files are gitignored build output (`task recordings:build`), so
    # they are excluded rather than demanded: this gate is for prose links.
    # No `--include-verbatim`, deliberately: code samples document URL *shapes*
    # (`file:///srv/ocx-index/corp`, `https://…`) and are correct as written —
    # eight false positives, zero real links, in the tree that motivated
    # this gate (#417). No `sources:`, for the reason `test:lint` gives.
    dir: '{{.TASKFILE_DIR}}'
    cmd: >-
      lychee --offline --no-progress --include-fragments
      --root-dir {{.TASKFILE_DIR}}/src/public
      --exclude '\.cast$'
      src/docs

  serve:
    interactive: true
    deps:
      - install
    cmd: bunx vitepress dev

  build:
    vars:
      OCX_DEPLOY_TARGET: '{{.OCX_DEPLOY_TARGET | default "dev"}}'
    env:
      OCX_DEPLOY_TARGET: '{{.OCX_DEPLOY_TARGET}}'
    deps:
      - install
    cmds:
      # `schema:default` regenerates every published schema (metadata,
      # config, project, project-lock, patch) so the website ships the
      # canonical JSON Schema files at `https://ocx.sh/schemas/<kind>/v1.json`.
      # The `project` and `project-lock` schemas back IDE auto-completion via
      # the `#:schema` directive emitted by `ocx init`; the `patch` schema
      # validates descriptor files authored for `ocx patch publish`.
      - task: schema:default
      - task: scripts:publish
      - task: recordings:parallel
      - task: sbom:generate:page
      - bunx vitepress build

  bazel:build:
    desc: Render the site through the coarse Bazel rule (//website:site) and unpack it
    # The Bazel path, ALONGSIDE `build` above, which is untouched and remains
    # the rollback (C-023; the ADR's edited-file table requires the parallel
    # path). This task is the fifth stage only — `bun install` + `vitepress
    # build`. The four generators above it stay on Taskfile because they need
    # `cargo`, `uv`, a compose registry and a network fetch of `agg`.
    #
    # `scripts:publish` is a hard prerequisite, not a convenience: the rule
    # refuses by name without `src/_scripts/`, because ~30 pages `<<<`-include
    # those snippets and vitepress aborts on the first miss.
    #
    # No `sources:`, deliberately — the whole point of the rule is that Bazel
    # owns the skipping, off declared inputs rather than off a second list
    # here that would then have to be kept in step with `website/BUILD.bazel`.
    #
    # `OCX_DEPLOY_TARGET` does NOT reach the rule: a build action inherits no
    # environment and `--action_env` lives in `.bazelrc`. This task always
    # produces the `dev` variant; the prod deploy stays on `build`.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - task: scripts:publish
      - ocx exec bazel -- bazel build //website:site
      - rm -rf .vitepress/dist
      - mkdir -p .vitepress/dist
      - tar -xf {{.ROOT_DIR}}/bazel-bin/website/site.tar -C .vitepress/dist
      - chmod -R u+w .vitepress/dist

  # Site deploys ride CI: deploy-website.yml builds + pushes to Cloudflare
  # Pages (ocx-website); the hetzner nginx reverse-proxies (dev.)ocx.sh to the
  # Pages deployment. No local rsync path anymore.

  deploy:licensed:
    desc: Push licensed assets (icons8 etc.) to the R2 bucket
    # Canonical store: R2 bucket `ocx-licensed` (CI overlays it into every
    # Pages deploy). Target-independent — dev and prod serve the same assets.
    # Credentials: ~/.config/ocx-infra/r2.env (gitignored, R2 S3 keys +
    # CF_ACCOUNT_ID).
    dotenv: ['{{.HOME}}/.config/ocx-infra/r2.env']
    env:
      # aws-cli v2.23+ default integrity checksums are not fully R2-compatible.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      AWS_DEFAULT_REGION: auto
    preconditions:
      - sh: '[ -d src/public/licensed ]'
        msg: "No licensed assets found in src/public/licensed/"
      - sh: '[ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$CF_ACCOUNT_ID" ]'
        msg: "R2 credentials missing — expected R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, CF_ACCOUNT_ID in ~/.config/ocx-infra/r2.env"
    cmds:
      - >-
        AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
        aws s3 sync src/public/licensed/ s3://ocx-licensed/
        --endpoint-url "https://$CF_ACCOUNT_ID.r2.cloudflarestorage.com" --delete
