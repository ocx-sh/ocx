# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

includes:
  schema:
    taskfile: ./schema.taskfile.yml
    internal: true
  sbom:
    taskfile: ./sbom.taskfile.yml
    internal: true
  recordings:
    taskfile: ./recordings.taskfile.yml
    internal: true
  scripts:
    taskfile: ./scripts.taskfile.yml
  reference:
    taskfile: ./reference.taskfile.yml

tasks:
  install:
    cmd: pnpm install --frozen-lockfile

  lint:links:
    desc: Check every link and fragment in the built site under dist (offline)
    # Needs `task website:build` first: the gate reads rendered HTML, because
    # Starlight rewrites links and mints heading ids that the sources do not
    # show. `--root-dir dist` resolves root-relative `/docs/…` links the way
    # the served site does. No `--include-verbatim`, deliberately: code
    # samples document URL *shapes* (`file:///srv/ocx-index/corp`) and are
    # correct as written. Offline, so absolute `https://ocx.sh/…` links are
    # skipped rather than fetched. `--index-files index.html` is what lets a
    # `…/page/#id` link find its fragment: without it every fragment into a
    # directory page reads as missing. The theme header and footer link the
    # sibling sections (`/apps/`, `/catalog/`, `/install/`, `/integrations/`)
    # that other repositories deploy, and the site root `/` belongs to the root site,
    # so those roots are excluded.
    dir: '{{.TASKFILE_DIR}}'
    preconditions:
      - sh: '[ -d dist/docs ]'
        msg: "No dist/docs — run `task website:build` first"
    cmd: >-
      lychee --offline --no-progress --include-fragments
      --index-files index.html
      --exclude '/dist/(apps|catalog|install|integrations)(/|$|#)'
      --exclude '/dist/?$'
      --root-dir {{.TASKFILE_DIR}}/dist
      dist

  test:
    desc: Run the docs site's node tests that need no built site (plugins, scripts)
    # The built-site tests in tests/ run in `website:check`; a stale dist would red them here.
    dir: '{{.TASKFILE_DIR}}'
    deps:
      - install
    cmd: pnpm test

  check:
    desc: Gate a built site — links, then the built-site tests with dist required
    # No `check:budget`: it stays red by owner decision (ocx-sh/ocx#606).
    dir: '{{.TASKFILE_DIR}}'
    preconditions:
      - sh: '[ -d dist/docs ]'
        msg: "No dist/docs — run `task website:build` first"
    cmds:
      - task: lint:links
      - WEBSITE_REQUIRE_DIST=1 node --test "tests/*.test.mjs"

  check:budget:
    desc: Fail when a built page exceeds 14,200 B gzip or 800 DOM elements
    dir: '{{.TASKFILE_DIR}}'
    preconditions:
      - sh: '[ -d dist/docs ]'
        msg: "No dist/docs — run `task website:build` first"
    cmd: python3 scripts/check_budget.py dist/docs

  lighthouse:
    desc: 'Run the Lighthouse budgets (scripts/lighthouse.mjs) against the built site'
    # Serves dist/docs under /docs/ and audits every built page (mobile preset):
    # 100 in all four categories plus the budgets in lighthouse.budgets.mjs.
    # Exits non-zero when any page misses one. Needs a Chrome: CHROME_PATH, CHROME_BIN (set on
    # GitHub's Ubuntu runners) or the Playwright one (`pnpm exec playwright install chromium`). Output
    # lands in .lighthouseci (gitignored); `--page <route>` after `--` narrows
    # the run.
    dir: '{{.TASKFILE_DIR}}'
    deps:
      - install
    preconditions:
      - sh: '[ -d dist/docs ]'
        msg: "No dist/docs — run `task website:build` first"
    cmd: pnpm run lighthouse {{.CLI_ARGS}}

  serve:
    interactive: true
    deps:
      - install
      # Pages include src/_scripts/ snippets; a stale tree fails each include.
      - task: scripts:publish
    cmd: pnpm exec astro dev

  build:
    deps:
      - install
    cmds:
      # `schema:default` regenerates every published schema (metadata,
      # config, project, project-lock, patch, reports, execution-record,
      # errors) into src/public/schemas, which the last step moves out of the
      # docs tree so they are served at `https://ocx.sh/schemas/<kind>/v1.json`.
      # The `project` and `project-lock` schemas back IDE auto-completion via
      # the `#:schema` directive emitted by `ocx init`; the `patch` schema
      # validates descriptor files authored for `ocx patch publish`.
      - task: schema:default
      - task: scripts:publish
      - task: recordings:parallel
      - task: sbom:generate:page
      # `outDir` is dist/docs (astro.config.mjs), so pages, casts and data
      # land under the `/docs/` base; `src/public` is copied in whole.
      - pnpm exec astro build
      # Schemas are a second tree at the site root, not under `/docs/`.
      - rm -rf dist/schemas
      - mv dist/docs/schemas dist/schemas
      # The deploy refuses a tree without a root index.html; list what was built.
      - node scripts/schemas-index.mjs dist/schemas

  bazel:build:
    desc: Render the site through the coarse Bazel rule (//website:site) and unpack it
    # The Bazel path, ALONGSIDE `build` above, which stays the rollback. This
    # task is the render stage only: `pnpm install` + `astro build`, and the
    # tar it unpacks already holds `docs/` and `schemas/`. The
    # generators above it need `cargo`, `uv`, a zot registry and a network
    # fetch of `agg`, so they stay on Taskfile.
    #
    # `scripts:publish` is a hard prerequisite, not a convenience: the rule
    # refuses by name without `src/_scripts/`, because ~30 pages include those
    # snippets and astro aborts on the first miss.
    #
    # No `sources:`, deliberately — Bazel owns the skipping, off the declared
    # inputs in `website/BUILD.bazel`, not a second list kept here.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - task: scripts:publish
      - ocx exec bazel -- bazel {{.CACHE_RC}} build //website:site
      - rm -rf dist
      - mkdir -p dist
      - tar -xf {{.ROOT_DIR}}/bazel-bin/website/site.tar -C dist
      - chmod -R u+w dist

  # Site deploys ride CI: deploy-docs.yml builds `task website:build` and
  # ships website/dist.
