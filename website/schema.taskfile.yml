# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  SCHEMA_DIR: "{{.TASKFILE_DIR}}/src/public/schemas"
  SCHEMA_TARGET: //crates/ocx_schema:schemas
  # Vendored upstream specs the borrowed-vocabulary conformance test reads.
  # Provenance, pins and checksums live in that directory's SOURCES.md.
  SPECS_DIR: "{{.ROOT_DIR}}/crates/ocx_schema/tests/specs"
  OCI_IMAGE_SPEC_TAG: v1.1.1
  IN_TOTO_ATTESTATION_TAG: v1.1.0

tasks:
  generate:
    desc: >-
      Generate every published JSON Schema (metadata, config, project,
      project-lock, patch, reports, execution-record) from the Bazel genrule
      //crates/ocx_schema:schemas into src/public/schemas/<kind>/.
    # No `sources:` fingerprint: Bazel is the cache, and a cache hit costs one
    # analysis. The repository root, because `ocx exec` resolves `bazel` from
    # the nearest `ocx.toml`.
    dir: '{{.ROOT_DIR}}'
    vars:
      # The CI cache credential, derived exactly as `test:.build-binaries`
      # derives it: a startup option, present only when the file exists.
      CACHE_RC:
        sh: test -f "${RUNNER_TEMP:-/nonexistent}/bazel-cache.rc" && printf '%s' "--bazelrc=$RUNNER_TEMP/bazel-cache.rc" || true
    cmds:
      # A nested `task`, not `task: :bazel:bootstrap`: this file is included at
      # two depths (root `schema:` and `website:schema:`), and go-task resolves
      # a leading `:` one namespace up rather than at the root — from
      # `website:schema:` it names `website:bazel:bootstrap`, which does not
      # exist (measured on go-task 3.53.1).
      - task -d '{{.ROOT_DIR}}' bazel:bootstrap
      - ocx exec bazel -- bazel {{.CACHE_RC}} build {{.SCHEMA_TARGET}}
      # Output paths from `cquery --output=files`, never a spelled `bazel-bin/`
      # path (that symlink follows whichever configuration built last). The
      # whole set is checked before any file is written, so a target that
      # stopped producing exactly the seven schemas publishes nothing. Copy
      # beside, reset the mode (Bazel outputs are read-only and executable),
      # then rename.
      - cmd: |
          set -eu
          expected='config/v1.json
          execution-record/v1.json
          metadata/v1.json
          patch/v1.json
          project-lock/v3.json
          project/v1.json
          reports/v1.json'
          expected=$(printf '%s\n' "$expected" | sort)
          err=$(mktemp)
          trap 'rm -f "$err" "{{.SCHEMA_DIR}}"/*/*.new' EXIT
          files=$(ocx exec bazel -- bazel {{.CACHE_RC}} cquery --output=files {{.SCHEMA_TARGET}} 2>"$err") || {
            echo "schema:generate: cquery failed; nothing written" >&2; cat "$err" >&2; exit 1; }
          got=$(printf '%s\n' "$files" | sed -n 's|^.*/bin/crates/ocx_schema/schemas/||p' | sort)
          count=$(printf '%s\n' "$files" | wc -l)
          if [ "$got" != "$expected" ] || [ "$count" -ne 7 ]; then
            echo "schema:generate: {{.SCHEMA_TARGET}} does not report exactly the 7 schemas; nothing written. cquery reported:" >&2
            printf '%s\n' "$files" >&2
            exit 1
          fi
          for src in $files; do
            [ -f "$src" ] || { echo "schema:generate: bazel reports $src, which is not a file" >&2; exit 1; }
          done
          # Stage all seven before renaming any, so a failed copy publishes nothing.
          for src in $files; do
            dst="{{.SCHEMA_DIR}}/${src##*/bin/crates/ocx_schema/schemas/}"
            mkdir -p "$(dirname "$dst")"
            cp "$src" "$dst.new"
            chmod 0644 "$dst.new"
          done
          for src in $files; do
            dst="{{.SCHEMA_DIR}}/${src##*/bin/crates/ocx_schema/schemas/}"
            mv "$dst.new" "$dst"
          done

  specs:refresh:
    desc: >-
      Re-fetch the vendored upstream spec artifacts at their pinned tags and
      check them against the checksums in SOURCES.md. Fails when upstream moved
      under a pin; rerun as `FORCE=1 task schema:specs:refresh` to accept the
      new bytes and rewrite the recorded checksums.
    cmds:
      - |
        set -euo pipefail
        specs='{{.SPECS_DIR}}'
        stage="$(mktemp -d)"
        trap 'rm -rf "$stage"' EXIT
        mkdir -p "$stage/oci" "$stage/in-toto"

        curl -fsSL -o "$stage/oci/image-index-schema.json" \
          'https://raw.githubusercontent.com/opencontainers/image-spec/{{.OCI_IMAGE_SPEC_TAG}}/schema/image-index-schema.json'
        curl -fsSL -o "$stage/in-toto/resource_descriptor.proto" \
          'https://raw.githubusercontent.com/in-toto/attestation/{{.IN_TOTO_ATTESTATION_TAG}}/protos/in_toto_attestation/v1/resource_descriptor.proto'

        # The in-toto field list is generated from the reference implementation
        # already pinned in test/uv.lock, not scraped from the proto text.
        cd '{{.ROOT_DIR}}/test'
        uv run python - > "$stage/in-toto/resource_descriptor.fields.json" <<'PY'
        import importlib.metadata as metadata
        import json

        from in_toto_attestation.v1 import resource_descriptor_pb2 as resource_descriptor

        print(
            json.dumps(
                {
                    "package": "in-toto-attestation",
                    "version": metadata.version("in-toto-attestation"),
                    "message": "in_toto_attestation.v1.resource_descriptor_pb2.ResourceDescriptor",
                    "fields": [
                        {"name": field.name, "json_name": field.json_name, "type": field.type}
                        for field in resource_descriptor.ResourceDescriptor.DESCRIPTOR.fields
                    ],
                },
                indent=2,
            )
        )
        PY
        cd "$specs"

        files='oci/image-index-schema.json in-toto/resource_descriptor.proto in-toto/resource_descriptor.fields.json'
        sed -n '/sha256:begin/,/sha256:end/p' SOURCES.md | sed -e '/sha256:/d' -e '/^```/d' > "$stage/RECORDED"

        if (cd "$stage" && sha256sum -c --status RECORDED); then
          echo 'vendored specs are unchanged at their pinned tags'
          exit 0
        fi

        if [ "${FORCE:-0}" != '1' ]; then
          echo 'upstream moved under a pinned tag — refusing to overwrite the vendored copies' >&2
          echo 'recorded:' >&2
          sed 's/^/  /' "$stage/RECORDED" >&2
          echo 'downloaded:' >&2
          # shellcheck disable=SC2086
          (cd "$stage" && sha256sum $files) | sed 's/^/  /' >&2
          echo "rerun as 'FORCE=1 task schema:specs:refresh' to accept the new bytes" >&2
          exit 1
        fi

        for file in $files; do
          cat "$stage/$file" > "$file"
        done
        # shellcheck disable=SC2086
        sha256sum $files > "$stage/NEW"
        awk -v new="$stage/NEW" '
          /sha256:begin/ {
            print
            print "```"
            while ((getline line < new) > 0) print line
            print "```"
            skip = 1
            next
          }
          /sha256:end/ { skip = 0 }
          !skip { print }
        ' SOURCES.md > "$stage/SOURCES.md"
        cat "$stage/SOURCES.md" > SOURCES.md
        echo 'vendored specs updated and SOURCES.md checksums rewritten'

  default:
    desc: Generate all schemas
    cmds:
      - task: generate
