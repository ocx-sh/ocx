[tools]
actionlint = "ocx.sh/actionlint/actionlint:1.7.12"
agg = "ocx.sh/asciinema/agg:1.9.0"
bazel = "ocx.sh/bazelbuild/bazel:9.2.0"
cosign = "ocx.sh/sigstore/cosign:3.1.1"
git-cliff = "ocx.sh/git-cliff/git-cliff:2.14.1"
task = "ocx.sh/go-task/task:3.53.1"
lychee = "ocx.sh/lychee/lychee:0.24.2"
prek = "ocx.sh/prek/prek:0.5.3"
shellcheck = "ocx.sh/shellcheck/shellcheck:0.11.0"
shfmt = "ocx.sh/shfmt/shfmt:3.13.1"
uv = "ocx.sh/astral-sh/uv:0.12.5"
# The build-qualified tag: the plain 3.14.7 tag rolls to the newest build and no longer matches the lock.
python = "ocx.sh/astral-sh/python-build-standalone:3.14.7_20260814"
node = "ocx.sh/nodejs/node:24.21.0"
pnpm = "ocx.sh/pnpm/pnpm:11.22.0"
zot = "ocx.sh/project-zot/zot:2.1.21"

# CI installs `default,<role>` per job and ocx rejects an undeclared group, so every role is declared.
# `ocx exec -g lint -- <tool>` composes only the named group; a pin here equals its pin in [tools].
[group.lint.tools]
prek = "ocx.sh/prek/prek:0.5.3"
gitleaks = "ocx.sh/gitleaks/gitleaks:8.30.1"
grim = "ocx.sh/grimoire/cli:0.14.3"
uv = "ocx.sh/astral-sh/uv:0.12.5"
actionlint = "ocx.sh/actionlint/actionlint:1.7.12"

[group.test.tools]
zot = "ocx.sh/project-zot/zot:2.1.21"

[group.build.tools]

[group.docs.tools]
cargo-cyclonedx = "ocx.sh/cyclonedx/cargo-cyclonedx:0.5.9"

[group.release.tools]
git-cliff = "ocx.sh/git-cliff/git-cliff:2.14.1"
