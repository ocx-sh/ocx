# ocx-baseline: template-owned file — change ocx-sh/conventions, then run task copier:update
# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# OCX project baseline tasks, included flat from the repo-owned root taskfile.yml.
# Human entry point: `ocx exec -- task <name>`; CI's setup action puts ocx on PATH first.

version: "3"

vars:
  # Pinned here (not in ocx.toml): neither tool is in the ocx index (D-01). Renovate bumps both.
  COPIER_VERSION: "9.18.2"
  ZIZMOR_VERSION: "1.30.1"

tasks:
  setup:
    desc: Pull the ocx toolchain, install grim client files, arm git hooks (idempotent)
    status:
      - '[ -z "$(ocx pull --dry-run 2>/dev/null | tail -n +2 | grep -v " cached$")" ]'
      - '[ -f grimoire.lock ]'
      - '[ -z "$(ocx exec -g lint -- grim status 2>/dev/null | grep -E "[[:space:]](missing|stale|modified)[[:space:]]*$")" ]'
      - 'grep -qs "generated by prek" "$(git rev-parse --git-path hooks/pre-commit)" && grep -qs "generated by prek" "$(git rev-parse --git-path hooks/commit-msg)"'
    cmds:
      - ocx pull
      - '[ -f grimoire.lock ] || ocx exec -g lint -- grim lock'
      - ocx exec -g lint -- grim install
      - task: hooks:install

  hooks:install:
    desc: Install the prek pre-commit and commit-msg git hooks (idempotent)
    status:
      - 'grep -qs "generated by prek" "$(git rev-parse --git-path hooks/pre-commit)"'
      - 'grep -qs "generated by prek" "$(git rev-parse --git-path hooks/commit-msg)"'
    cmds:
      - ocx exec -g lint -- prek install --hook-type pre-commit --hook-type commit-msg

  # Hook bodies live here, not in .pre-commit-config.yaml: Task embeds a POSIX shell interpreter, so
  # they run unchanged on Windows where a hook entry cannot assume `sh` (C-007). Builtins only.
  hooks:commit-msg:
    desc: "Fail unless the commit subject is a conventional commit (arg: the message file, as prek passes it)"
    silent: true
    cmds:
      # A repo-owned `hooks:repo-commit-msg` task judges the message instead, for a repo whose subjects this check
      # refuses (a `Checkpoint` commit, a `release:` subject) or that gates the commit on more than its subject.
      - cmd: '{{.TASK_EXE}} -x hooks:repo-commit-msg -- {{.CLI_ARGS}}'
        if: '{{.TASK_EXE}} --list-all --silent | grep -qx hooks:repo-commit-msg'
      - cmd: |
          # Task already shell-quotes CLI_ARGS (a path with spaces arrives as 'a b/MSG'): do not wrap it in quotes again.
          read -r msg < {{.CLI_ARGS}} || true
          case "$msg" in Merge\ *|Revert\ \"*) exit 0 ;; esac
          re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'
          if [[ $msg =~ $re ]]; then exit 0; fi
          echo "commit subject must be '<type>[(scope)][!]: <subject>' with type one of: feat fix docs style refactor perf test build ci chore revert" >&2
          exit 1
        if: '! ({{.TASK_EXE}} --list-all --silent | grep -qx hooks:repo-commit-msg)'

  hooks:repo-pre-commit:
    desc: Run the repo-owned hooks:pre-commit task when the repo defines it
    silent: true
    cmds:
      - cmd: |
          case "
          $({{.TASK_EXE}} --list-all --silent)
          " in
            *"
          hooks:pre-commit
          "*) {{.TASK_EXE}} hooks:pre-commit ;;
          esac

  lock:check:
    desc: Fail when ocx.lock or grimoire.lock is stale or the installed client files drift from it
    cmds:
      - ocx lock --check
      - task: grim:check

  grim:check:
    desc: Fail on a grimoire.toml/grimoire.lock mismatch or missing clients (D-05)
    cmds:
      - cmd: |
          clients=",$(ocx exec -g lint -- grim config get options.clients 2>/dev/null),"
          missing=""
          for c in claude codex opencode; do
            case "$clients" in *",$c,"*) ;; *) missing="$missing $c" ;; esac
          done
          if [ -n "$missing" ]; then
            echo "grim:check: grimoire.toml options.clients lacks:$missing (claude, codex and opencode are required)" >&2
            exit 1
          fi
      # `grim install` refuses (exit 65) a grimoire.lock whose declaration hash no longer matches
      # grimoire.toml (exit 79 when it is missing). Client files are committed grim output, so any
      # change install makes means a hand edit or a render the lock no longer produces; a floating
      # tag with a newer upstream digest is not a failure: install only materialises what the lock records.
      - cmd: |
          if [ ! -f grimoire.lock ] && grep -q '^profile: mirror' .copier-answers.yml; then
            echo "grim:check: no grimoire.lock yet (mirror profile) - task setup creates it; skipping install"
            exit 0
          fi
          ocx exec -g lint -- grim install
      - cmd: |
          out=$(git status --porcelain -- .claude/settings.json opencode.json .claude/skills .claude/rules \
            .claude/agents .opencode/skills .opencode/rules .agents/skills | grep -v '^. ' || true)  # worktree vs index; staged is fine
          if [ -n "$out" ]; then
            printf '%s\n' "$out" >&2
            echo "grim:check: grim client files differ from grimoire.lock — run task setup and commit them" >&2
            exit 1
          fi

  secrets:
    desc: Scan the repository history for secrets with gitleaks (exit 1 on a finding)
    cmds:
      - ocx exec -g lint -- gitleaks git --no-banner --redact

  workflows:lint:
    desc: Lint GitHub workflows with actionlint and zizmor (skips files generated by ocx-mirror; their drift guard owns them)
    cmds:
      - cmd: |
          gen=$(grep -rlm1 '^# Generated by ocx-mirror' .github/workflows --include='*.yml' --include='*.yaml' || true)
          if [ -z "$gen" ]; then
            ocx exec -g lint -- actionlint
            ocx exec -g lint -- uvx --from zizmor=={{.ZIZMOR_VERSION}} zizmor --no-online-audits --config .github/zizmor.yml .github
            exit 0
          fi
          wf=$(grep -rLm1 '^# Generated by ocx-mirror' .github/workflows --include='*.yml' --include='*.yaml' || true)
          [ -z "$wf" ] || ocx exec -g lint -- actionlint $wf
          [ ! -d .github/actions ] || wf="$wf .github/actions"
          [ -z "$wf" ] || ocx exec -g lint -- uvx --from zizmor=={{.ZIZMOR_VERSION}} zizmor --no-online-audits --config .github/zizmor.yml $wf

  baseline:check:
    desc: Fail on a hand-edited template-owned file or a broken baseline contract (ocx.toml, grimoire.toml, root tasks)
    silent: true
    cmds:
      - cmd: |
          get() { sed -n "s/^$1: *//p" .copier-answers.yml | tr -d "\"'"; }
          src=$(get _src_path); commit=$(get _commit)
          if [ -z "$src" ] || [ -z "$commit" ]; then
            echo "baseline:check: .copier-answers.yml lacks _src_path/_commit — adopt the baseline first (copier copy)" >&2
            exit 1
          fi
          tmp=$(mktemp -d); tpl="$tmp/template"; flag=""
          if ! git clone --quiet "$src" "$tpl" 2>/dev/null; then
            echo "baseline:check: cannot clone $src" >&2; rm -rf "$tmp"; exit 1
          fi
          if ! git -C "$tpl" checkout --quiet "$commit" 2>/dev/null; then
            # A fixture rendered from a dirty local template records an unreachable auto-commit.
            [ -d "$src" ] && tpl="$src"
            flag="--commit-unresolved"
          fi
          if command -v uv >/dev/null 2>&1; then uvx=uv; else uvx="ocx exec -g lint -- uv"; fi
          rc=0
          $uvx run --no-project --with pyyaml==6.0.3 python "$tpl/scripts/baseline_check.py" \
            --template "$tpl" --repo . --task "{{.TASK_EXE}}" $flag || rc=$?
          rm -rf "$tmp"
          exit $rc

  release:prepare:
    desc: "Prepare a release: BUMP=auto|patch|minor|major or VERSION=x.y.z (task --interactive offers a menu); never tags or pushes"
    cmds:
      - cmd: |
          if [ -z "{{.VERSION}}" ] && [ -z "{{.BUMP}}" ] && [ ! -t 0 ]; then
            echo "usage: task release:prepare BUMP=auto|patch|minor|major | VERSION=x.y.z   (or: task --interactive release:prepare)" >&2
            exit 2
          fi
      # Gate: the latest completed scheduled/dispatched verify-deep run on the default branch must be green.
      # A repo-owned `release:gate` task replaces this check (readiness that spans the repo's own workflows).
      # The negated form is `! ( ... )`: Task's `if:` skips the command when it starts with a bare `!`.
      - cmd: '{{.TASK_EXE}} release:gate'
        if: '{{.TASK_EXE}} --list-all --silent | grep -qx release:gate'
      - cmd: |
          if ! gh auth status >/dev/null 2>&1; then
            echo "release:prepare: gh is not authenticated — run gh auth login (the verify-deep gate reads run history)" >&2
            exit 1
          fi
          branch=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name) || exit 1
          err=$(mktemp)
          if ! runs=$(gh run list --workflow verify-deep.yml --branch "$branch" --status completed --limit 20 --json conclusion,url,event 2>"$err"); then
            # A workflow file absent from the default branch is a 404, which is the "never ran" case.
            if grep -q "not found on the default branch" "$err"; then
              echo "release:prepare: no verify-deep run on $branch yet — dispatch one" >&2
            else
              cat "$err" >&2
            fi
            rm -f "$err"; exit 1
          fi
          rm -f "$err"
          latest=$(printf '%s' "$runs" | ocx exec -g lint -- uv run --no-project python -c "import json,sys; rs=[r for r in json.load(sys.stdin) if r.get('event') in ('schedule','workflow_dispatch')]; print(rs[0]['conclusion'], rs[0]['url']) if rs else print('none')") || exit 1
          case "$latest" in
            none)
              echo "release:prepare: no verify-deep run on $branch yet — dispatch one" >&2; exit 1 ;;
            "success "*) ;;
            *)
              echo "release:prepare: the latest verify-deep run on $branch is not green: $latest" >&2; exit 1 ;;
          esac
        if: '! ({{.TASK_EXE}} --list-all --silent | grep -qx release:gate)'
      - task: release:run
        vars: { BUMP: auto }
        if: '[ -n "{{.VERSION}}" ]'
      - task: release:run
        if: '[ -z "{{.VERSION}}" ]'

  release:run:
    internal: true
    requires:
      vars:
        - name: BUMP
          enum: [auto, patch, minor, major]
    vars:
      NEXT_VERSION:
        sh: |
          if [ -n "{{.VERSION}}" ]; then
            v="{{.VERSION}}"; v="${v#v}"
            case "$v" in
              [0-9]*.[0-9]*.[0-9]*) printf 'v%s' "$v" ;;
              *) echo "release:prepare: VERSION must look like x.y.z, got '{{.VERSION}}'" >&2; exit 1 ;;
            esac
          elif [ "{{.BUMP}}" = auto ]; then
            ocx exec -g release -- git-cliff --bumped-version
          else
            ocx exec -g release -- git-cliff --bumped-version --bump "{{.BUMP}}"
          fi
    cmds:
      - cmd: '[ -n "{{.NEXT_VERSION}}" ] || { echo "release:prepare: git-cliff computed no next version" >&2; exit 1; }'
        silent: true
      - echo "Next version {{.NEXT_VERSION}}"
      # Optional repo-owned hook for version files (package.json, MODULE.bazel, ...).
      - cmd: |
          if {{.TASK_EXE}} --list-all --silent | grep -qx 'release:bump-files'; then
            {{.TASK_EXE}} release:bump-files VERSION="{{.NEXT_VERSION | trimPrefix "v"}}"
          fi
      - ocx exec -g release -- git-cliff --tag "{{.NEXT_VERSION}}" -o CHANGELOG.md
      # Optional repo-owned hook: validate what the release rewrote (version files, CHANGELOG.md).
      - cmd: |
          if {{.TASK_EXE}} --list-all --silent | grep -qx 'release:validate'; then
            {{.TASK_EXE}} release:validate VERSION="{{.NEXT_VERSION | trimPrefix "v"}}"
          fi
      # A repo-owned `release:verify` task replaces `verify` (the gate the release needs, not the one a PR needs).
      - cmd: '{{.TASK_EXE}} release:verify'
        if: '{{.TASK_EXE}} --list-all --silent | grep -qx release:verify'
      - task: verify
        if: '! ({{.TASK_EXE}} --list-all --silent | grep -qx release:verify)'
      - |
        echo ""
        echo "Release {{.NEXT_VERSION}} prepared. Review the changes, then commit, tag and push yourself."

  copier:update:
    desc: "Update this repo to a newer baseline with the pinned copier (extra args: task copier:update -- --vcs-ref v0.1.0)"
    cmds:
      - ocx exec -g lint -- uvx --from copier=={{.COPIER_VERSION}} copier update --defaults {{.CLI_ARGS}}
