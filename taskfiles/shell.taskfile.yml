# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Shell-script quality tasks. shellcheck + shfmt come from the project
# toolchain (`ocx.toml` → direnv → PATH); no `ocx package exec` wrapping.
# When running outside direnv, prefix with `direnv exec . <task>` or
# `ocx exec -- <task>` so the project tools are on PATH.

version: '3'

vars:
  # `docs-quality`'s own fixtures are excluded because they are checker *inputs*,
  # not scripts this repo ships: three-line snippets modelling what a doc page
  # contains, parsed by `checks/doc_examples.py` for their `# doc:` and
  # `# expect_exit:` headers. A doc snippet carries no shebang, so shellcheck
  # reports SC2148 on every one of them — and the fix cannot be to add one,
  # because that would make the fixture stop modelling the thing it exists to
  # model. Both the `.claude/` originals and their `.opencode/` mirrors.
  SHELL_GLOB: "'*.sh' ':(exclude)website/src/_scripts/' ':(exclude,glob)**/docs-quality/checks/fixtures/**'"

tasks:
  verify:
    desc: Shell script quality gate (shellcheck + shfmt)
    cmds:
      - task: shellcheck
      - task: shfmt:check

  shellcheck:
    desc: Lint shell scripts with shellcheck (severity warning+; see quality-bash.md)
    preconditions:
      - sh: '[ -n "$(git ls-files {{.SHELL_GLOB}})" ]'
        msg: 'No *.sh files found, skipping shellcheck'
    vars:
      FILES:
        sh: git ls-files {{.SHELL_GLOB}} | tr '\n' ' '
    cmd: shellcheck -S warning {{.FILES}}

  shfmt:check:
    desc: Check shell-script formatting (diff mode, no write)
    preconditions:
      - sh: '[ -n "$(git ls-files {{.SHELL_GLOB}})" ]'
        msg: 'No *.sh files found, skipping shfmt'
    vars:
      FILES:
        sh: git ls-files {{.SHELL_GLOB}} | tr '\n' ' '
    cmd: shfmt -d -i 4 -ci {{.FILES}}

  format:
    desc: Format shell scripts with shfmt (writes in place)
    preconditions:
      - sh: '[ -n "$(git ls-files {{.SHELL_GLOB}})" ]'
        msg: 'No *.sh files found, skipping shfmt'
    vars:
      FILES:
        sh: git ls-files {{.SHELL_GLOB}} | tr '\n' ' '
    cmd: shfmt -w -i 4 -ci {{.FILES}}
