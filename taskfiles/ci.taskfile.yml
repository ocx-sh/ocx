# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# CI / GitHub Actions quality tasks. actionlint comes from the project
# toolchain (`ocx.toml` -> direnv -> PATH); no `ocx package exec` wrapping.
# When running outside direnv, prefix with `direnv exec . <task>` or
# `ocx exec -- <task>` so the project tools (actionlint + its embedded
# shellcheck) are on PATH.

version: '3'

tasks:
  verify:
    desc: CI workflow quality gate (actionlint)
    cmds:
      - task: actionlint

  actionlint:
    desc: Lint GitHub Actions workflows with actionlint (shellcheck severity warning+; see subsystem-ci.md)
    env:
      # Match the shell subsystem's `shellcheck -S warning` floor so the
      # scripts actionlint extracts from `run:` blocks are linted at the same
      # severity project-wide (info/style findings are not gated). The
      # generated release.yml is excluded via .github/actionlint.yaml.
      SHELLCHECK_OPTS: '--severity=warning'
    cmd: actionlint

  # The tier aliases the conventions baseline's workflows call. Membership is the contract:
  # `task --dry ci:<tier>` lists exactly these tasks. `task verify` keeps its own list; the aliases are
  # what the template's jobs run, so a tier can be re-run alone. Actionlint is the template's
  # `workflows:lint`, not repeated here.

  lint:
    desc: 'Lint tier: format, shell, claude, test-lint and bazel gates, licenses, suite census, dead-path sweep, clippy, doc ratchet'
    # Submodules first: the template's checkout fetches none, and every Bazel gate below plus cargo-deny and
    # cargo-about resolve the graph the forks under `external/` patch. History second: the lint tier's
    # git readers need the release tags and `origin/main`, which that checkout lacks too. Then phase 1 of `task verify` (parallel,
    # builds nothing), then phase 2's lint members in its order: the Bazel gates after `bazel:build:nobuild`,
    # which proves the graph loads, and the two Bazel aspect passes last.
    cmds:
      - task: :git:submodules
      - task: :git:history
      - task: :rust:toolchain
      - task: .lint:phase1
      - task: :bazel:build:nobuild
      - task: :bazel:build:drift
      - task: :bazel:tag:guard
      - task: :bazel:lint
      - task: :bazel:mod:check
      - task: :rust:license:check
      - task: :rust:license:deps
      - task: :rust:license:notice:check
      - task: :scripts:suite-census
      - task: :scripts:dead-path-sweep
      - task: :rust:clippy:check
      - task: :rust:doc:ratchet

  # `lint`'s phase 1, its own task only because `deps:` run before `cmds:` and the submodules must come first.
  .lint:phase1:
    internal: true
    deps:
      - task: :rust:format:check
      - task: :shell:verify
      - task: :claude:verify
      - task: :test:lint
      - task: :test:lint:structure
      - task: :bazel:pin:check

  test:
    desc: 'Test tier: bazel unit tests, the cargo-only workspace guards and the website tests'
    cmds:
      - task: :git:submodules
      - task: :bazel:test:unit
      # The template's test job publishes `target/reports/junit/*.xml`; the unit run's per-case report is
      # the one `bazel:test:unit` already writes. Linux only, like the task (no report elsewhere).
      - cmd: |
          if [ -f target/bazel/junit.xml ]; then
            mkdir -p target/reports/junit
            cp target/bazel/junit.xml target/reports/junit/unit.xml
          fi
        silent: true
      - task: :rust:test:workspace-cargo
      - task: :website:test

  build:
    desc: 'Build tier: the rust build and the generated reference check'
    cmds:
      - task: :git:submodules
      - task: :rust:build
      - task: :website:reference:check

  docs:
    desc: 'Docs tier: build the website and gate the built pages on their Lighthouse budgets'
    # The build generates the schemas through Bazel and the SBOM through cargo, so it needs the submodules too.
    # Lighthouse needs a Chrome: CHROME_PATH, CHROME_BIN (the runner images set it) or the Playwright one.
    cmds:
      - task: :git:submodules
      - task: :website:build
      # ponytail: audits only the 60 pages that met every budget on the 2026-11-10 full build with theme 0.4.0
      # (of 113 built pages, redirect stubs excluded). The rest miss the DOM budget (more than 900 elements);
      # HTML bytes no longer decide it (ceiling: lighthouse.budgets.mjs). A page joins once it passes;
      # drop the list once the docs backlog is empty (ocx-sh/ocx#641).
      - task: :website:lighthouse
        vars:
          CLI_ARGS: >-
            --page /
            --page /404.html
            --page /changelog/
            --page /explanation/deferred-packages/
            --page /explanation/dependencies/
            --page /explanation/integrations/
            --page /explanation/launcher-forwarding/
            --page /explanation/local-index/
            --page /explanation/project-groups/
            --page /explanation/public-index/
            --page /explanation/records-and-sbom/
            --page /explanation/records-launcher-frames/
            --page /explanation/shell-consent/
            --page /explanation/toolchain-render/
            --page /explanation/toolchain-tree/
            --page /explanation/versioning/
            --page /getting-started/first-package/
            --page /getting-started/first-project/
            --page /guides/authenticate/
            --page /guides/choose-versions/
            --page /guides/clean-up/
            --page /guides/configure-ocx/
            --page /guides/find-packages/
            --page /guides/lock-and-reproduce/
            --page /guides/manage-config-centrally/
            --page /guides/run-with-dependencies/
            --page /guides/serve-an-index/
            --page /guides/stable-paths/
            --page /guides/update-tools/
            --page /guides/verify-installs/
            --page /guides/work-offline/
            --page /integration/
            --page /integration/bazel/
            --page /integration/devcontainers-and-editors/
            --page /integration/docker/
            --page /integration/publisher-ci/
            --page /integration/python/
            --page /integration/registry-auth-recipes/
            --page /integration/scripts-and-json/
            --page /integration/unattended-ci/
            --page /publishing/
            --page /publishing/bundle-anatomy/
            --page /publishing/declare-dependencies/
            --page /publishing/libc-variants/
            --page /publishing/promote-packages/
            --page /reference/command-line/config/
            --page /reference/command-line/direnv/
            --page /reference/command-line/index-commands/
            --page /reference/command-line/patch/
            --page /reference/command-line/self/
            --page /reference/command-line/shell/
            --page /reference/dependencies/
            --page /reference/machine-interface/
            --page /reference/metadata/dependencies/
            --page /reference/metadata/entry-points/
            --page /reference/metadata/integrations/
            --page /reference/platforms/
            --page /roadmap/
            --page /security/
            --page /troubleshooting/platforms/

  deep:
    desc: 'Deep tier: suite rows check, contract-baseline repository tests and the full self-tests of the gate scripts'
    # The self-tests that read the live Bazel graph need the submodules; the deep lint tier reads the
    # release tags, which the template's depth-1 checkout does not carry.
    cmds:
      - task: :git:submodules
      - task: :git:history
      - task: :test:rows:check
      - task: :test:lint:deep
      - task: :scripts:self-test
