# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# CI / GitHub Actions quality tasks. actionlint comes from the project
# toolchain (`ocx.toml` -> direnv -> PATH); no `ocx package exec` wrapping.
# When running outside direnv, prefix with `direnv exec . <task>` or
# `ocx exec -- <task>` so the project tools (actionlint + its embedded
# shellcheck) are on PATH.

version: '3'

tasks:
  verify:
    desc: CI workflow quality gate (actionlint)
    cmds:
      - task: actionlint

  actionlint:
    desc: Lint GitHub Actions workflows with actionlint (shellcheck severity warning+; see subsystem-ci.md)
    env:
      # Match the shell subsystem's `shellcheck -S warning` floor so the
      # scripts actionlint extracts from `run:` blocks are linted at the same
      # severity project-wide (info/style findings are not gated). The
      # generated release.yml is excluded via .github/actionlint.yaml.
      SHELLCHECK_OPTS: '--severity=warning'
    cmd: actionlint

  # The tier aliases the conventions baseline's workflows call (C-013). Membership is the contract:
  # `task --dry ci:<tier>` lists exactly these tasks. `task verify` keeps its own list; the aliases are
  # what the template's jobs run, so a tier can be re-run alone. Actionlint is the template's
  # `workflows:lint`, not repeated here.

  lint:
    desc: 'Lint tier: format, shell, claude, test-lint and bazel gates, licenses, suite census, dead-path sweep, clippy, doc ratchet'
    # Phase 1 of `task verify` (parallel, builds nothing), then phase 2's lint members in its order: the Bazel
    # gates after `bazel:build:nobuild`, which proves the graph loads, and the two Bazel aspect passes last.
    deps:
      - task: :rust:format:check
      - task: :shell:verify
      - task: :claude:verify
      - task: :test:lint
      - task: :test:lint:structure
      - task: :bazel:pin:check
    cmds:
      - task: :bazel:build:nobuild
      - task: :bazel:build:drift
      - task: :bazel:tag:guard
      - task: :bazel:lint
      - task: :bazel:mod:check
      - task: :rust:license:check
      - task: :rust:license:deps
      - task: :rust:license:notice:check
      - task: :scripts:suite-census
      - task: :scripts:dead-path-sweep
      - task: :rust:clippy:check
      - task: :rust:doc:ratchet

  test:
    desc: 'Test tier: bazel unit tests, the skipped-test run and the website tests'
    cmds:
      - task: :bazel:test:unit
      # The template's test job publishes `target/reports/junit/*.xml`; the unit run's per-case report is
      # the one `bazel:test:unit` already writes. Linux only, like the task (no report elsewhere).
      - cmd: |
          if [ -f target/bazel/junit.xml ]; then
            mkdir -p target/reports/junit
            cp target/bazel/junit.xml target/reports/junit/unit.xml
          fi
        silent: true
      - task: :rust:test:bazel-skipped
      - task: :website:test

  build:
    desc: 'Build tier: the rust build and the generated reference check'
    cmds:
      - task: :rust:build
      - task: :website:reference:check

  docs:
    desc: 'Docs tier: build the website and gate the built pages on their Lighthouse budgets'
    cmds:
      - task: :website:build
      - task: :website:lighthouse

  deep:
    desc: 'Deep tier: suite rows check, contract-baseline repository tests and the full self-tests of the gate scripts'
    cmds:
      - task: :test:rows:check
      - task: :test:lint:deep
      - task: :scripts:self-test
