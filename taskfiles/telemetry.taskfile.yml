# yaml-language-server: $schema=https://taskfile.dev/schema.json
#
# Build and test telemetry, pushed to https://otel.ocx.sh as OTLP traces:
#
#   * `push` — per-test timings from a JUnit report, so Grafana can name the
#     tests that accumulate the most wall clock. Its CI half is
#     `.github/actions/test-telemetry`.
#   * `bazel` — per-target timings from a Bazel Build Event Protocol stream,
#     so S-013 can be asked of a real build. It has no CI half: the same item
#     runs in both lanes, at the tail of `bazel:build:nobuild`. A step of its
#     own would need the BEP to outlive the build, and the BEP carries the
#     whole client environment (see that task's summary).
#
# Both are described in `.claude/rules/subsystem-ci.md` § Test telemetry.
#
# OFF BY DEFAULT, and silently: with no endpoint configured these tasks print
# nothing and change nothing, so `task verify` on a fresh checkout is
# unaffected. `push` needs `junit2otlp` on PATH as well and is a no-op without
# it; `bazel` needs only python3, which is a project-toolchain floor anyway.
#
# To turn it on for this machine:
#
#   1. For `push` only: install junit2otlp 0.1.2 onto PATH, from the release
#      tarball for your platform
#      (`junit2otlp_{linux,darwin,windows}_{x86_64,arm64}.tar.gz`):
#
#        https://github.com/mdelapenya/junit2otlp/releases/tag/v0.1.2
#
#   2. Write ~/.config/ocx-telemetry/env, mode 600 — it holds a password:
#
#        OTEL_EXPORTER_OTLP_ENDPOINT=https://otel.ocx.sh:443
#        OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic <base64 of ci:password>
#
#      The scheme and port are load-bearing. junit2otlp speaks OTLP over gRPC
#      only, and the Go SDK reads the endpoint as a URL: `https` selects TLS,
#      `http` selects plaintext, and a bare `host:port` fails outright with
#      `dns resolver: missing address`.
#
#      One value serves both transports. `bep_to_otlp.py` appends
#      `/v1/traces` to the same base and POSTs it over HTTP/JSON — nginx on
#      otel.ocx.sh proxies `location /v1/` to `tempo:4318` and its own comment
#      calls that the primary path, the gRPC location existing only because
#      junit2otlp has no other transport. `:443` is explicit and harmless in a
#      URL, so nothing here needs a second endpoint variable.
#
# The file is sourced by this task, so it works whether or not the shell you
# run `task` from has it loaded. Nothing here echoes its contents.

version: '3'

tasks:
  push:
    desc: >-
      Push one JUnit report to otel.ocx.sh as OTLP traces (JUNIT=<path>
      SUITE=unit|acceptance|smoke). A no-op, silently, unless the machine is
      configured for it — see the header of this file.
    # The body is long and this task runs at the tail of every test task; go-task
    # would otherwise echo the whole script on each one.
    silent: true
    cmd: >-
      set -u;
      set -o pipefail;
      if [ -f "$HOME/.config/ocx-telemetry/env" ]; then
        set -a; . "$HOME/.config/ocx-telemetry/env"; set +a;
      fi;
      [ -n "${OTEL_EXPORTER_OTLP_ENDPOINT:-}" ] || exit 0;
      command -v junit2otlp >/dev/null 2>&1 || exit 0;
      [ -f "{{.JUNIT}}" ] || exit 0;
      interpreter=$(command -v python3 || command -v python)
      || { echo "telemetry: no python on PATH to re-emit the report" >&2; exit 0; };
      branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown);
      sha=$(git rev-parse HEAD 2>/dev/null || echo unknown);
      host=$(uname -n 2>/dev/null || echo unknown);
      tree=$(env -u GIT_INDEX_FILE git write-tree 2>/dev/null || echo unknown);
      case "${OCX_GATE:-}" in
        lint|inner|full|deep) gate=",ocx.gate=$OCX_GATE";;
        '') gate='';;
        *) gate=''; echo "telemetry: OCX_GATE is not lint/inner/full/deep, not sent" >&2;;
      esac;
      marker="$(git rev-parse --show-toplevel 2>/dev/null)/target/bazel/accept/gate_escape";
      case "$(uname -s)" in
        Linux) os=linux;; Darwin) os=macos;; *) os=windows;;
      esac;
      norepo=$(mktemp -d);
      log=$(mktemp);
      pretty=$(mktemp);
      trap 'rm -rf "$norepo" "$log" "$pretty"' EXIT;
      cases=$("$interpreter" -c 'import sys, xml.dom.minidom; d = xml.dom.minidom.parse(sys.argv[1]); open(sys.argv[2], "wb").write(d.toprettyxml(encoding="utf-8")); print(len(d.getElementsByTagName("testcase")))' "{{.JUNIT}}" "$pretty")
      || { echo "telemetry: could not re-emit {{.JUNIT}}" >&2; exit 0; };
      escape=$("$interpreter" -c 'import sys, os, datetime, xml.dom.minidom as m; d = m.parse(sys.argv[1]); s = [datetime.datetime.fromisoformat(e.getAttribute("timestamp")).timestamp() for n in ("testsuites", "testsuite") for e in d.getElementsByTagName(n) if e.getAttribute("timestamp")]; print(",ocx.gate.escape=true" if s and os.path.getmtime(sys.argv[2]) > min(s) else "")' "{{.JUNIT}}" "$marker" 2>/dev/null || true);
      export OTEL_BSP_MAX_QUEUE_SIZE=$((cases + 1024));
      junit2otlp
      --service-name ocx-tests
      --trace-name "ocx-{{.SUITE}}"
      --repository-path "$norepo"
      --batch-size 512
      --additional-attributes "ocx.suite={{.SUITE}},ocx.source=local,ocx.os=$os,ocx.git.sha=$sha,ocx.git.branch=$branch,host.name=$host,ocx.git.tree=$tree$gate$escape"
      < "$pretty" > "$log" 2>&1
      || { echo "telemetry: junit2otlp failed: $(tail -n 3 "$log")" >&2; exit 0; };
      if grep -q 'traces export:' "$log"; then
        echo "telemetry: push did not land: $(grep -m1 'traces export:' "$log")" >&2; exit 0;
      fi;
      echo "telemetry: pushed {{.SUITE}} timings from {{.JUNIT}}"
    requires:
      vars: [JUNIT, SUITE]
    # Through the environment, never templated into the script: a caller's var
    # and the process environment both land here, and no value can break the
    # shell line it is read on.
    env:
      OCX_GATE: '{{.OCX_GATE}}'
    # Three span attributes are C-018's (plan_test_speed_tiers.md):
    #   ocx.gate         the tier, from OCX_GATE (a var a caller passes, or the
    #                    environment): `inner` from verify:scoped; omitted when
    #                    unset. `lint`/`deep` are admitted for the follow-up.
    #   ocx.git.tree     `git write-tree` of the real index — the verify mark's
    #                    `tree` definition, so a span and a mark can be joined.
    #   ocx.gate.escape  `true` when target/bazel/accept/gate_escape (written by
    #                    `scoped_gate.py --record-escapes`) is newer than the
    #                    pushed run's start, read off the report's own testsuite
    #                    `timestamp`; a report with none never carries it.

  accept:
    desc: >-
      Push T2's acceptance run (REPORTS=<per-module JUnit dir> SINCE=<run start
      epoch>) as one report with ocx.gate=full. A no-op, silently, unless the
      machine is configured for it — see the header of this file.
    summary: |
      C-018 / S-018. `task verify` reaches no other push, so without this the
      full tier's spans — and `ocx.gate.escape`, which only a failed T2 during
      a merge can set — never leave the host. `bazel:test:accept` calls it on
      a green and a red run alike and ignores its status.

      Only reports modified at or after SINCE are merged: bazel serves a cached
      target's report from an earlier run, and re-pushing it would count its
      cases again as if they ran now. A run that executed nothing pushes
      nothing. The merged file lives beside the reports' directory, never in
      it, so no `*/junit.xml` reader counts it.
    silent: true
    vars:
      OUT: '{{.REPORTS}}.telemetry.xml'
    cmds:
      - cmd: >-
          rm -f '{{.OUT}}';
          python3 -c 'import sys, os, glob, xml.etree.ElementTree as ET; since = float(sys.argv[2]); root = ET.Element("testsuites"); [root.extend(ET.parse(p).getroot().iter("testsuite")) for p in sorted(glob.glob(os.path.join(sys.argv[1], "*", "junit.xml"))) if os.path.getmtime(p) >= since]; len(root) and ET.ElementTree(root).write(sys.argv[3], encoding="utf-8", xml_declaration=True)' '{{.REPORTS}}' '{{.SINCE}}' '{{.OUT}}'
          || echo "telemetry: could not merge the acceptance reports under {{.REPORTS}}" >&2
      - task: push
        vars: { JUNIT: '{{.OUT}}', SUITE: acceptance, OCX_GATE: full }
    requires:
      vars: [REPORTS, SINCE]

  bazel:
    desc: >-
      Push one Bazel BEP to otel.ocx.sh as OTLP traces (BEP=<path>). A no-op,
      silently, unless the machine is configured for it — see the header of
      this file.
    summary: |
      C-019 / S-013. The reader is `scripts/bep_to_otlp.py`, whose
      tests (`scripts/tests/test_bep_to_otlp.py`, run by `scripts:verify`) are where its red states are
      proved; this task is the wiring and nothing else. No check count is
      quoted: it moves with every proof added, and nothing here re-measures it.

      `{{.BEP}}` is a scratch path the caller owns and deletes — this task
      neither creates nor removes it. `bazel:build:nobuild` is the only
      caller and its `defer:` is what guarantees the removal.

      **The floor is the script's own default** — `CRATES_RULE_TARGETS`, 78,
      imported from `scripts/bazel_gate_proofs.py` — and no `--min-targets` is
      passed here. The one lane that hands this task a BEP analyses `//...`, which is
      360 targets today, so 78 is a floor it clears by a wide margin. That is
      the point of it: the floor exists to tell "the reader read nothing" from
      "the build was clean", and 78 is the only number for this that has a
      home. Spelling 360 here would be a second copy of the `//...` floor
      `STAGE_FLOORS["stage-4"]` already holds, in a taskfile, where nothing
      re-measures it. The tighter reads of the same graph are two
      steps away and do block: `build:drift` floors at 82 and `tag:guard` at
      358.

      Failure is loud and non-fatal, the contract `push` above already has:
      the script prints one line per finding on stderr and exits 1, and this
      wrapper names the swallow and exits 0. `task verify` must not red
      because otel.ocx.sh is down. What *does* red is the producer —
      `bazel:build:nobuild` floors on the BEP it writes — so a dropped
      `--build_event_json_file` blocks while a collector outage warns.
    silent: true
    cmd: >-
      set -u;
      if [ -f "$HOME/.config/ocx-telemetry/env" ]; then
        set -a; . "$HOME/.config/ocx-telemetry/env"; set +a;
      fi;
      [ -n "${OTEL_EXPORTER_OTLP_ENDPOINT:-}" ] || exit 0;
      [ -s "{{.BEP}}" ] || {
        echo "telemetry: no build event stream at {{.BEP}}, nothing pushed" >&2; exit 0;
      };
      python3 {{.ROOT_DIR}}/scripts/bep_to_otlp.py --bep "{{.BEP}}"
      || {
        echo "telemetry: bep_to_otlp.py failed (above); the build is unaffected" >&2; exit 0;
      }
    requires:
      vars: [BEP]
