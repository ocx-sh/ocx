# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  # The tee'd log of the last `test:unit` run; `test:ceiling` reads its
  # Summary line (C-070).
  NEXTEST_RUN_LOG: '{{.ROOT_DIR}}/target/nextest/run.log'
  # The tee'd log of the last `test:unit` run on the Bazel arm. Read by that
  # arm and by nothing else, for one number: the `out of N` of Bazel's
  # `Executed M out of N tests` line. Never for a verdict about the test set
  # (C-013) — `M` collapses to 0 the moment the action cache is warm, while
  # `N` is what the run selected and does not move. A reader that took `M`
  # here, or that counted `(cached)` markers, would report a fully cached run
  # as 33 skipped tests and clear a ceiling of 9 by 24 without a single test
  # having been skipped.
  BAZEL_RUN_LOG: '{{.ROOT_DIR}}/target/bazel/test.log'

includes:
  # `--all-targets` on the check variants only. Without it `cargo check`
  # compiles the lib and the bins and stops, so every `#[cfg(test)]` module is
  # invisible — and three of the five real Windows breaks this gate has caught
  # lived in one. The build variants below must NOT carry it: they exist to
  # produce `ocx.exe`, and `build --release --all-targets` would also build
  # every test and bench target for a binary nobody runs.
  xwin-check-x86:
    taskfile: ./xwin.taskfile.yml
    internal: true
    vars: { TARGET: x86_64-pc-windows-msvc, SUBCOMMAND: check --all-targets }
  xwin-check-arm:
    taskfile: ./xwin.taskfile.yml
    internal: true
    vars: { TARGET: aarch64-pc-windows-msvc, SUBCOMMAND: check --all-targets }
  xwin-build-x86:
    taskfile: ./xwin.taskfile.yml
    internal: true
    vars: { TARGET: x86_64-pc-windows-msvc, SUBCOMMAND: "build --release" }
  xwin-build-arm:
    taskfile: ./xwin.taskfile.yml
    internal: true
    vars: { TARGET: aarch64-pc-windows-msvc, SUBCOMMAND: "build --release" }

x-shared:
  rust-sources: &rust-sources
    - '{{.ROOT_DIR}}/crates/**/*.rs'
    - '{{.ROOT_DIR}}/crates/**/Cargo.toml'
    # The three patched submodules compile into the binary, so a change there
    # invalidates exactly what a change under crates/ does.
    - '{{.ROOT_DIR}}/external/**/*.rs'
    - '{{.ROOT_DIR}}/external/**/Cargo.toml'
    - '{{.ROOT_DIR}}/Cargo.lock'
    - '{{.ROOT_DIR}}/rustfmt.toml'
    - '{{.ROOT_DIR}}/clippy.toml'
    - exclude: '{{.ROOT_DIR}}/target/**'
  # Shared by `license:notice` (writes the committed file) and
  # `license:notice:check` (writes a temp file and diffs). Both must invoke
  # cargo-about identically or the check reports drift that isn't there.
  #
  # `--offline` is load-bearing, not a speed knob: without it cargo-about asks
  # clearlydefined.io whenever a crate's license text is ambiguous, so the
  # notice depends on whether that service answered. A machine with no egress
  # reproduced the crate's own LICENSE text while CI got the harvested one, and
  # the two land in different sections — the check then failed on a file that
  # was generated correctly. Offline crawls local files only, which is the one
  # input both environments share.
  about-args: &about-args >-
    --offline
    --manifest-path '{{.ROOT_DIR}}/crates/ocx_cli/Cargo.toml'
    '{{.ROOT_DIR}}/about.hbs'

tasks:
  verify:
    desc: Rust-only developer gate for review-fix loops — NOT part of `task verify`, which reaches these checks through `.verify:lint` / `.verify:build-test` instead
    summary: |
      A convenience entry point, not a gate: nothing in `taskfile.yml`, in
      `.github/workflows/**` or in `scripts/scoped_gate.py` calls this task,
      and no rule prescribes it as *the* per-task gate any more (that used to
      contradict CLAUDE.md's `verify:scoped` model — plan_test_speed_tiers.md
      C-022 swept the wording). It stays as a Rust-only convenience for a
      manual review-fix loop when only Rust changed. Anything it runs that
      must also gate a
      merge is wired into `.verify:build-test` or a workflow job in its own
      right — never left to this list, which no CI run and no commit hook
      evaluates. `check:windows-cfg` below is reachable only from here; the
      MSVC property it checks is gated natively by verify-deep.yml's
      `Build & Unit Test (Windows)` job.

      Runs all Rust-specific checks sequentially (fail-fast):
        1. cargo fmt --check
        2. clippy through Bazel, ratcheted (Linux; clippy:check)
        3. cargo check of ocx_shim on both Windows MSVC targets
           (see check:windows-cfg for why the rest cannot join it here)
        4. hawkeye license headers
        5. cargo-deny license audit
        6. cargo-about third-party notice freshness
        7. cargo build --release
        8. the unit-test floor (Linux; test:floor)
        9. the unit tests (test:unit — `cargo nextest run`, or
           `bazel test //crates/...` under OCX_TEST_ENGINE=bazel)
       10. the ignored/skipped ceiling for whichever of the two ran
           (Linux; test:ceiling)
       11. the one-second per-test budget over that run (Linux; test:duration)
      The two parsers' red/green fixtures are pytest now
      (scripts/tests/test_nextest_ceiling.py,
      scripts/tests/test_unit_test_duration_gate.py), run by `task scripts:test`.
      Use during review-fix loops when only Rust code changed.
    cmds:
      - task: format:check
      - task: clippy:check
      - task: check:windows-cfg
      - task: license:check
      - task: license:deps
      - task: license:notice:check
      - task: build
      - task: test:floor
      - task: test:unit
      - task: test:ceiling
      - task: test:duration

  check:windows-cfg:
    desc: Type-check the cfg(windows)-only code the host gate cannot see
    summary: |
      `ocx_shim::run` is `#[cfg(windows)]` and `main.rs` carries
      `#![cfg_attr(not(windows), allow(dead_code))]`, so a host `cargo check`
      compiles none of it AND suppresses dead-code errors the Windows build
      treats as hard errors under `-D warnings`. This is not hypothetical: a
      host-clean check hid two real errors that only the MSVC targets caught.

      `cargo check` does no linking, and both `*-pc-windows-msvc` targets have
      std installed via rustup — so this needs neither xwin nor zig, unlike
      `check:windows` (which type-checks the whole workspace through Docker
      and stays the gate for the rest of the crates).

      Scoped to `ocx_shim` because it CANNOT be widened here, not because
      widening it would merely be slow. `ocx_oci` pulls `aws-lc-sys` (through
      the `oci-client` fork's `jsonwebtoken`), whose build script compiles C
      for the *target*; on a Linux host with no MSVC-targeting C toolchain
      `cargo check -p ocx_oci --target x86_64-pc-windows-msvc` dies in cc-rs
      (measured: exit 101, "command did not execute successfully",
      `pthread_rwlock_t` undeclared) before rustc ever type-checks a line of
      it — and every crate above `ocx_oci` inherits that. Adding them here
      buys a gate that is red for a reason nobody can fix. `ocx_shim` escapes
      it by having no dependencies off Windows.

      So the workspace's own `cfg(windows)` code is covered elsewhere, and is
      covered — the claim that nothing sees it is wrong:
        * `Build & Unit Test (Windows)` in verify-deep.yml runs
          `cargo nextest run --workspace` on windows-latest for every
          non-draft pull request, the merge queue and every push to main,
          which compiles the lib and every test target natively. It is the
          gate that has actually caught these breaks (basic has no Windows
          leg, D5).
        * `check:windows` below is its local mirror, through cargo-xwin in
          Docker, and now carries `--all-targets` for the same reason.
      Both inherit `-D warnings` from `[workspace.lints.rust]`, so neither
      needs a RUSTFLAGS of its own.
    sources: *rust-sources
    cmds:
      - cargo check -p ocx_shim --locked --all-targets --target x86_64-pc-windows-msvc
      - cargo check -p ocx_shim --locked --all-targets --target aarch64-pc-windows-msvc

  format:check:
    desc: Check Rust formatting
    cmd: cargo fmt --check

  format:apply:
    desc: Apply Rust formatting
    cmd: cargo fmt

  clippy:check:
    desc: Clippy over //crates/... as one cached Bazel aspect pass, ratcheted against clippy-warn-baseline.json
    summary: |
      One pass for what used to be two cargo runs (`cargo clippy -- -D
      warnings` here plus a second `-W unreachable_pub` run in its own
      `target/ratchet`). The aspect, its settings and `-Wunreachable_pub` live
      on `.bazelrc`'s bare `build` (BZL-RUST-23), so this command line only
      asks for the `clippy_output` group: each target's
      `<name>.clippy.diagnostics` is a cached action output, and a second run
      executes no `Clippy` action at all.

      scripts/lint_ratchet.py reads the files THIS run's build event stream
      names — never a `bazel-bin` glob — and fails on any `<file>::<lint>` key
      above its committed count, where an absent key counts as 0. That one
      compare is both the old `-D warnings` gate (a new warning of any code
      reds) and the backlog ratchet; the baseline may only ever hold
      `unreachable_pub` (C-018), so `-- --update --allow-regression` cannot
      park a new code. A decrease is committed with `-- --update`. The script
      also refuses a `[lints]` entry Bazel would not read (C-017).

      Stream handling is `bazel:test:unit`'s: `mktemp -d` outside the
      checkout, 0700 directory and 0600 stream (it serialises the client
      environment), removal deferred before anything can fail, and an empty
      stream is a red naming the flag. A failed build exits with bazel's
      status and the ratchet never reads the partial stream — lints are
      capped at warn, so a failed build is a compile, loading or fetch error.

      Linux only, like the unit lane: `cfg`-gated code makes the counts
      platform-dependent. No `sources:` — Bazel is the cache, and a
      fingerprint-cached verdict is the last tree's.
    dir: '{{.ROOT_DIR}}'
    platforms: [linux]
    vars:
      BEP_DIR:
        sh: mktemp -d -t ocx-clippy-bep.XXXXXXXX
      BEP: '{{.BEP_DIR}}/clippy-bep.json'
      # `bazel:test:unit`'s CACHE_RC, and why it is derived from the file.
      CACHE_RC:
        sh: test -f "${RUNNER_TEMP:-/nonexistent}/bazel-cache.rc" && printf '%s' "--bazelrc=$RUNNER_TEMP/bazel-cache.rc" || true
    cmds:
      - defer: rm -rf '{{.BEP_DIR}}'
      - task: :bazel:bep:mode
        vars: {DIR: '{{.BEP_DIR}}'}
      - task: :bazel:bootstrap
      - cmd: |
          status=0
          ocx exec bazel -- bazel {{.CACHE_RC}} build //crates/... --output_groups=clippy_output \
            --build_event_json_file='{{.BEP}}' || status=$?
          if [ "$status" -ne 0 ]; then
            echo "clippy: bazel build failed (compile, loading or fetch error), exit $status — lints are capped at warn, so no lint fails it; the ratchet does not read a partial build event stream" >&2
            exit "$status"
          fi
          if [ ! -s '{{.BEP}}' ]; then
            echo 'clippy: --build_event_json_file wrote nothing to {{.BEP}}, so the ratchet has no subject and would read a clean tree. Restore the flag on the build above.' >&2
            exit 1
          fi
          chmod 600 '{{.BEP}}'
          python3 {{.ROOT_DIR}}/scripts/lint_ratchet.py --by-file --bep '{{.BEP}}' {{.CLI_ARGS | default "--check"}}

  doc:ratchet:
    desc: Ratchet the rustdoc backlog against rustdoc-warn-baseline.json, per (file, lint code)
    summary: |
      Replaces the per-crate `-D rustdoc::broken_intra_doc_links` run this
      task used to be. That run denied a lint the workspace has a 400-entry
      backlog of, so it could not go green, and it was wired only into
      `verify:scoped`'s *scoped* arm — every escalated work package skipped
      it, which is how WP-10 shipped 21 new broken links past a gate that
      exists to catch exactly that.

      `cargo doc --message-format=json` emits the same `compiler-message`
      records clippy does, so scripts/lint_ratchet.py consumes this stream
      unchanged. `--by-file` keys each entry `<file>::<code>`: a bare per-code
      count stays flat when one link is fixed and another appears, and across
      a crate split that is the common case. A decrease is committed with
      `-- --update`; a file move reds until it is.

      `RUSTDOCFLAGS=--cap-lints warn` for the reason the clippy aspect caps
      at warn (`clippy:check`): `[workspace.lints] warnings = "deny"` reaches
      rustdoc too, and without the cap the walk aborts at the first crate
      with a backlog and the stream describes nothing after it.

      No `sources:`, for the reason `test:lint` gives: a fingerprint-cached
      gate reports the verdict of an earlier run. Its own CARGO_TARGET_DIR
      (target/docratchet) keeps the trailing rustdoc flags out of the
      fingerprint the other cargo tasks share. Linux only, like clippy:check:
      cfg-gated code makes the counts platform-dependent.
    platforms: [linux]
    cmds:
      - >-
        set -o pipefail;
        RUSTDOCFLAGS='--cap-lints warn'
        CARGO_TARGET_DIR='{{.ROOT_DIR}}/target/docratchet'
        cargo doc --workspace --no-deps --locked --message-format=json
        | python3 {{.ROOT_DIR}}/scripts/lint_ratchet.py --by-file
        --baseline '{{.ROOT_DIR}}/rustdoc-warn-baseline.json'
        {{.CLI_ARGS | default "--check"}}

  clippy:fix:
    desc: Auto-fix clippy warnings
    cmd: cargo clippy --workspace --locked --all-targets --fix --allow-dirty

  build:
    desc: Build the acceptance binary with Bazel and copy it to test/bin/ocx
    summary: |
      `test/taskfile.yml`'s `.build-binaries`, forced on: `bazel build` of
      `//crates/ocx_cli:ocx` (plus `ocx_shim` and `ocx_schema_bin`), the
      binary the Bazel acceptance targets run, copied into `test/bin/` for the
      pytest entry points and for `verify-basic.yml`'s `ocx-binary` upload.
      It carries the `__testing` provenance placeholders and seams (currently
      the `__OCX_SELF_IMAGE` env var override that acceptance tests use to
      redirect the canonical `ocx.sh/ocx/cli` identifier to a localhost test
      registry — see `crates/ocx_cli/BUILD.bazel`). The seams are
      loopback-only-asserted at runtime — safe in all non-release binaries.
      User-facing release artifacts come from cargo-dist (release.yml), which
      never builds this graph and therefore physically lacks the seams.
    # `SKIP_BUILD` pinned off: it defaults to true on CI, where this task is
    # the step that produces the binary rather than one that may reuse it.
    # No `sources:`/`status:` — Bazel decides what to rebuild.
    cmds:
      - task: :test:.build-binaries
        vars: { SKIP_BUILD: "false" }

  install:nextest:
    internal: true
    cmds:
      - task: :.ensure-cargo-tool
        vars: { TOOL: cargo-nextest, CRATE: cargo-nextest }

  test:unit:
    desc: Run unit tests — `OCX_TEST_ENGINE=bazel` runs them through `bazel test //crates/...` instead of nextest
    summary: |
      Two arms, one engine each, selected by `OCX_TEST_ENGINE` (`cargo`, the
      default, or `bazel`). An unknown value names no task and reds — the
      dispatch below is the validation, so there is no third state where the
      gate runs nothing and reports success.

      `cargo` stays the default while `crates/*/BUILD.bazel` does not exist
      (WP-12). That is also the rollback: the Bazel lane is reverted by not
      setting the variable, which is what the plan's partial-failure state
      rests on.

      **The `bazel` arm is PARKED, and nothing sets the variable.** Not because
      the swap was abandoned - it landed (DX-46 overrode WP-30's NO-GO, and
      `bazel:test:unit` now runs in `task verify` phase 2 and in
      `verify-basic.yml`'s `smoke`). It landed as its own task rather than as
      an engine switch inside this one, so this variable never acquired a
      setter. No lane, local or CI, runs `OCX_TEST_ENGINE=bazel` today — said here out loud
      because a green `task verify` says nothing about this arm and a reader
      would otherwise assume it does.

      It is parked rather than retired: it is landed, red/green-proven work
      (Schedule log row 13), its floor is the measured part that would have to
      be redone, and the plan carries an explicit **reopen condition** — a later
      R2 re-measurement with the shared cache realm deployed (C-029 is what
      makes that owner-gated today). The rot this exposes it to is the dispatch
      losing its target: `test:unit` selects `test:unit:{{.ENGINE}}` by string,
      so renaming the arm turns `OCX_TEST_ENGINE=bazel` into "task not found"
      and nothing in this repository would notice. That is what
      `TestSelfTestsRunOnAGate::test_the_parked_bazel_test_engine_arm_keeps_its_entry_point`
      in `.claude/tests/test_ai_config.py` asserts, and all it asserts —
      demanding reachability from `verify` would demand the lane WP-30 refused.

      `{{.CLI_ARGS}}` goes to the engine's own command — `-- --profile ci` to
      nextest, `-- --test_output=all` to Bazel. `test:ceiling` is invoked
      separately and takes its own, so a caller that names a nextest profile
      for the run must name it for the ceiling too (see that task).
    # No `sources:` here or on either arm. The bracket around this run —
    # `test:floor` deletes the log, `test:ceiling` reads it — needs the run to
    # happen every time: a fingerprint-cached skip would leave the ceiling no
    # log and red an unchanged tree, and a subset run (`-- <filter>`) would
    # otherwise stamp the full run up to date. Cargo's own fingerprints make
    # the recompile a no-op; the run itself is the price of a Summary line
    # that is always this run's. The Bazel arm needs the same absence in its
    # own currency: Bazel's action cache already decides what re-executes, and
    # a task-level fingerprint stacked on top of it would skip the run whose
    # `Executed … out of N tests` line carries the target floor — leaving that
    # floor unevaluated on exactly the trees where the graph could have shrunk.
    vars:
      ENGINE: '{{.OCX_TEST_ENGINE | default "cargo"}}'
    cmds:
      - task: 'test:unit:{{.ENGINE}}'

  test:nextest:
    desc: Run the unit tests through cargo-nextest (local convenience; no gate reads this)
    summary: |
      The cargo-nextest runner, kept reachable now that no gate uses it.
      `.verify:build-test` and `verify:scoped` both run the Bazel engine, so a
      green here is not a green `task verify` - it is the faster local loop and
      the second opinion when a Bazel result looks wrong.

      Not a fallback the gates can select: `OCX_TEST_ENGINE` still dispatches
      `test:unit`, and nothing sets it. If this and `bazel:test:unit` ever
      disagree, that disagreement is the finding.
    cmds:
      - task: test:unit:cargo

  test:unit:cargo:
    internal: true
    deps:
      - install:nextest
    # `set -o pipefail` so nextest's own exit status survives the `tee`; the
    # tee is what lets `test:ceiling` read the Summary line of the run that
    # just happened rather than of some earlier one (same shape as
    # test/taskfile.yml's `.suite-ceilings`).
    cmds:
      - mkdir -p {{.ROOT_DIR}}/target/nextest
      - >-
        set -o pipefail;
        cargo nextest run --workspace --release --locked {{.CLI_ARGS}}
        2>&1 | tee {{.NEXTEST_RUN_LOG}}
      # Per-test timings to otel.ocx.sh; a silent no-op unless this machine is
      # configured for it (taskfiles/telemetry.taskfile.yml). The default
      # profile's path, so a run passing `-- --profile ci` pushes nothing —
      # that profile writes to target/nextest/ci/, and in CI the push is the
      # `test-telemetry` action's, not this one's.
      - task: :telemetry:push
        vars:
          JUNIT: '{{.ROOT_DIR}}/target/nextest/default/junit.xml'
          SUITE: unit

  test:unit:bazel:
    internal: true
    summary: |
      `bazel test //crates/...`, floored on the number of test targets the run
      selected. The floor is the point: until WP-12 commits
      `crates/*/BUILD.bazel` the pattern matches no package at all, and a step
      that greens because its graph is empty is the exact failure this bracket
      exists to prevent. Measured on bazel 9.2.0, both zero-selection shapes
      already exit non-zero — 1 for "no targets found beneath 'crates'", 4 for
      "No test targets were found, yet testing was requested" — but neither
      exit code says how many targets there *were*, so a graph that shrank from
      33 to 2 is green on the exit code alone. The floor reads the count.

      It reads `N` from `Executed M out of N tests`, never `M`, and never the
      `(cached)` markers. Measured over a 33-target graph, cold then warm:
      `Executed 33 out of 33` and 0 `(cached)` lines, then `Executed 0 out of
      33` and 33 of them. `N` is the selection, `M` is what the action cache
      let through — reading `M` would make a warm cache indistinguishable from
      31 deleted targets, and reading the markers as skips would clear
      `crates/NEXTEST_SKIP_CEILING` by 24 on a tree where nothing was skipped
      (C-013).

      The floor value comes from `scripts/bazel_gate_proofs.py`'s
      `CRATES_TEST_TARGETS`, never from a literal here: WP-12's `crates/
      TEST_TARGET_MAP.toml` and WP-18's parity check reconcile against that
      same constant, and a second copy in a taskfile is the one that goes
      stale. `bazel` resolves off the project toolchain (`ocx.toml`), and
      `--jobs=12` is already a `build` line in `.bazelrc`, which `test`
      inherits — restating it here would be a second source of truth for a
      host RAM cap.
    cmds:
      - mkdir -p {{.ROOT_DIR}}/target/bazel
      - >-
        set -o pipefail;
        floor=$(python3 -c 'import sys; sys.path.insert(0, sys.argv[1]); import bazel_gate_proofs; print(bazel_gate_proofs.CRATES_TEST_TARGETS)' '{{.ROOT_DIR}}/scripts');
        [ -n "$floor" ] || { echo "bazel unit: could not read CRATES_TEST_TARGETS from scripts/bazel_gate_proofs.py — the floor has no value, and a comparison against an empty one is not a floor" >&2; exit 1; };
        status=0;
        bazel test //crates/... {{.CLI_ARGS}} 2>&1 | tee {{.BAZEL_RUN_LOG}} || status=$?;
        selected=$(sed -E 's/\x1b\[[0-9;]*m//g' {{.BAZEL_RUN_LOG}} | sed -nE 's/^Executed [0-9]+ out of ([0-9]+) tests?:.*/\1/p' | tail -n 1);
        selected=${selected:-0};
        [ "$selected" -ge "$floor" ] || {
          echo "bazel unit: the run selected $selected test target(s) under //crates/..., floor is $floor (CRATES_TEST_TARGETS in scripts/bazel_gate_proofs.py) — an empty or partial Rust test graph is not a pass; bazel exited $status" >&2; exit 1; };
        [ "$status" -eq 0 ] || exit "$status";
        echo "bazel unit: $selected test target(s) selected under //crates/... (floor $floor), all green"

  install:hawkeye:
    internal: true
    cmds:
      - task: :.ensure-cargo-tool
        vars: { TOOL: hawkeye, CRATE: hawkeye }

  install:cargo-deny:
    internal: true
    cmds:
      - task: :.ensure-cargo-tool
        vars: { TOOL: cargo-deny, CRATE: cargo-deny }

  license:check:
    desc: Check license headers on all source files
    deps:
      - install:hawkeye
    cmd: hawkeye check

  license:format:
    desc: Add or fix license headers on all source files
    deps:
      - install:hawkeye
    cmd: hawkeye format

  license:deps:
    desc: Audit dependency licenses with cargo-deny
    deps:
      - install:cargo-deny
    cmd: cargo deny check licenses

  install:cargo-about:
    internal: true
    # `--features cli` is not optional: cargo-about gates its own binary
    # behind that feature, so a plain `cargo install cargo-about` compiles
    # the crate, installs nothing, and exits with "none of the package's
    # binaries are available for install using the selected features".
    # `.ensure-cargo-tool` cannot pass features, hence the local copy.
    #
    # The version is pinned, and the status check matches it exactly rather
    # than merely asserting the binary exists. `license:notice:check` diffs a
    # committed file against this tool's output, so the tool version is an
    # input to the gate: 0.9.1 and 0.9.2 group multi-licensed crates
    # differently (0.9.2 emits separate sections for rustix, encoding_rs,
    # schemars, tracing-core and linux-raw-sys), and an unpinned install
    # turned the check red on every machine that happened to upgrade --
    # against a file nobody had touched.
    vars:
      CARGO_ABOUT_VERSION: 0.9.2
    status:
      - cargo about --version | grep -qxF 'cargo-about {{.CARGO_ABOUT_VERSION}}'
    cmds:
      - cargo install --locked --features cli --version {{.CARGO_ABOUT_VERSION}} cargo-about

  license:notice:
    desc: Regenerate LICENSE-THIRD-PARTY.md from the dependency graph
    summary: |
      Rewrites the third-party license notice reproducing the terms of every
      crate linked into the `ocx` binary. The file is committed, ships inside
      every release archive (dist auto-includes `LICENSE*`) and inside the
      OCX package. Run after any change to the dependency graph — CI's
      `license:notice:check` fails on a stale file.
    deps:
      - install:cargo-about
    cmd: cargo about generate {{.ABOUT_ARGS}} -o '{{.ROOT_DIR}}/LICENSE-THIRD-PARTY.md'
    vars:
      ABOUT_ARGS: *about-args

  license:notice:check:
    desc: Fail if LICENSE-THIRD-PARTY.md is out of date
    deps:
      - install:cargo-about
    vars:
      ABOUT_ARGS: *about-args
    # Deliberately no `sources:` — a fingerprint cache would let this skip
    # on exactly the runs that matter (a dependency resolving differently
    # without any tracked file changing).
    cmds:
      - |
        set -eu
        tmp="$(mktemp)"
        trap 'rm -f "$tmp"' EXIT
        cargo about generate {{.ABOUT_ARGS}} -o "$tmp"
        if ! diff -u '{{.ROOT_DIR}}/LICENSE-THIRD-PARTY.md' "$tmp"; then
          echo "LICENSE-THIRD-PARTY.md is stale — run 'task rust:license:notice'" >&2
          exit 1
        fi

  install:cargo-zigbuild:
    internal: true
    # Pinned: a cargo-zigbuild release can change the link invocation and
    # perturb the byte-equality gate. Ephemeral CI runners install exactly
    # this; a dev box with another version is skipped by `.ensure-cargo-tool`
    # `--version` status — `cargo install --locked cargo-zigbuild@0.22.3
    # --force` before refreshing a blob. Zig itself is provisioned at a
    # pinned version by build-windows-shims.yml (dev: any zig on PATH).
    cmds:
      - task: :.ensure-cargo-tool
        vars: { TOOL: cargo-zigbuild, CRATE: cargo-zigbuild@0.22.3 }

  shim:build:
    desc: Cross-build the stripped Windows shim blob (issue #66)
    summary: |
      Hermetically cross-builds crates/ocx_shim with the size-tuned `shim`
      profile for one *-pc-windows-gnullvm target via cargo-zigbuild and
      writes the stripped binary to target/<TARGET>/shim/ocx-shim.exe. The
      committed blobs under crates/ocx_store/src/shims/ and the SHIM_SHA256
      constants are refreshed from this output in a dedicated PR (see
      shim.rs module docs and adr_shim_hermetic_zigbuild.md). Required var:
      TARGET (x86_64-pc-windows-gnullvm | aarch64-pc-windows-gnullvm).
    requires:
      vars: [TARGET]
    deps:
      - install:cargo-zigbuild
    vars:
      # rustc translates the virtual `/rustc/<hash>/library/…` spans carried by
      # the prebuilt std back to the REAL local rust-src checkout whenever that
      # component is installed (rust-analyzer pulls it in). The translated paths
      # reach the blob through the `core::panic::Location` values codegen'd here
      # for generic std instantiations, so a dev box bakes `$HOME/.rustup/…`
      # into an executable every Windows user runs — CI has no rust-src and
      # never saw it. Remapping the checkout back onto the virtual prefix
      # restores CI's exact spelling and works on the pinned stable toolchain;
      # `-Ztrim-paths` would need the nightly bootstrap this task refuses.
      RUST_SRC_DIR:
        sh: printf '%s/lib/rustlib/src/rust' "$(rustc --print sysroot)"
      RUSTC_COMMIT_HASH:
        sh: "rustc -vV | awk '/^commit-hash: /{print $2}'"
    # Hermetic: Zig bundles its own clang/lld/libc, so the output depends only
    # on pinned rustc (rust-toolchain.toml) + pinned zig + source — no floating
    # Microsoft SDK manifest (the old cargo-xwin treadmill). NOT byte-
    # reproducible: the gnullvm PE link embeds a per-link build id, so two runs
    # differ and CI compares no bytes — integrity is SLSA attestation + the
    # SHIM_SHA256 canary + this job's path filter (adr_shim_hermetic_zigbuild.md
    # addendum 2, "gate redesign"). NO -Zbuild-std: it is not reproducible
    # either and forces a nightly bootstrap, so the toolchain's prebuilt std
    # ships as-is — which is why the blob is ~239–333 KiB rather than the
    # ~65 KiB the build-std PoC produced, still well within SHIM_SIZE_BUDGET.
    # The gnullvm targets need the stack-probe builtins;
    # crates/ocx_shim/src/chkstk.rs supplies them inline, independent of
    # build-std. CI must call this task, never raw cargo.
    #
    # RUSTFLAGS is assigned on the command line rather than through `env:`:
    # go-task's task-level `env:` LOSES to an inherited variable, and CI's
    # setup-rust-toolchain exports `RUSTFLAGS=-D warnings`. That is how the
    # former `-Clink-arg=/Brepro` here was silently inert in CI for every blob
    # ever shipped while making any clean dev shell fail at link — `zig cc`
    # rejects the MSVC-style flag outright, and rejects `-Wl,--no-insert-
    # timestamp` too, so the COFF TimeDateStamp is simply not zeroed.
    cmd: >-
      RUSTFLAGS="-D warnings --remap-path-prefix={{.RUST_SRC_DIR}}=/rustc/{{.RUSTC_COMMIT_HASH}}"
      cargo zigbuild -p ocx_shim --profile shim --locked --target {{.TARGET}}

  check:windows:
    desc: Cross-compile-check both Windows MSVC targets via Docker (cargo-xwin, cached)
    summary: |
      Runs `cargo xwin check --all-targets` for x86_64-pc-windows-msvc and
      aarch64-pc-windows-msvc inside the messense/cargo-xwin Docker image.
      This is the ONLY local gate that type-checks the workspace's
      `cfg(windows)` code — `check:windows-cfg` cannot reach it on the host
      (see there) — and
      it covers the aarch64 arm that no CI leg on a pull request does. Not in
      `verify`: it needs Docker and a ~250 MiB SDK download, and every
      non-draft pull request already runs verify-deep.yml's `Build & Unit
      Test (Windows)`, which compiles the same code natively. Run it before
      marking a PR ready with anything under a `cfg(windows)` or
      `cfg(not(unix))` branch and save a CI round-trip.

      Not a `verify-basic.yml` leg either, and a plain host `cargo check
      --target` is not a cheaper substitute for one: `ocx_oci` pulls
      `aws-lc-sys`, whose build script compiles C for the TARGET, so on a
      Linux host `cargo check -p ocx_oci --locked --target
      x86_64-pc-windows-msvc` dies in cc-rs before rustc type-checks a line
      (measured 2026-09-16: exit 101, "unknown type name 'pthread_rwlock_t'").
      The only Linux-hosted path that does work is this one — Docker plus a
      ~250 MiB MSVC SDK — which is the cost ruling D5 took off the draft tier,
      and `aarch64-apple-darwin` has no host equivalent at all. So the draft
      and `announce/**` gaps that subsystem-ci.md records under D5/D10 stay as
      ruled: covering them means paying for deep, not for a cheap extra leg. First run
      downloads the MSVC SDK headers (~250 MiB) and crate registry into
      .cache/xwin/; subsequent runs reuse both caches plus target/xwin/
      so an unchanged tree finishes in seconds.
    cmds:
      - task: xwin-check-x86:exec
      - task: xwin-check-arm:exec

  build:windows:
    desc: Cross-build release binaries for both Windows MSVC targets via Docker (cargo-xwin, cached)
    summary: |
      Runs `cargo xwin build --release` for x86_64-pc-windows-msvc and
      aarch64-pc-windows-msvc inside the messense/cargo-xwin Docker image.
      Mirrors the CI cross-compile (verify-deep.yml) byte-for-byte modulo
      the Docker-from-host scaffolding. Produces
      target/xwin/<triple>/release/ocx.exe. Shares caches
      with check:windows under .cache/xwin/.
    cmds:
      - task: xwin-build-x86:exec
      - task: xwin-build-arm:exec

  build:windows:x86:
    desc: Cross-build the x86_64 Windows MSVC release binary via Docker (cargo-xwin, cached)
    summary: |
      Single-arch slice of build:windows — produces
      target/xwin/x86_64-pc-windows-msvc/release/ocx.exe only.
      Used by the Windows activation gate (verify:windows-activation) so the
      local verify loop does not also pay for the aarch64 cross-build.
    cmds:
      - task: xwin-build-x86:exec

  verify:windows-activation:
    desc: Run the Windows shell-activation gate via WSL interop (local-only; needs /mnt/c)
    summary: |
      Cross-builds the x86_64 Windows binary (build:windows:x86), then runs
      test/manual/test-windows-activation.ps1 under Windows PowerShell 5.1 and
      (if installed) PowerShell 7 through WSL interop. Verifies that the
      `ocx self activate` stream and the install.ps1-generated env.ps1 parse and
      activate cleanly on real Windows interpreters — the platform the original
      parse-error cascade shipped on.

      WSL-on-Windows only: a plain Linux/CI host with no /mnt/c interop skips
      gracefully (CI covers Windows natively in verify-deep.yml). Override the
      interpreter paths with OCX_WINPS / OCX_PWSH if they live off the defaults.
    deps:
      - task: build:windows:x86
    cmd: bash {{.ROOT_DIR}}/test/manual/run-windows-activation.sh

  # ---------------------------------------------------------------------------
  # Structural checks of the crate split (plan WP-02). Appended here so the
  # tasks WP-04 inserts after `clippy:check` merge cleanly.
  # ---------------------------------------------------------------------------

  deps:direction:
    desc: Every ocx_* dependency edge is in scripts/crate_map.toml (C-009)
    summary: |
      Runs the `deps_direction` guards of
      crates/ocx_test_support/tests/workspace_structure.rs:
      the live check over the `cargo metadata` resolve graph (aliases and
      target-specific tables included) plus its synthetic-metadata unit tests.
      A disallowed edge reds naming `from -> to`.
    deps:
      - install:nextest
    # `--release` so it shares `test:unit`'s artifacts instead of a second debug build.
    # `--no-tests=fail`: the trailing word is a name substring, so a rename
    # selects zero tests. Without it the verdict is the installed nextest's
    # default, and nextest is unpinned here — a zero-test green would be a
    # toolchain accident rather than a property of this repository.
    cmd: cargo nextest run -p ocx_test_support --test workspace_structure --release --locked --no-tests=fail deps_direction

  test:loop-guard:
    desc: No test holds a loop whose body can neither fail nor be observed
    summary: |
      Runs the `inert` guards of
      crates/ocx_test_support/tests/workspace_structure.rs: the walk over every
      `crates/*/src` plus the red/green cases that pin the predicate itself.
      A loop inside test code whose body holds no call, macro, assignment,
      `.await`, `?` or wildcard-free `match` reds naming the file, the line and
      the keyword — the shape WP-10's in-place strip left behind thirteen
      times, which compiled and passed.

      Reachable without this entry (`test:unit` runs the whole workspace and
      the `verify:scoped` manifest route runs this target), so it gates
      nothing on its own; it exists because the crate-split batches want the
      guard alone, in seconds, between moves.
    deps:
      - install:nextest
    # `--release` so it shares `test:unit`'s artifacts instead of a second debug build.
    # `--no-tests=fail`: the trailing word is a name substring, so a rename
    # selects zero tests. Without it the verdict is the installed nextest's
    # default, and nextest is unpinned here — a zero-test green would be a
    # toolchain accident rather than a property of this repository.
    cmd: cargo nextest run -p ocx_test_support --test workspace_structure --release --locked --no-tests=fail inert

  # The unit-test set never shrinks or goes quiet (C-070). Both checks are
  # `cmds:` entries, never `preconditions:`, so `task --force` cannot skip
  # them; Linux only because cfg-gated tests make the counts platform-dependent.
  test:floor:
    desc: Fail when nextest lists fewer tests than crates/NEXTEST_FLOOR (Linux)
    summary: |
      `cargo nextest list --message-format json` over the whole workspace, in
      the release profile `test:unit` uses so the binaries are shared. The
      floor is held at its initial value until WP-37 re-baselines it.

      Opens the bracket: the previous run log is deleted here, so the Summary
      line `test:ceiling` reads can only come from the `test:unit` between
      the two — a log from an earlier or a subset run is never a verdict.
    platforms: [linux]
    deps:
      - install:nextest
    cmds:
      - rm -f {{.NEXTEST_RUN_LOG}}
      - >-
        set -o pipefail;
        floor=$(cat {{.ROOT_DIR}}/crates/NEXTEST_FLOOR);
        count=$(cargo nextest list --workspace --release --locked --message-format json
        | python3 -c 'import json, sys; suites = json.load(sys.stdin)["rust-suites"]; print(sum(len(s["testcases"]) for s in suites.values()))');
        [ -n "$count" ] || { echo "nextest floor: no test count from nextest list" >&2; exit 1; };
        [ "$count" -ge "$floor" ] || {
          echo "nextest floor: $count tests listed, floor is $floor (crates/NEXTEST_FLOOR) — the unit-test set shrank" >&2; exit 1; };
        echo "nextest floor: $count tests listed (floor $floor)"

  test:ceiling:
    desc: Fail when more tests than crates/NEXTEST_SKIP_CEILING were skipped (Linux)
    summary: |
      Same two arms as `test:unit`, selected by the same `OCX_TEST_ENGINE`, and
      for a reason: the two engines leave different evidence behind.

      `cargo` — the default — parses the Summary line of the run `test:unit`
      tee'd to target/nextest/run.log. That reading carries a second property
      the listing cannot: the log came from *this* bracket, so a green here
      says a run happened. Run `task rust:test:floor` then `task
      rust:test:unit` first — the floor deletes the previous log.

      `bazel` — there is no nextest Summary line to read, because nextest did
      not run. The count comes from `cargo nextest list` instead, through
      `scripts/bazel_floor_proofs.py --check`, which WP-18 measured against the
      run it replaces: 8223 listed testcases, 8 of them `#[ignore]`, against a
      run reporting `8215 tests run … 8 skipped`. 8223 − 8215 = 8, exact. That
      makes the ceiling a declaration check like `test:floor`, and buys the
      property C-013 asks for by construction rather than by promise: its only
      input is a listing, so no amount of Bazel cache hits can reach it.
      What it gives up is the bracket — under this arm the assertion that a
      run happened is `test:unit:bazel`'s own exit code and target floor.

      Shaped differently from `test:unit`'s two arms, deliberately. `test:unit`
      dispatches to `test:unit:{{.ENGINE}}` and lets an unknown engine red as a
      missing task; the cargo arm here stays *inline*, because
      `scripts/bazel_floor_proofs.py`'s C-012 proof reads this task's own
      `cmds:` as its live specimen of a recipe that reads a run artifact — the
      red half that stops the floor predicate from being a check that passes
      everything. Move the Summary parser into a sub-task and that proof goes
      green with nothing left to separate it from the floor. The engine is
      therefore validated in the shell here, in the first `case`, and never by
      the dispatch.
    platforms: [linux]
    vars:
      ENGINE: '{{.OCX_TEST_ENGINE | default "cargo"}}'
    cmds:
      - >-
        case '{{.ENGINE}}' in cargo) ;; bazel) exit 0;; *)
        echo "nextest ceiling: OCX_TEST_ENGINE is '{{.ENGINE}}' — expected cargo or bazel" >&2; exit 1;; esac;
        python3 {{.ROOT_DIR}}/scripts/nextest_ceiling.py --log {{.NEXTEST_RUN_LOG}}
      - task: test:ceiling:bazel
        vars: { ENGINE: '{{.ENGINE}}' }

  test:ceiling:bazel:
    internal: true
    summary: |
      The Bazel arm of `test:ceiling`, a no-op under any other engine — the
      guard is the first thing in the recipe and `test:ceiling`'s own `case`
      has already refused anything that is neither `cargo` nor `bazel`, so
      there is no third value under which both arms fall through and the task
      greens having judged nothing.

      `--check` evaluates C-012 and C-013 off one listing, and reports the two
      readings of "skipped" separately: `ignored` is the `#[ignore]` attribute,
      `filter-match` is the decision a run would take. They agree on this tree
      — 8 and 8, under `profile.default` and under `profile.ci` alike — and
      part company the moment a filter narrows the universe, which is why
      `{{.CLI_ARGS}}` is forwarded verbatim: the listing must be taken under
      the same `--profile` the caller named for the run, or the ceiling judges
      a universe the caller never asked for. Their disagreement is a finding
      (`ceiling-split`), never a silent choice between them. Reproduced live at
      a narrowing `-E`: 8 carrying `#[ignore]` against 39 filtered out, exit 1.

      A subset listing reds rather than quietly shrinking the count: the script
      floors on 36 rust-suites first, so `-- <filter>` is no more a verdict
      here than a subset run is on the nextest arm.

      No `deps: install:nextest`. Every route that reaches a ceiling runs
      `test:floor` first — `.verify:build-test`, `rust:verify` and
      verify-basic.yml all order floor → unit → ceiling — and that task carries
      the dep. Repeating it here costs a `cargo install` round trip on every
      `task verify`, on the arm that is a no-op.
    cmds:
      - >-
        [ '{{.ENGINE}}' = bazel ] || exit 0;
        set -o pipefail;
        listing=$(mktemp); trap 'rm -f "$listing"' EXIT;
        cargo nextest list --workspace --release --locked --message-format json {{.CLI_ARGS}} > "$listing";
        python3 {{.ROOT_DIR}}/scripts/bazel_floor_proofs.py --check --listing "$listing"

  test:duration:
    desc: Fail when a unit test in the last run took a second or more and is not in crates/NEXTEST_SLOW_ALLOWLIST (Linux)
    summary: |
      The one-second budget over every unit test, read off the same
      target/nextest/run.log `test:ceiling` parses and from inside the same
      bracket — `test:floor` deletes the log, so a duration read here can only
      be this run's. Run `task rust:test:floor` then `task rust:test:unit`
      first.

      **What a green here claims, exactly: every unit test that runs in the
      Linux unit suite is under 1 second.** Not "every unit test on every
      platform" — `platforms: [linux]`, the guard `test:floor` and
      `test:ceiling` already carry because cfg-gated tests make the counts
      platform-dependent. The gap is real and named rather than papered over:
      `verify-deep.yml`'s `Build & Unit Test` matrix runs **raw**
      `cargo nextest run --workspace --target=… --profile ci --locked` on
      Linux, macOS and Windows, not through `task`, so this gate never judges
      the macOS or Windows legs; `build-windows-shims.yml` runs three crates
      the same way. Extending the gate there would be worse than the gap: deep
      is moving to manual dispatch, so a copy of this step living on it would
      be a green nobody can tell from one that never ran.

      A unit test is a function call with its dependencies faked; one that
      takes a second is waiting on something real — a lock timeout, a retry
      backoff, a process start, a whole-tree scan — and every gate run on every
      runner pays for it again. The suite is 8215 tests, 81 s on a dev box and
      ~3.5 min on CI, so a handful of second-long tests is a measurable share
      of the whole.

      **Hard on CI, advisory elsewhere.** With `CI` set — which GitHub Actions
      always sets — an over-budget test no allowlist line covers fails the run.
      Without it the same findings print and the run exits 0. Wall clock on a
      shared machine measures a test's neighbours rather than the test: four
      tests taking 6 ms to 190 ms quiet, and 12 ms to 160 ms on CI, were
      measured at 1.0-1.2 s on a 32-core box under load 27. Allowlisting those
      would file a false reason for tests that are fast everywhere it matters,
      and a gate that reds on a busy laptop for code nobody touched is a gate
      someone turns off.

      It is not an off-switch, and the mode line says so on every run:
      `verify-basic.yml`'s smoke job runs on **every pull request** with `CI`
      set, so the hard mode runs on every change, and `.claude/tests/` asserts
      that step's presence. Both modes name themselves on every run, green or
      red — a reader must never have to infer whether the run in front of them
      could have failed. Only the *budget verdict* is advisory: a log this
      reader cannot judge and an unbounded allowlist pattern fail in both
      modes, being wiring faults rather than slow tests.

      A load-average check was the alternative and is the wrong instrument: a
      nextest run saturates the box by design, so load at gate time describes
      the gate's own moment, not the conditions each duration was measured
      under. `CI` is a fact about where this runs; load is a guess about what
      it meant.

      **Headroom.** The budget is 1.0 s of wall clock as observed on the run's
      own log. ubuntu-latest measures roughly 2x this project's dev box for the
      scan-heavy tests and worse for process-spawning ones, and CI is where the
      gate gates — so a test sitting above ~0.7 s on CI is a latent red, not a
      pass. Once the allowlist's debt rows land fast, the slowest unlisted test
      on CI is about 0.8 s, which is thin on purpose. The budget does NOT get
      raised above 1.0 s to buy headroom; 1.0 s is the contract.

      `crates/NEXTEST_SLOW_ALLOWLIST` is the tolerated set, one line per entry
      with a `#` reason above it. A line is an `fnmatch` pattern, which for an
      entry carrying no metacharacter is plain equality — a pattern is for a
      family slow for one structural reason, so `ocx_shell *live_*` holds the
      whole live-interpreter family as one line that cannot rot into a dozen
      stale ones. Those spawn a real pwsh, nu, elvish or fish and their cost is
      process start; everything else stays an exact id marked
      `# TODO(fast-unit-tests):`, so that grep remains the deletion list. An
      `#[ignore]` added to dodge this gate is not a fix and lands on
      `test:ceiling` instead.

      A pattern is also a new way for a gate to go silently permissive, so an
      UNBOUNDED one is refused by the reader rather than trusted: a line
      matching an id that belongs to no crate allows the whole workspace, and
      one fat-fingered `*` would disable this gate while the file still read as
      a careful list. scripts/tests/test_unit_test_duration_gate.py shows that refusal red, shows a
      pattern matching nothing still redding the slow test, and runs the
      shipped allowlist through the same reader.

      scripts/unit_test_duration_gate.py refuses to report on a log whose timed
      result lines number fewer than crates/NEXTEST_FLOOR: a subset run, a
      truncated log or a nextest grammar reshape each leave it with nothing to
      complain about, and a reader that read nothing is not a green.
      scripts/tests/test_unit_test_duration_gate.py holds that state's red, and the budget's.

      It also reads a log fetched with `gh run view --log` — the line prefix
      and the `^[` spelling of the escape — so a CI run can be investigated by
      hand: `python3 scripts/unit_test_duration_gate.py <fetched-log>`.
    platforms: [linux]
    # `{{.CLI_ARGS}}` forwards overrides (`-- --allowlist <file>
    # --budget-seconds 1.0`); on the gate's route it is empty and the
    # script's own defaults apply.
    cmd: python3 {{.ROOT_DIR}}/scripts/unit_test_duration_gate.py {{.NEXTEST_RUN_LOG}} {{.CLI_ARGS}}

