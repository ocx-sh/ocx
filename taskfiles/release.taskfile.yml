# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  # Install cargo-edit (provides cargo set-version) if not already present.
  install:cargo-edit:
    internal: true
    cmds:
      - cargo install --locked cargo-edit
    status:
      - cargo set-version --version

  # Guard: the website embeds CHANGELOG.md, so the file is rendered as page Markdown. A raw
  # `<tag>` from a commit subject (e.g. "ocx-<name>") is emitted as an HTML element and
  # swallows the text after it. The template cliff.toml HTML-escapes angle brackets; this
  # fails loudly if that escaping ever regresses. FILE defaults to CHANGELOG.md; a scratch
  # `git-cliff --unreleased` output can be checked the same way.
  changelog:validate:
    internal: true
    vars:
      FILE: '{{.FILE | default "CHANGELOG.md"}}'
    cmds:
      - |
        if grep -nE '<[A-Za-z/]' '{{.FILE}}'; then
          echo "ERROR: {{.FILE}} contains raw HTML tags (lines above)." >&2
          echo "git-cliff escaping regressed; the website build will fail." >&2
          exit 1
        fi
      # Same embed, second failure mode: a repo-root-relative doc link resolves against the
      # changelog page and dies as a dead link. The template cliff.toml renders a commit's
      # subject only and carries no link rewrite, so a subject must not cite a doc path.
      - |
        if grep -nE 'website/src/(content/)?docs/' '{{.FILE}}'; then
          echo "ERROR: {{.FILE}} contains repo-root-relative doc paths (lines above)." >&2
          echo "A commit subject cites a website doc path; reword it without the path (the subject is the changelog line)." >&2
          exit 1
        fi

  # Regenerate CHANGELOG.md from the full git history.
  changelog:
    desc: Update CHANGELOG.md from git history
    cmds:
      - git-cliff --output CHANGELOG.md
      - task: changelog:validate

  # Show what would go into the next release's changelog section.
  changelog:preview:
    desc: Preview unreleased changes
    cmds:
      - git-cliff --unreleased

  # The release provenance guard, on real bytes and both ways (ADR
  # adr_test_speed_tiers.md C-PROV, Amendment AM-2). `scripts:self-test` only
  # shows the guard red on synthetic fixtures; whether a real release build's
  # dependency bytes stay clear of the markers can only be answered by
  # scanning one. So: a release build of `ocx` without `__testing`, in its own
  # target dir, must scan GREEN, and the acceptance binary — Bazel's
  # `//crates/ocx_cli:ocx`, copied to test/bin/ocx, whose placeholders come from
  # `crates/ocx_cli/BUILD.bazel` since Bazel never runs `build.rs` — must scan
  # RED: exit 1 with a marker line, not merely non-zero: a crash or a usage
  # error is not the red this proves.
  provenance:proof:
    desc: Prove the release provenance scan on real bytes — green on a release build, red on the __testing build
    dir: '{{.ROOT_DIR}}'
    vars:
      PROOF_TARGET_DIR: '{{.ROOT_DIR}}/target/provenance-proof'
    cmds:
      - task: :test:.build-binaries
      - cargo build --release -p ocx --locked --target-dir "{{.PROOF_TARGET_DIR}}"
      - python3 scripts/release_provenance_check.py --scan "{{.PROOF_TARGET_DIR}}/release/ocx{{exeExt}}"
      - |
        status=0
        out=$(python3 scripts/release_provenance_check.py --scan "test/bin/ocx{{exeExt}}" 2>&1) || status=$?
        printf '%s\n' "$out"
        if [ "$status" -ne 1 ] || ! printf '%s\n' "$out" | grep -q "marker 'placeholder-g00000000'"; then
          echo "release:provenance:proof: the __testing build scanned exit $status without a marker line — the scan cannot tell a test build from a release" >&2
          exit 1
        fi
        echo "release:provenance:proof: release build green, __testing build red"

  # The release step of `ocx.sh/ocx/sdkgen` (plan_ocx_interface_contract.md
  # C-034): `ocx-sdkgen` packaged as an OCX package, pushed and signed keyless by
  # `.github/workflows/sdkgen-publish.yml` at release. Nothing here pushes or
  # signs; `sdkgen:dry-run` is the whole step minus the registry.
  #
  #   task release:sdkgen:dry-run                          # build + package for this host
  #   task release:sdkgen:package BIN=<path> PLATFORM=<p> OUT=<dir>   # package a built binary
  sdkgen:package:
    desc: Package ocx-sdkgen as ocx.sh/ocx/sdkgen into OUT/ocx-sdkgen.tar.xz (BIN and PLATFORM together name a built binary; default builds this host's)
    dir: '{{.ROOT_DIR}}'
    # Read as "$VAR", never templated into the script: a CLI value is shell text otherwise.
    env:
      BIN: '{{.BIN | default ""}}'
      PLATFORM: '{{.PLATFORM | default ""}}'
      OUT: '{{.OUT | default (printf "%s/target/sdkgen-package" .ROOT_DIR)}}'
    cmds:
      - |
        set -euo pipefail
        if [ -n "$BIN" ] && [ -z "$PLATFORM" ]; then
          echo "release:sdkgen:package: BIN names a binary built elsewhere, so PLATFORM must say what it runs on" >&2; exit 1
        fi
        if [ -z "$BIN" ]; then
          cargo build --release --locked -p ocx_sdkgen
          BIN="target/release/ocx-sdkgen"
          # A host build is dynamically linked, so a Linux platform declares its libc
          # (`ocx package create` refuses an undeclared one); CI's musl builds are static.
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) PLATFORM=linux/amd64+libc.glibc ;;
            Linux-aarch64) PLATFORM=linux/arm64+libc.glibc ;;
            Darwin-x86_64) PLATFORM=darwin/amd64 ;;
            Darwin-arm64) PLATFORM=darwin/arm64 ;;
            *) echo "release:sdkgen:package: no default platform for $(uname -s)-$(uname -m); pass BIN and PLATFORM" >&2; exit 1 ;;
          esac
        fi
        ext=""
        case "$BIN" in *.exe) ext=".exe" ;; esac
        mkdir -p "$OUT"
        rm -rf "$OUT/content"
        mkdir -p "$OUT/content/bin"
        install -m 0755 "$BIN" "$OUT/content/bin/ocx-sdkgen${ext}"
        # A redistribution of the binary owes recipients the same notices as
        # the release archive (oci-publish.yml does the same for ocx/cli).
        install -m 0644 LICENSE LICENSE-THIRD-PARTY.md "$OUT/content/"
        ocx package create "$OUT/content" \
          -m packaging/sdkgen/metadata.json \
          -o "$OUT/ocx-sdkgen.tar.xz" \
          -p "$PLATFORM" \
          --force
        echo "release:sdkgen:package: $OUT/ocx-sdkgen.tar.xz ($PLATFORM)"

  # The signing contract, as runnable checks: the signer identity a keyless
  # signature from the workflow carries must match the trust policy SDK
  # repositories pin, `id-token: write` must sit on the signing job alone, and
  # every job must be guarded to this repository (the workflow is callable from
  # any repository, and its certificate names the workflow, not the caller).
  # Each is shown to fail as well as pass by its mismatch arms below.
  sdkgen:check:
    desc: Check the ocx-sdkgen release wiring - the signer identity matches the trust policy, only the sign job holds id-token write, and every job is guarded to ocx-sh/ocx
    dir: '{{.ROOT_DIR}}'
    cmds:
      - |
        python3 - <<'PY'
        import re, sys, tomllib

        WORKFLOW = ".github/workflows/sdkgen-publish.yml"
        POLICY = "packaging/sdkgen/trust-policy.toml"
        failures = []

        # 1. id-token: write is on the `sign` job and nowhere else.
        holders, seen, job = [], [], None
        guarded = set()
        in_jobs = False
        for line in open(WORKFLOW, encoding="utf-8").read().splitlines():
            if line == "jobs:":
                in_jobs = True
                continue
            m = re.match(r"^  ([a-z][a-z0-9-]*):\s*$", line)
            if in_jobs and m:
                job = m.group(1)
                seen.append(job)
            if re.match(r"^\s*id-token:\s*write\b", line):
                holders.append(job if in_jobs else "<workflow level>")
            # A job-level `if:` sits at four spaces, which no step key does.
            if in_jobs and job and re.match(r"^    if:.*github\.repository == 'ocx-sh/ocx'", line):
                guarded.add(job)
        if len(seen) < 4:
            failures.append(f"read {len(seen)} jobs from {WORKFLOW}, expected at least 4: the reader stopped")
        if holders != ["sign"]:
            failures.append(f"id-token: write is held by {holders}, expected exactly ['sign']")

        # 1b. Every job is guarded to the home repository: `github.repository`
        # is the caller's in a reusable workflow, and the signing identity names
        # the workflow, so an unguarded job signs for any repository that calls it.
        for j in seen:
            if j not in guarded:
                failures.append(f"job {j} has no job-level `if: ... github.repository == 'ocx-sh/ocx'`")

        # 2. A Fulcio certificate from the workflow names `job_workflow_ref`.
        policy = tomllib.load(open(POLICY, "rb"))["trust"]["policy"]
        signers = [s for p in policy for s in p["signers"] if s["kind"] == "keyless"]
        if len(signers) != 1:
            failures.append(f"{POLICY} must carry one keyless signer, found {len(signers)}")
        else:
            rx = re.compile(signers[0]["identity_regexp"])
            base = "https://github.com/ocx-sh/ocx/" + WORKFLOW
            for ref, expect in [("refs/tags/v1.2.3", True), ("refs/heads/main", False), ("refs/tags/v1.2.3-rc.1", False)]:
                got = rx.search(base + "@" + ref) is not None
                if got != expect:
                    failures.append(f"identity {base}@{ref}: policy match is {got}, expected {expect}")
            other = rx.search("https://github.com/ocx-sh/ocx/.github/workflows/release.yml@refs/tags/v1.2.3")
            if other:
                failures.append("the policy also accepts release.yml, which holds no signing step")

        for f in failures:
            print("release:sdkgen:check:", f, file=sys.stderr)
        if failures:
            sys.exit(1)
        print("release:sdkgen:check: id-token: write on", holders, "; repository guard on", sorted(guarded), "; identity matches", POLICY)
        PY

  sdkgen:dry-run:
    desc: Dry run of the ocx.sh/ocx/sdkgen release step - build and package ocx-sdkgen for this host, never push or sign
    cmds:
      - task: sdkgen:check
      - task: sdkgen:package

  # The hooks the conventions baseline's `release:prepare` calls (`task release:prepare BUMP=...`, flattened
  # from taskfiles/baseline.taskfile.yml): gate -> bump-files -> git-cliff -> validate -> verify. It never
  # tags or pushes (workflow-release.md).
  gate:
    desc: 'Release gate: a fresh full verify mark (commit_gate.py --require-full-mark) and the release provenance proof'
    dir: '{{.ROOT_DIR}}'
    cmds:
      # The predicate the commit gate applies to a `release:` subject, run from the same module so the two
      # cannot drift. `task verify:mark` writes a scoped mark and does not satisfy it; `task verify` does.
      - python3 "{{.ROOT_DIR}}/scripts/commit_gate.py" --require-full-mark "{{.ROOT_DIR}}"
      # Before any file is touched: a release whose build would carry test provenance stops here, not
      # after the version bump.
      - task: provenance:proof

  bump-files:
    desc: 'Set the release version in the workspace manifests (cargo set-version); VERSION=x.y.z'
    deps:
      - install:cargo-edit
    requires:
      vars: [VERSION]
    cmds:
      - cargo set-version "{{.VERSION | trimPrefix "v"}}"

  validate:
    desc: 'Validate what the release rewrote (changelog:validate)'
    cmds:
      - task: changelog:validate

  verify:
    desc: 'The release verification gate: task verify NOCACHE=1'
    cmds:
      # A fresh process, not `task: :verify`: NOCACHE reaches `bazel:test:accept` as a CLI var (CLI vars are
      # global; a `vars:` on a task call is not), and a release re-executes every acceptance module
      # instead of trusting cached verdicts.
      - '{{.TASK_EXE}} verify NOCACHE=1'

  # Step 3 of the release flow (workflow-release.md): the tag exists only after readiness is green on
  # this exact commit. `release:prepare` cannot ask - the bump commit it prepares does not exist
  # while it runs - so the refusal sits on the step that creates the tag. `readiness-gate.yml`
  # asks again on the tagged commit before `host` can publish.
  tag:
    desc: 'Tag HEAD (the `release: vX` commit) and push it with main atomically, once a green readiness run exists for it'
    dir: '{{.ROOT_DIR}}'
    cmds:
      - |
        set -euo pipefail
        version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
        subject=$(git log -1 --format=%s)
        if [ "$subject" != "release: v$version" ]; then
          echo "release:tag: HEAD is '$subject', expected 'release: v$version' - tag the commit release:prepare prepared" >&2
          exit 1
        fi
        # Every non-zero refuses: 1 no run for this SHA, 69 gh missing or unauthenticated, 74 gh failed.
        python3 scripts/release_readiness_gate.py --sha "$(git rev-parse HEAD)"
        git tag "v$version"
        # A rejected push must not leave the tag behind: the next run's `git tag` would refuse it.
        git push --atomic origin HEAD:main "v$version" || {
          status=$?
          git tag -d "v$version" >&2
          echo "release:tag: push failed ($status); local tag v$version deleted" >&2
          exit "$status"
        }
