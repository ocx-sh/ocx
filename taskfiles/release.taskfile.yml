# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  # Install cargo-edit (provides cargo set-version) if not already present.
  install:cargo-edit:
    internal: true
    cmds:
      - cargo install --locked cargo-edit
    status:
      - cargo set-version --version

  # Guard: the website embeds CHANGELOG.md via a VitePress @include, so the file
  # is compiled as a Vue template. A raw `<tag>` from a commit subject (e.g.
  # "ocx-<name>") breaks the build with "Element is missing end tag". cliff.toml
  # HTML-escapes angle brackets; this fails loudly if that escaping ever regresses.
  changelog:validate:
    internal: true
    cmds:
      - |
        if grep -nE '<[A-Za-z/]' CHANGELOG.md; then
          echo "ERROR: CHANGELOG.md contains raw HTML/Vue tags (lines above)." >&2
          echo "git-cliff escaping regressed; the website (VitePress) build will fail." >&2
          exit 1
        fi
      # Same @include, second failure mode: a repo-root-relative doc link resolves
      # against src/docs/changelog.md and dies as a dead link. cliff.toml rewrites
      # these to absolute ocx.sh URLs; this fails loudly if that rewrite regresses.
      - |
        if grep -n 'website/src/docs/' CHANGELOG.md; then
          echo "ERROR: CHANGELOG.md contains repo-root-relative doc links (lines above)." >&2
          echo "git-cliff link rewriting regressed; the website (VitePress) build will fail." >&2
          exit 1
        fi

  # Regenerate CHANGELOG.md from the full git history.
  changelog:
    desc: Update CHANGELOG.md from git history
    cmds:
      - git-cliff --output CHANGELOG.md
      - task: changelog:validate

  # Show what would go into the next release's changelog section.
  changelog:preview:
    desc: Preview unreleased changes
    cmds:
      - git-cliff --unreleased

  # The release provenance guard, on real bytes and both ways (ADR
  # adr_test_speed_tiers.md C-PROV, Amendment AM-2). `scripts:self-test` only
  # shows the guard red on synthetic fixtures; whether a real release build's
  # dependency bytes stay clear of the markers can only be answered by
  # scanning one. So: a release build of `ocx` without `__testing`, in its own
  # target dir, must scan GREEN, and the acceptance binary — Bazel's
  # `//crates/ocx_cli:ocx`, copied to test/bin/ocx, whose placeholders come from
  # `crates/ocx_cli/BUILD.bazel` since Bazel never runs `build.rs` — must scan
  # RED: exit 1 with a marker line, not merely non-zero: a crash or a usage
  # error is not the red this proves.
  provenance:proof:
    desc: Prove the release provenance scan on real bytes — green on a release build, red on the __testing build
    dir: '{{.ROOT_DIR}}'
    vars:
      PROOF_TARGET_DIR: '{{.ROOT_DIR}}/target/provenance-proof'
    cmds:
      - task: :test:.build-binaries
      - cargo build --release -p ocx --locked --target-dir "{{.PROOF_TARGET_DIR}}"
      - python3 scripts/release_provenance_check.py --scan "{{.PROOF_TARGET_DIR}}/release/ocx{{exeExt}}"
      - |
        status=0
        out=$(python3 scripts/release_provenance_check.py --scan "test/bin/ocx{{exeExt}}" 2>&1) || status=$?
        printf '%s\n' "$out"
        if [ "$status" -ne 1 ] || ! printf '%s\n' "$out" | grep -q "marker 'placeholder-g00000000'"; then
          echo "release:provenance:proof: the __testing build scanned exit $status without a marker line — the scan cannot tell a test build from a release" >&2
          exit 1
        fi
        echo "release:provenance:proof: release build green, __testing build red"

  # Full release preparation: compute next version, update Cargo.toml + CHANGELOG, run verify.
  # After this task succeeds, the human reviews and commits.
  #
  # Version selection:
  #   task release:prepare                 # interactive menu: auto | patch | minor | major
  #   task release:prepare BUMP=minor      # skip the menu, force a bump level
  #   task release:prepare BUMP=auto VERSION=1.4.0   # pin an exact version (v prefix optional)
  #
  # BUMP is a required enum: with interactive mode on (.taskrc.yml) and a TTY it
  # renders a selection menu; on CI / no TTY it must be passed on the CLI.
  prepare:
    desc: 'Prepare a release (interactive: pick auto|patch|minor|major; or BUMP=<level> / VERSION=x.y.z)'
    deps:
      - install:cargo-edit
    requires:
      vars:
        - name: BUMP
          enum: [auto, patch, minor, major]
    vars:
      # git-cliff computes the next version from git history. `auto` lets it pick
      # the bump from conventional commits; otherwise BUMP forces the level.
      # VERSION pins an exact value and wins over BUMP.
      NEXT_VERSION:
        sh: |
          if [ -n "{{.VERSION}}" ]; then
            printf 'v%s' "{{.VERSION | default "" | trimPrefix "v"}}"
          elif [ "{{.BUMP}}" = "auto" ]; then
            git-cliff --bumped-version
          else
            git-cliff --bumped-version --bump "{{.BUMP}}"
          fi
    cmds:
      # Refuse without a fresh *full* verify mark — the predicate the commit
      # gate applies to a `release:` subject, run from the same module so the
      # two cannot drift. `task verify:mark` writes a scoped mark and does not
      # satisfy it; `task verify` does.
      - python3 {{.ROOT_DIR}}/scripts/commit_gate.py --require-full-mark {{.ROOT_DIR}}
      # Before any file is touched: a release whose build would carry test
      # provenance stops here, not after the version bump.
      - task: provenance:proof
      - echo "Next version:{{.NEXT_VERSION}}"
      - cargo set-version "{{.NEXT_VERSION | trimPrefix "v"}}"
      - git-cliff --tag "{{.NEXT_VERSION}}" -o CHANGELOG.md
      - task: changelog:validate
      # NOCACHE=1 reaches `bazel:test:accept` (CLI vars are global), which runs
      # every acceptance module with `--nocache_test_results`: a release
      # re-executes the suite instead of trusting cached verdicts.
      - task verify NOCACHE=1
      - |
        echo ""
        echo "Release prepared ({{.NEXT_VERSION}}). Review changes, then:"
        echo "  git add -A && git commit -m 'release: {{.NEXT_VERSION}}'"
        echo "  git tag {{.NEXT_VERSION}}"
        echo "  git push --atomic origin main {{.NEXT_VERSION}}"
